versaire. La prise en charge des échéances de remboursement s’applique pendant la durée de votre invalidité proportionnellement à cette durée.\n\n6.3 Prestations L’Assureur verse les prestations au Prêteur selon la Franchise souscrite à l’adhésion à compter du 16ème, 31ème, 61ème, 91ème, 121ème ou du 181ème jour d’incapacité continue et complète de travail, décompté à partir du premier jour d’arrêt de travail.", "6.3.1 Base de calcul\n\nL’indemnité versée par l’Assureur est calculée suivant l’option choisie par l’Assuré à l’adhésion :\n\n- sur la base des échéances de Prêt affectées de la Quotité Assurée, si vous avez opté pour l’I.PT. (dans ce cas, l’option « I.P.T. en capital » ne doit pas être souscrite). Dans ce cas, les échéances trimestrielles, semestrielles ou annuelles sont décomposées en échéances mensuelles égales. L’Assureur verse les prestations mensuellement, au prorata du nombre de jours justifiés. Pour les Prêts relais et in fine, ainsi que le cas échéant, pendant la période de différé d’amortissement pour les Prêts amortissables, seules les échéances d’intérêts sont prises en charge par l’Assureur. Pour les crédits-bails, seuls les loyers sont pris en charge. L’Echéance ne couvre pas, le remboursement du capital pour les Prêts In Fine et les Prêts Relais, ni le remboursement de la valeur résiduelle pour les opérations de financement Crédit-bail. En aucun cas, le remboursement anticipé partiel du capital intervenant pendant une période d’ITT, IPT, IPP n’est pris en charge par l’assureur.\n\nLes prestations ne peuvent pas être supérieures aux montants garantis à la date de survenance du sinistre indemnisé tels que prévus sur le tableau d’amortissement en vigueur au jour du Sinistre et dans la limite du montant indiqué sur le dernier avenant à l’adhésion entériné par l’Assureur.\n\n- sur la base du Capital Restant Dû à la date de la reconnaissance de l’I.P.T. par l’Assureur, si vous avez souscrit l’option « I.P.T. en capital », dans la limite du montant garanti tel qu’indiqué au certificat d’adhésion.\n\nDans ce cas, l’Assureur prend en charge :\n\n- Pour les Prêts amortissables et les Prêts à paliers : 100% du Capital Restant Dû (multiplié par la Quotité Assurée) au jour de la reconnaissance de l’état d’IPT par l’Assureur, conformément au tableau d’amortissement en vigueur au jour du Sinistre et dans la limite du montant indiqué sur le dernier avenant entériné par l’Assureur. Concernant les Prêts à paliers intégrant les Prêts achat-revente, si l’Assuré est reconnu en état d’IPT avant le remboursement anticipé partiel et programmé du capital provenant de la vente de l’ancien bien de l’Emprunteur, le versement est effectué sur la base du Capital Restant Dû déduction faite de ce remboursement programmé.\n\n- Pour les contrats de crédit-bail : la somme des loyers restant dus au jour de la reconnaissance de l’état d’IPT par l’Assureur, augmentée de la valeur résiduelle du bien financé, conformément à l’échéancier de loyers en vigueur au jour du Sinistre et dans la limite du montant indiqué sur le dernier avenant entériné par l’Assureur.\n\n- Le versement sous forme de capital en cas d’IPT met fin à l’ensemble des garanties, sous réserve que le capital versé au titre de l’IPT soit égal au Capital Restant Dû multiplié par la Quotité Assurée au titre de la garantie Décès/PTIA.\n\n- Si le capital versé au titre de l’IPT est inférieur au Capital Restant Dû multiplié par la Quotité Assurée au titre de la garantie Décès/PTIA, l’Assuré reste couvert au titre des garanties Décès et PTIA, pour un montant égal au Capital Restant Dû multiplié par la Quotité Assurée Décès/PTIA, déduction faite du capital déjà versé au titre de l’IPT.\n\nSouscription simultanée des garanties I.P.T. et I.P.PRO :\n\n- Dans le cas particulier, où, lors d’un sinistre, l’Assuré serait reconnu simultanément par l’Assureur en état d’I.P.T. et d’I.P.PRO, le Capital Restant Dû multiplié par la Quotité Assurée au titre des garanties I.P.T. et I.P.PRO ne sera versé qu’une fois, au titre de la garantie I.P.PRO. Ce versement mettra fin aux garanties I.P.T., I.P.P. et I.P.PRO. Ne sont pas pris en compte :\n\n• les augmentations d’échéances intervenant pendant la prise en charge d’un sinistre par l’Assureur au titre de l’une des garanties, • le remboursement partiel ou total du capital emprunté anticipé ou non, • les échéances des remboursements de Prêts ayant un différé total d’une durée supérieure à 36 mois, sauf pour les Prêts à taux zéro, • les retards de paiement d’échéances, les pénalités ou intérêts de retard appliqués par le Prêteur, • le remboursement du capital pour les Prêts relais et les Prêts in fine, • l’option d’achat pour les crédit-bail\n\n6.3.2 Montant des prestations\n\nL’indemnité versée par l’Assureur est fonction du tableau ci-dessous.\n\nGaranties Taux de prise en charge des échéances de Prêt I.P.T. 100 % I.P.P. 50 %\n\n6.4 Fin des garanties et des éventuelles prestations en cours\n\nLes garanties, Invalidité Permanente Totale (I.P.T) ou Invalidité Permanente Partielle (I.P.P) cessent contractuellement dans l’un des cas visés à l’article 2.3.\n\nLes prestations dues au titre de l’Invalidité Permanente Totale (I.P.T) et de l’Invalidité Permanente Partielle (I.P.P) cesseront également d’être versées dans les cas ci-après :\n\n• en cas d’opposition de votre part au contrôle médical ou expertise médicale demandé par l’Assureur lors de la mise en jeu de la garantie ou en cours d’indemnisation, • à défaut de présentation des justificatifs demandés par l’Assureur, indispensables à la poursuite de l’indemnisation.\n\nGaranties Cas de cessation de versement des prestations\n\nPour l’I.P.T. en rente • dès que vous reprenez votre activité professionnelle à temps complet ou partiel,\n\n• si votre taux d’invalidité devient strictement inférieur à 66% que ce soit suite à un contrôle médical ou à une expertise médicale demandé par l’Assureur\n\nPour l’I.P.P. • dès que vous reprenez votre activité professionnelle, à temps complet ou partiel,\n\n• si votre taux d’invalidité devient strictement inférieur à 33% que ce soit suite à un contrôle médical ou à une expertise médicale demandé par l’Assureur.\n\nLes prestations au titre de l’Invalidité Permanente Totale (I.P.T) et de l’Invalidité Permanente Partielle (I.P.P) sont liées à la justification du degré d’invalidité, qui a ouvert droit à la prestation. Toute modification (aggravation ou amélioration) de cet état d’invalidité entraine la modification correspondante de la prestation telle que définie au point 6.2 ci-avant.\n\nToute modification à la hausse du plan d’amortissement du Prêt pendant la période d’I.P.T. ou d’I.P.P. ne sera pas prise en compte.", "ARTICLE 7 : LES GARANTIES INCAPACITE TOTALE DE TRAVAIL (I.T.T.) ET TEMPS PARTIEL THERAPEUTIQUE (T.P.T.) 7.1 Définitions des garanties\n\n7.1.1 INCAPACITE TOTALE DE TRAVAIL (I.T.T)\n\nA la suite d’une Maladie ou d’un Accident et sur prescription médicale, vous êtes temporairement dans l’impossibilité totale et continue d’exercer, même à temps partiel, votre activité professionnelle. En outre vous ne devez exercer aucune autre activité ou occupation même de surveillance ou de direction, susceptible de vous procurer salaire, gain ou profit.\n\nSi vous êtes sans activité professionnelle au jour du sinistre, vous devez être temporairement dans l’impossibilité totale et continue médicalement constatée d’effectuer, toute occupation quotidienne, usuelle et de réaliser de manière habituelle et cumulative toutes les activités ménagères et la gestion des affaires familiales et personnelles.\n\nVous bénéficiez de cette garantie tant que votre état de santé n’est pas consolidé, et dans la limite de 1095 (mille quatre-vingt-quinze) jours à compter de la date à laquelle vous vous êtes vu prescrire un repos complet et continu. L’Assuré doit suivre le traitement médical qui lui est prescrit et se soumettre au repos nécessaire à sa guérison.\n\n7.1.2 TEMPS PARTIEL THERAPEUTIQUE (T.P.T.)\n\nEn cas de reprise effective du travail à temps partiel pour raison médicale sur prescription de votre médecin traitant, l’Assureur, après une Incapacité totale de travail, versera pendant 180 (cent-quatre-vingts) jours maximum les arrérages de remboursement ou les loyers en cas de crédit-bail venant à échéance à hauteur de 50% du montant garanti sous réserve que l’Assuré ait été indemnisé pendant au moins 60 (soixante) jours au titre de l’Incapacité Temporaire Totale. Le versement des prestations est suspendu durant le Congé légal de maternité de l’Assurée, qu’elle soit ou non salariée. Toutefois, si à l’expiration de ce congé, l’Assurée ne peut pas reprendre son activité du fait de son état pathologique, les garanties du contrat entreront en vigueur à compter de l’expiration du congé sous réserve qu’avant le début de ce congé, l’Assurée ait été indemnisée pendant au moins 60 (soixante) jours au titre de l’Incapacité Temporaire Totale.\n\n7.2 Prestations\n\nL’Assureur prend en charge les prestations, selon la Franchise souscrite à l’adhésion à compter du 16ème, 31ème, 61ème, 91ème, 121ème ou du 181ème jour d’incapacité continue et complète de travail, décompté à partir du premier jour de chaque arrêt de travail. L’Assureur n’applique pas de nouvelle franchise si, après une période d’incapacité de travail (I.T.T) indemnisée par ses soins, vous avez repris une activité professionnelle pendant moins de 60 (soixante) jours et si vous êtes de nouveau en incapacité de travail pour la même Maladie ou le même Accident. Dans tous les autres cas, l’Assureur applique à nouveau la franchise souscrite à l’adhésion. En cas d’I.T.T. ou d’I.T.P. donnant droit aux versements des échéances telles que définies ci-dessus, les garanties souscrites sont maintenues avec exonération totale ou partielle du paiement des cotisations en fonction de l’option choisie à l’adhésion pendant la durée de versement de l’indemnité. La Franchise est celle de l’option choisie par l’Assuré, à l’adhésion, pour la garantie I.T.T. Cette garantie Exonération des cotisations peut être souscrite en supplément.\n\n7.3 Base de calcul\n\nL’indemnité versée par l’Assureur est calculée sur la base des échéances de Prêt selon le type de financement au moment du sinistre, affectées de la Quotité Assurée dans la limite du montant d’échéance garanti mentionné sur votre certificat d’adhésion. Pour les Prêts relais et in fine, ainsi que le cas échéant, pendant la période de différé d’amortissement pour les Prêts amortissables, seules les échéances d’intérêts et les cotisations d’assurance sont prises en charge par l’Assureur, lorsque la garantie Exonération des cotisations a été souscrite selon les modalités de l'article 9. Pour les crédits-bails, les échéances prises en compte sont les loyers venant à échéance tels qu’ils sont mentionnés au tableau d’amortissement dans la limite du montant d’Echéance garanti mentionné sur votre certificat d’adhésion.\n\nLes échéances trimestrielles, semestrielles ou annuelles sont décomposées en échéances mensuelles égales. L’Assureur verse les prestations mensuellement, au prorata du nombre de jours justifiés.\n\nNe sont pas pris en compte :\n\n• les augmentations d’échéances intervenant pendant la prise en charge d’un sinistre par l’Assureur au titre de l’une des garanties I.T.T ou T.P.T., • le remboursement partiel ou total du capital emprunté anticipé ou non, • les échéances des remboursements de Prêts ayant un différé total d’une durée supérieure à 36 mois, sauf pour les Prêts à taux zéro, • les retards de paiement d’Echéances, les pénalités ou intérêts de retard appliqués par le Prêteur, • le remboursement du capital pour les Prêts relais et les Prêts in fine, • l’option d’achat pour le crédit-bail\n\n7.4 Montant des prestations\n\nL’indemnité versée par l’Assureur est fonction du tableau ci-dessous.\n\nGaranties Taux de prise en charge des échéances de Prêt\n\nI.T.T. 100 % Plafonné à 15 000 euros par mois selon la Quotité Assuré T.P.T. 50 %\n\nLe montant total des indemnités assurées par l’Assureur, tous contrats d’assurances de financement auprès de l’Assureur et tous réseaux distributeurs confondus, est limité (sauf dérogation) par Assuré, à : 15 000 (Quinze-mille) euros par mois, au titre de la garantie l’I.T.T. Et cela dans la limite des montants indiqués au certificat d’adhésion.\n\n7.5 Fin des garanties et des éventuelles prestations en cours\n\nLes garanties Incapacité Totale de Travail (I.T.T.), et Temps Partiel Thérapeutique (T.P.T.) cessent contractuellement dans l’un des cas visés à l’article 2.3.\n\nLes prestations dues au titre de l’Incapacité Totale de Travail (I.T.T.), et Temps Partiel Thérapeutique (T.P.T.) cesseront également d’être versées dans les cas ci-après :\n\n• en cas d’opposition de votre part au contrôle médical ou expertise médicale demandé par l’Assureur lors de la mise en jeu de la garantie ou en cours d’indemnisation, • à défaut de présentation des justificatifs demandés par l’Assureur, indispensables à la poursuite de l’indemnisation. • en cas d’expertise médicale, s’il est établi que vous n’êtes pas dans l’impossibilité totale physique ou mentale de travailler, ou d’accomplir vos tâches quotidiennes usuelles si vous n’exercez pas une activité professionnelle au moment du sinistre. • à la Date de consolidation de votre état de santé • dès que vous reprenez votre activité professionnelle même à temps partiel, • au 1096ème jours à compter de la date à laquelle vous vous êtes vu prescrire un repos complet et continu.", "Toute modification à la hausse du plan d’amortissement du Prêt pendant la période d’I.T.T. ou de T.P.T. ne sera pas prise en compte.\n\nMATERNITE : la période de grossesse couverte par le congé maternité tel que prévu par le Code du Travail n’est pas considérée comme une période d’incapacité de travail. Cette disposition s’applique par assimilation aux personnes qui ne sont pas salariées.\n\nToutefois :\n\n- si à l’expiration de ce congé, l’état pathologique de l’Assurée l’empêche de reprendre son travail, les garanties du contrat entreront en vigueur comme si la cessation du travail datait de l’expiration du congé, - si avant le début de ce congé, l’Assurée était indemnisée par l’Assureur dans le cadre du présent contrat, pour une incapacité ayant un motif autre que la maternité, l’Assureur maintiendra le versement des prestations dans les conditions et limites fixées pour les garanties I.T.T., T.P.T., I.P.T. et I.P.P.\n\nARTICLE 8 : LA GARANTIE INVALIDITE SPECIFIQUE AERAS\n\nVous bénéficiez de la garantie invalidité spécifique AERAS, lorsque toutes les conditions ci-dessous sont réunies : • votre état de santé est consolidé, • votre taux d’incapacité/d’invalidité fonctionnelle tel que défini à l’article 6.2 ci-avant, apprécié par le médecin désigné par l’Assureur par référence au barème annexé au code des pensions civiles et militaires, atteint un taux égal ou supérieur à 70%.\n\nLa prestation garantie, l’âge limite à respecter à l’adhésion pour pouvoir bénéficier de cette garantie, les modalités de calcul et de versement, les conditions d’exclusion sont identiques à celles définies pour les garanties Incapacité Totale de Travail (ITT), Invalidité Permanente Totale (I.P.T) et Invalidité Permanente Partielle (I.P.P), à l’exception de la date de début de versement des prestations qui est la date de la reconnaissance par le médecin de l’Assureur de l’état d’invalidité défini ci-dessus.\n\nLa garantie Invalidité Spécifique AERAS garantit les suites et conséquences des seules Affections déclarées, dont l’Assureur a eu connaissance lors de l’admission à l’assurance.\n\nLe paiement des prestations cesse :\n\n• à défaut de présentation des justificatifs requis par l’Assureur, pour la poursuite de l’indemnisation, • en cas d’opposition de votre part au contrôle médical ou expertise médicale demandé par l’Assureur lors de la mise en jeu de la garantie ou en cours d’indemnisation, • dès que, par référence au barème annexé au code des pensions civiles et militaires, votre taux d’incapacité fonctionnelle devient strictement inférieur à 70 %, • dès que vous reprenez une activité professionnelle, même à temps partiel ou que suite à un contrôle médical initié par l’Assureur, vous êtes reconnu capable d’exercer une activité professionnelle ou non professionnelle, même partielle.\n\nARTICLE 9 : LA GARANTIE EXONERATION DES COTISATIONS\n\nCette option peut être souscrite en complément des garanties I.T.T/I.P.T/ I.P.P, uniquement au moment de l’adhésion.\n\nExonération totale\n\nEn cas d’I.T.T., d’I.P.P., d’I.P.T. donnant droit aux versements des échéances telles que définies ci-dessus, les garanties souscrites sont maintenues avec exonération du paiement des cotisations pendant la durée de versement de l’indemnité. La franchise est celle de l’option choisie par l’Assuré, à l’adhésion, pour la garantie I.T.T. Exonération partielle\n\nEn cas d’I.T.T., d’I.P.P., d’I.P.T. donnant droit aux versements des échéances telles que définies ci-dessus, les garanties souscrites sont maintenues avec exonération du paiement des cotisations des garanties I.T.T, I.P.P, I.P.T. pendant la durée de versement de l’indemnité. La garantie Décès / P.T.I.A. n’est pas exonérée. L’indemnisation n’interrompt pas le prélèvement des cotisations qui sont remboursées. La franchise est celle de l’option choisie par l’Assuré, à l’adhésion, pour la garantie ITT.\n\nARTICLE 10 : OPTION RACHAT PSY\n\nCette option est souscrite en complément des garanties I.T.T/I.P.T et le cas échéant de l’option I.P.P. et/ou de l’option rachat DOS Elle ne peut être souscrite qu’au moment de l’adhésion. Elle a pour objet de faire bénéficier à l’Assuré d’allègements des exclusions en cas d’incapacité et/ou d’invalidité prévues à l’article 12 au paragraphe « LES EXCLUSIONS ET LIMITES DE PRISE EN CHARGE »\n\nEn cas d’incapacité ou d’invalidité, l’option rachat PSY permet la prise en charge des Sinistres résultant et/ou provenant de la fibromyalgie, le syndrome de fatigue chronique, les dépressions endogènes ou réactionnelles, les troubles anxiodépressifs, et névrotiques, l’hypersomnie ou l’insomnie, le burn-out, l’épuisement, les troubles du comportement et de la personnalité, les TOC (Troubles Obsessionnels Compulsifs), les douleurs chroniques sans cause connue (Syndrome Douloureux Régional Complexe ou SDRC), les manifestations liées au stress, les psychoses aiguës ou chroniques, les troubles bipolaires, leurs suites et conséquences qu’elle qu’en soit la cause ou l’origine sans condition d’hospitalisation..\n\nARTICLE 11: OPTION RACHAT DOS\n\nCette option est souscrite en complément des garanties I.T.T./I.P.T. et le cas échéant de l’option I.P.P. et/ou de l’option rachat PSY Elle ne peut être souscrite qu’au moment de l’adhésion. Elle a pour objet de faire bénéficier à l’Assuré d’allègements des exclusions en cas d’incapacité et/ou d’invalidité prévues à l’article 12 au paragraphe « LES EXCLUSIONS ET LIMITES DE PRISE EN CHARGE »\n\nEn cas d’incapacité ou d’invalidité, l’option rachat DOS permet la prise en charge des Sinistres résultant et/ou provenant d’une atteinte vertébrale ou discale ou radiculaire : lumbago, lombalgie, sciatalgie, cruralgie, névralgie cervico brachiale, protrusion discale, hernie discale, dorsalgie, cervicalgie, coccygodynie, arthrose, discopathie, pincement discal, canal cervical étroit, radiculalgie, lombocruralgie, lombosciatalgie, lombosciatique, sciatique, canal lombaire rétréci et/ou étroit, spondylolisthésis, Maladie de Scheuermann, Maladie de Forestier et Rotès Queroi, ostéoporose, tassement vertébral ostéoporotique, scoliose, cyphose, lordose, qu’elle qu’en soit la cause ou l’origine sans condition d’hospitalisation ni d’intervention chirurgicale.\n\nARTICLE 12 : LES EXCLUSIONS ET LIMITES DE PRISE EN CHARGE\n\nExclusions :\n\nL’Assureur couvre à titre principal les risques de Décès (DC), de Perte Totale et Irréversible d’Autonomie (P.T.I.A), et à titre facultatif les risques d’Incapacité Totale de Travail (I.T.T), d’Invalidité Permanente Totale (I.P.T), Invalidité Permanente Professionnelle (IPPRO), d’Invalidité Permanente Partielle (I.P.P), et, le cas échéant, la garantie invalidité spécifique AERAS, sous les réserves prévues par le Code des Assurances et à l’exclusion des suites et conséquences des événements indiqués dans le tableau ci-après.\n\nAttention, les exclusions dépendent des garanties pour lesquelles vous êtes assuré.", "EVENEMENTS GARANTIES\n\nDécès AccidentelDécès toutes causesPerte Totale etIrréversible d’ Autonomie (P.T.I.A) Incapacité Totale de Travail (I.T.T)Temps Partiel Thérapeutique (T.P.T.)Invalidité Permanente Totale (I.P.T)Invalidité Permanente Partielle (I.P.P)Invalidité spécifique AERAS (GIS)\n\nLe suicide s’il survient au cours de la première année d’assurance qui suit la date d’effet des garanties, sauf pour les Prêts immobiliers accordés pour l’acquisition du logement principal dans la limite du plafond fixé par décret (art L. 132-7 et R. 132-5 du Code des assurances : 120 000 euros au 01/01/2025). Exclu\n\nLes Accidents dus à la pratique de tout sport ou activité sportive, sans possibilité de rachat :\n\n• non représenté(e) par une fédération française agréée par le Ministère des Sports français • le base jump, • sky flying, sky surfing • zorbing, • Les Accidents dus à la pratique du saut à l’élastique.\n\nLes Accidents dus à la pratique de tout sport ou activité sportive, avec possibilité de rachat :\n\n• à titre professionnel ou à titre amateur sous contrat rémunéré, • nécessitant l’utilisation d’un engin terrestre à moteur, sauf à l’occasion d’un baptême encadré par un moniteur diplômé d’état, • nécessitant l’utilisation d’une embarcation à moteur, sauf à l’occasion d’un baptême encadré par un moniteur diplômé d’état, • nécessitant l’utilisation d’un quelconque engin aérien (à moteur, à aile ou à voile), sauf à l’occasion d’un baptême encadré par un moniteur diplômé d’état. • les sports de neige ou de glace (autre que la pratique amateur sur piste de ski alpin ou de fond, du monoski et du surf ainsi que du patinage, qui est couverte), • VTT de descente, bicross, freeride, • rafting, • canyoning, • alpinisme, • escalade, • randonnées de montagne, trekking, • spéléologie.\n\nLe rachat d’exclusion permet à l’Assuré souhaitant être garanti pour ces sports et activités sportives d’en faire la demande à l’Assureur lors de l’adhésion ou en cours de vie de celle- ci. Pour être garantis, ces sports et activités sportives devront avoir été préalablement déclarés et acceptés par l’Assureur et faire l’objet d’une mention particulière au certificat d’adhésion ou à l’avenant à l’adhésion. Nonobstant, les baptêmes ou initiations encadrés par un professionnel habilité des sports rachetables mentionnés ci-dessus sont couverts. Exclu Exclu Exclu", "Les Accidents de navigation aérienne, si l’appareil n’est pas pourvu d’un certificat valable de navigabilité ou si le pilote ne possède pas un brevet ou une licence valide, les compétitions, démonstrations acrobatiques et voltige libre, records, tentatives de records, vols d’apprentissage, vols d’essai, vols sur prototype. Exclu Exclu Exclu\n\nL’usage de médicaments, de stupéfiants, de tranquillisants et/ou de drogues non prescrits par une autorité médicale, ou à des doses non prescrites. Exclu Exclu Exclu\n\nLes effets directs et indirects d’explosions, de dégagements de chaleur, d’irradiations, des souffles provenant des combustibles nucléaires, des produits ou déchets radioactifs, des armes ou engins destinés à exploser par modification de la structure du noyau de l’atome, des transmutations des noyaux d’atome, sauf si ces effets proviennent d’un fonctionnement défectueux d’instruments médicaux ou d’une fausse manœuvre ou d’une erreur de la part du médecin, lors du traitement ou de l’examen de l’Assuré en qualité de patient. Exclu Exclu Exclu\n\nLa participation active de l’Assuré à un record, une tentative de records, une exhibition, un pari ou un essai, de toutes natures. Exclu Exclu Exclu\n\nLes conséquences des faits de rixe, d’une guerre civile ou étrangère, d’une insurrection, d’une émeute, d’un attentat, d’un acte de terrorisme et/ou de sabotage, de délit, de crime, de mouvement populaire, quel que soit le lieu où se déroule cet événement et quels qu’en soient les protagonistes, dès lors que l’Assuré y prend une part active, sauf pour les militaires de carrière en mission.\n\nCette exclusion ne s’applique pas lorsque ces faits ont été commis en cas de légitime défense, d’assistance à personne en danger, d’accomplissement du devoir professionnel. Exclu Exclu Exclu\n\nLes conséquences de la guerre lorsque la France en est partie prenante. Exclu Exclu Exclu\n\nLa manipulation par l’Assuré, d’armes, d’explosifs et de tout autre produit dangereux dont la détention et l’utilisation sont interdites par la législation française. Exclu Exclu Exclu\n\nLes Accidents et Maladies dont la première constatation médicale est antérieure à la date de signature du questionnaire de santé et non déclarés à l’Assureur (sauf les les pathologies relevant du dispositif légal du « droit à l’oubli » hors contrat relevant de la loi Lemoine). Exclu Exclu Exclu\n\nLa conduite en état d’ivresse, au sens de la réglementation en vigueur relative au Code de la route français, ou du pays où a lieu l’Accident si le taux d’alcool maximum autorisé par la réglementation locale est plus faible. Exclu Exclu\n\nLes atteintes corporelles qui résultent du fait volontaire de l’Assuré ou d’une tentative de suicide. Exclu Exclu\n\nLes interventions ou traitements esthétiques et plastiques autres que la chirurgie reconstructrice ou réparatrice consécutive à une Maladie ou un Accident. Exclu\n\nLe congé maternité, paternité et le congé d’adoption prévu par le code du travail, y compris par assimilation pour les personnes non salariées. Exclu\n\nLa fibromyalgie, le syndrome de fatigue chronique, les dépressions endogènes ou réactionnelles, les troubles anxiodépressifs, et névrotiques, l’hypersomnie ou l’insomnie, le burn-out, l’épuisement, les troubles du comportement et de la personnalité, les TOC (Troubles Obsessionnels Compulsifs), les douleurs chroniques sans cause connue (Syndrome Douloureux Régional Complexe ou SDRC), les manifestations liées au stress, les psychoses aiguës ou chroniques, les troubles bipolaires, leurs suites et conséquences, sauf si ceux-ci nécessitent une hospitalisation de plus de 9 jours continus. La souscription de l’option PSY permet de couvrir ces Affections sans condition d’hospitalisation. Exclu (Sauf en cas de souscription de l’option rachat PSY)\n\nUne atteinte vertébrale ou discale ou radiculaire : lumbago, lombalgie, sciatalgie, cruralgie, névralgie cervico brachiale, protrusion discale, hernie discale, dorsalgie, cervicalgie, coccygodynie, arthrose, discopathie, pincement discal, canal cervical étroit, radiculalgie, lombocruralgie, lombosciatalgie, lombosciatique, sciatique, canal lombaire rétréci et/ou étroit, spondylolisthésis, Maladie de Scheuermann, Maladie de Forestier et Rotès Queroi, ostéoporose, tassement vertébral ostéoporotique, scoliose, cyphose, lordose, sauf si cette atteint nécessite une intervention chirurgicale ou une hospitalisation de plus de 5 jours continus pendant cette incapacité. La souscription de l’option DOS permet de couvrir ces Affections sans condition d’hospitalisation ni d’intervention chirurgicale. Exclu (Sauf en cas de souscription de l’option rachat DOS)", "ARTICLE 13 : TERRITORIALITE DES GARANTIES\n\nLes garanties sont accordées dans le monde entier. Cependant, il est expressément stipulé que pour les Assurés résidant fiscalement hors du territoire français, les prestations au titre des garanties Perte Totale et Irréversible d’Autonomie (P.T.I.A), Garantie Invalidité Spécifique (GIS), d’Incapacité Totale de Travail (I.T.T), d’Invalidité Permanente Totale (I.P.T), d’Invalidité Permanente Partielle (I.P.P) et d’Invalidité Permanente Professionnelle (I.P. Pro) ne sont servies par l’Assureur que si l’état de santé de l’Assuré est médicalement constaté en France (France métropolitaine, Corse et DOM-COM), les frais de déplacement engagés par l’Assuré pour s’y rendre restant à sa charge.\n\nARTICLE 14 : LES BENEFICIAIRES DES PRESTATIONS\n\nLe Prêteur est Bénéficiaire acceptant des prestations garanties, à concurrence des sommes qui lui sont dues.\n\nOption « Prévoyance »\n\nL’Adhérent peut souscrire l’option « Prévoyance » à l’Adhésion du contrat CE/20 031. Cette option est réservée à l’Adhérent qui désigne le Prêteur comme Bénéficiaire acceptant pour une quotité inférieure à 100% des montants garantis au titre du présent contrat.\n\nElle permet à l’Adhérent de désigner un ou plusieurs Bénéficiaire(s) de son choix, personne(s) physique(s) autre(s) que le Prêteur, pour une quotité qu’il aura déterminée, soit selon la clause standard soit selon une clause particulière.\n\nLa Quotité assurée au bénéfice du Prêteur additionnée à celle assurée dans le cadre de l’option « Prévoyance » ne doit pas dépasser 100% du montant du capital emprunté.\n\nClause standard : le conjoint de l’Assuré, non décédé, non divorcé, non séparé de corps ou le partenaire lié par un pacte civil de solidarité, à défaut les enfants, nés ou à naître, vivants ou représentés en cas de décès, par parts égales entre eux, à défaut les héritiers par parts égales entre eux.\n\nClause particulière : Le(s) Bénéficiaire(s) est (sont) nommé(s) dans la demande d’adhésion où doit figurer, le Nom, le Prénom, Date de naissance et lieu de naissance et adresse de la/des personne(s) désignée(s).\n\nLe(s) Bénéficiaire(s) sont modifiables pendant toute la durée du contrat. La désignation peut être faite sous seing privé (lettre) ou par acte authentique (testament chez un notaire) ou par avenant. Cette modification doit être adressée à Forever, 14 rue Pierre Gilles de Gennes 76130 Mont Saint Aignan par voie postale dûment datée, signée informant de cette nouvelle désignation Bénéficiaire. Aucune modification ne pourra intervenir sans l’accord du Bénéficiaire acceptant. En l’absence de clause bénéficiaire conforme ou en cas de caducité de la clause particulière au jour du décès de l’Assuré, les sommes dues seront versées conformément à la clause contractuelle standard reprise ci-dessus.\n\nLe bénéfice de la quote-part assurée revenant au Bénéficiaire en cas de décès de l’Assuré ne peut être versé s’il est condamné pour avoir causé volontairement le décès de l’Assuré (article L. 132-24 du Code des assurances).\n\nLes capitaux décès revenant au(x) Bénéficiaire(s) personne(s) physique(s) sont revalorisés du jour du décès de l’Assuré prorata temporis, jusqu’à la réception de l’ensemble des pièces nécessaires au règlement ou, le cas échéant, jusqu’au dépôt de ce capital à la Caisse des Dépôts et Consignations en application de l’article L.132-27-2 du Code des assurances. La revalorisation, nette de frais, pour chaque année civile, s’effectue à un taux égal au moins élevé des deux taux suivants :\n\na) la moyenne sur les douze derniers mois du taux moyen des emprunts de l’Etat français, calculée au 1er novembre de l’année précédente ; b) le dernier taux moyen des emprunts de l’Etat français disponible au 1er novembre de l’année précédente.\n\nCOMMENT ADHERER AUX GARANTIES ? ARTICLE 15 : LES CONDITIONS POUR ADHERER\n\n15.1 Adhérent et personnes assurables Pour pouvoir être Adhérent au contrat, vous devez :\n\n- Soit être une personne physique âgée de plus de 18 ans à la date d’adhésion, soit être une personne morale,\n\n- Avoir sa résidence fiscale en France métropolitaine ou dans les DROM- COM (pour les Adhérents Personnes Physiques),\n\n- Avoir son siège social ou un établissement en France métropolitaine ou dans les DROM-COM (pour les Adhérents Personnes Morales),\n\n- Avoir contracté un Prêt ou un crédit-bail ou être Caution d’un Prêt ou d’un crédit-bail libellé en Euros et rédigé en français auprès du Prêteur, d’un montant minimum de 25 000 euros.\n\nPour être assuré, vous devez :\n\n- Avoir sa résidence fiscale en France métropolitaine ou dans les DROM- COM (pour les Adhérents Personnes Physiques),\n\n- Avoir son siège social ou un établissement en France métropolitaine ou dans les DROM-COM (pour les Adhérents Personnes Morales),\n\n- Être Emprunteur, co-Emprunteur ou Caution d’une personne physique ou d’une personne morale,\n\n- Si le contrat de crédit s’inscrit dans le cadre de l’Article L. 313-1 du Code de la Consommation, avoir une(des) échéance(s) de remboursement du(des) crédit(s) contracté(s) postérieure(s) à votre soixantième anniversaire et/ou avoir plus de 200 000€ de capital assuré\n\n- Avoir satisfait aux formalités médicales et financières le cas échéant conformément à l’Article 16,\n\n- Être âgé au jour de l’adhésion de plus de 18 ans, et demander votre admission au plus tard selon les limites d’âge suivantes :\n\nRisques couverts Limite d’adhésion Décès (DC) à la date exacte de votre 71ème anniversaire. Perte Totale et Irréversible d’Autonomie (P.T.I.A) à la date exacte de votre 65ème anniversaire.\n\nInvalidité Permanente Professionnelle (I.P.Pro.) à la date exacte de votre 60ème anniversaire.\n\nIncapacité Totale de Travail (I.T.T) ou Invalidité spécifique AERAS (GIS) A la date exacte de votre 65ème anniversaire et avant votre départ en retraite ou en pré-retraite, y compris pour inaptitude au travail. Pour l‘IPT versée en capital, l’âge de l’Adhérent à la date du terme normal du Prêt doit être inférieur à l’âge limite défini ci-avant. Invalidité Permanente Totale (I.P.T)\n\nInvalidité Permanente Partielle (I.P.P)\n\nEnfin, l’Adhérent au contrat ne doit pas, sauf accord exprès de l’assureur, exercer une des activités définies ci-dessous :\n\n• Sportifs professionnels, • Professions du cirque,", "• Les professions relevant du régime ENIM (par exemple les marins, les marins-pêcheurs, les aquaculteurs, les ostréiculteurs, les conchyliculteurs les personnes exerçant des travaux sous-marins), • Caristes, dockers, • Professions impliquant la manipulation et/ou transport d’explosifs ou de substances chimiques et/ou toxiques, nucléaires ou bactériologiques, • Professions sur site d’exploitation pétrolière, • Professions impliquant une activité minière, souterraine ou en galerie, • Cascadeurs, Guides de chasse, Tauréador, Vulcanologue • Professions en lien avec la sécurité, la surveillance ou nécessitant le port d’une arme (par exemple : Convoyeurs de fonds, détectives privés, agents de sécurité…) • Professions de la voyance et de la divination (par exemple : médium, magnétiseur, astrologue, radiesthésiste) • Professions en relation avec la montagne (par exemple : moniteurs de ski, guides de montagne), • Professions en relation avec les travaux forestiers (par exemple : bûcherons, élagueurs, débardeurs, exploitants forestiers) et pépiniéristes, • Professions en relation avec l’aérien (par exemple : moniteurs d’aviation, pilotes), • Artistes (par exemple : peintre d’œuvre d’art, sculpteur, chanteur)\n\n15.2 Montant maximum assurable\n\nLe montant total des capitaux assurés par l’Assureur, tous contrats d’assurances de financement auprès de l’Assureur et tous réseaux de distributeurs confondus, est limité par Assuré, à :\n\n• 5 000 000 (cinq millions) euros au titre des garanties DC et PTIA, sauf pour les Assurés résidant dans les DROM-Com ou en Corse, où le capital maximum assuré est de 2 000 000 (deux millions) euros pour les garanties DC et PTIA,\n\n• 1 500 000 (un million cinq cent mille) euros au titre de la garantie Invalidité Permanente Professionnelle et de l'option «I.P.T. en capital ».\n\nLe montant total des capitaux assurés par l’Assureur tient compte :\n\n• de tous les capitaux assurés restant dus à la date de la demande d’adhésion,\n\n• et des nouveaux capitaux à assurer.\n\nQuel que soit le contrat, la dette est couverte, pour chaque Assuré, à concurrence du montant emprunté multiplié par la quotité choisie qui est au maximum de 100 %.\n\n15.3 Pluralité d’Assurés au titre d’un même contrat de Prêt\n\nL’Assureur limite ses garanties au montant des prestations qui seraient dues pour un Assuré avec une quotité de 100%, en cas de sinistre atteignant en même temps plusieurs Assurés pour un même financement.\n\nEn cas de Décès simultané de plusieurs Assurés, les prestations réglées correspondent au solde du Capital Restant Dû au Prêteur dans la limite des montants garantis et sans que le total des prestations puisse être supérieur au solde du Capital Restant Dû.\n\nEn cas de Décès, de Perte Totale et Irréversible d’Autonomie (P.T.I.A) de l’un des Assurés dont la Quotité assurée est de 100%, le Capital Restant Dû est versé une seule fois, les autres Assurés cessant d’être garantis. En cas d’Incapacité Totale de Travail (I.T.T) ou d’Invalidité Permanente Totale (I.P.T) ou d’Invalidité Permanente Partielle (I.P.P) simultanées des Assurés, les prestations sont réglées conformément aux dispositions de l’article 6 ci-avant, affectées de la Quotité Assurée sur chaque tête, et ne sauraient excéder le cumul entre les Assurés et, pendant toute la période garantie, 100% des échéances du Prêt. Dans tous les cas, le montant des prestations réglées au Prêteur ne peut être supérieur au montant du Capital Restant Dû. Le solde éventuel est versé au(x) Bénéficiaire(s) désigné(s) à l’article 14 ci-avant.\n\nEn outre, aucune prestation ne sera versée par l’Assureur au Bénéficiaire de l’option « Prévoyance » dès lors que le capital, les échéances de remboursement ou de loyers dus par les Assurés sont intégralement payés au Prêteur.\n\n15.4 Prêts assurables\n\nLe contrat couvre les Prêts immobiliers ou professionnels, tels que :\n\n• Les Prêts amortissables à taux fixe ou variable, d’une durée restante maximum de 30 ans, différé d’amortissement éventuel compris • Les Prêts in fine d’une durée maximum de 20 ans • Les Prêts relais d’une durée maximale de 36 mois • Les crédits-bails • Les crédits renouvelables • Les prêts à la consommation.\n\nNe sont pas éligibles aux garanties du présent contrat les types de Prêts suivants :\n\n• Les découverts bancaires et facilités de caisse • Les Prêts viagers hypothécaires • Les Prêts garantis par l’Etat (P.G.E.).\n\nLes Prêts doivent être libellés en Euros ou en Francs Pacifiques convertis en euros.\n\nARTICLE 16 : LES FORMALITES POUR ETRE ASSURE\n\nVous devez compléter et signer la demande d’adhésion, le mandat SEPA et un RIB ou RICE ou RIP ainsi que le questionnaire de santé joint à la demande. Par ailleurs, quand cela est demandé, vous devrez vous soumettre aux formalités médicales précisées par l’Assureur lors de la demande.\n\nLes formalités médicales d’admission dépendent, pour chaque Assuré, de son âge, du montant du financement à assurer et du solde éventuel des capitaux restants assurés, tel que défini à l’article 13.2 ci-avant, au titre de financements antérieurs garantis par l’Assureur.\n\nVos déclarations et les pièces jointes sont valables 6 (six) mois et 12 (douze) mois dans le cadre d’une « reprise bourquin » et cela à compter de leur émission.\n\nA réception du dossier de demande d’admission, le médecin conseil de l’Assureur peut vous demander un complément d’information ou des examens médicaux complémentaires.\n\nL’Assureur peut :\n\n• ACCEPTER votre demande :\n\n- au taux normal de cotisation ou à un taux majoré, - sans restriction ou en excluant tout ou partie d'un risque (médical, sportif ou professionnel)\n\nSi l’Assureur vous propose un taux majoré, l’exclusion de certaines pathologies ou le refus de certaines garanties, vous devrez, si vous les acceptez, marquer votre accord (bon pour accord daté signé par l’Assuré) sur la lettre de notification puis l’envoyer à l’Assureur pour validation.\n\nLa proposition de l’Assureur est valable 12 (douze) mois que l’acceptation soit au tarif standard ou en cas de conditions particulières.", "Le Certificat d’Adhésion est émis après signature de la Demande d’Adhésion dans ce délai. Passé ce délai, la proposition n’est plus valable et de nouvelles formalités d’adhésion doivent être accomplies par le Proposant.\n\n• REFUSER votre demande.\n\nL’Assureur et le Prêteur s’engagent à respecter les dispositions de la convention AERAS contenues dans le dépliant remis par le Prêteur au moment de la demande d’adhésion à l’assurance.\n\nSi les garanties Incapacité Totale de Travail (I.T.T), Invalidité Permanente Totale (I.P.T) ou Invalidité Permanente Partielle (I.P.P) vous sont refusées ou vous sont accordées en excluant certaines pathologies, l’Assureur vous proposera chaque fois que cela sera possible, pour les Prêts visés par la convention AERAS, une garantie Invalidité Spécifique (GIS) (cf. article 8 ci-avant).\n\nLa garantie Invalidité Spécifique AERAS est accordée si elle est indiquée comme telle sur la lettre de notification de l’acceptation par l’Assureur.\n\nDe plus, si l’éventuelle majoration de cotisation demandée par l’Assureur, visés par la convention AERAS, a pour effet que votre cotisation globale représente plus de 1,4 point dans le taux effectif global (TEG) de votre emprunt, vous serez informé des conditions à respecter pour que celle- ci soit limitée à 1,4 point ou au taux contractuel sans majoration si ce taux est supérieur à 1,4. Ces conditions d’éligibilité à cet écrêtement des surprimes définies par la convention AERAS sont rappelées sur la lettre de notification de l’acceptation par l’Assureur.\n\nToute omission, réticence, fausse déclaration dans les informations déclarées et/ou fournies à l’Assureur entraînera l’application des sanctions prévues aux articles L. 113-8 et L. 132-26 du Code des assurances et notamment la nullité du contrat en cas de fausse déclaration intentionnelle.\n\nARTICLE 17 : LES COTISATIONS D’ASSURANCE\n\nVous vous engagez à payer les cotisations d’assurance aux conditions fixées par l’Assureur.\n\nLes cotisations sont déterminées à l’adhésion et sont garanties sur toute la durée du contrat. Elles pourront évoluer en cas de modification des garanties ou d’évolution législative ou réglementaire en matière sociale ou fiscale.\n\nVotre cotisation repose sur le capital emprunté assuré. Pour les Prêts, votre cotisation repose sur le capital emprunté et la Quotité Assurée. Pour les crédits bail, la cotisation est fonction du cumul des loyers et de la valeur de rachat du bien financé et la Quotité Assurée. Votre cotisation est constante et tient compte notamment du Capital Initial et de votre âge (calculé en âge exact).\n\nL’échéancier des cotisations est fixé et communiqué lors de l’adhésion.\n\nPour permettre le prélèvement des cotisations d’assurance, il est nécessaire de transmettre un mandat SEPA et vos coordonnées bancaires (RIB ou RICE ou RIP).\n\nLe coût de l’assurance est mentionné sur le certificat d’adhésion. Votre première cotisation est due dès la prise d’effet des garanties.\n\nUne prise en charge au titre de l’Incapacité Totale de Travail (I.T.T) ou de l’Invalidité Permanente Totale (I.P.T) ou de l’Invalidité Permanente Partielle (I.P.P) et, le cas échéant, de la garantie Invalidité Spécifique AERAS ne suspend pas votre obligation de paiement de vos cotisations d’assurance, même si elles vous sont remboursées ultérieurement.\n\nEn cas de résiliation de l’adhésion par l’Assuré, conformément aux dispositions de l’article L. 113-12-2 du Code des assurances, les cotisations périodiques cesseront d’être dues à l’échéance suivant la date de résiliation. Les cotisations perçues indûment seront restituées dans la limite de deux années de cotisation.\n\nEn cas de refus de substitution d’assurance ou de refus du (des) Prêt(s) par l’Organisme Prêteur, l’Adhérent doit déclarer à l’Assureur ce refus, dès qu’il en a connaissance et au plus tard dans les 3 mois, accompagné des pièces justificatives. Les cotisations afférentes à ce(s) Prêt(s) perçues par l’Assureur, lors de l’Adhésion, seront alors intégralement remboursées et le contrat sera alors réputé ne jamais avoir pris effet.\n\nEn cas de déclaration dans un délai supérieur à 3 mois à compter de la date de refus du (des) Prêt(s) par l’Organisme Prêteur : l’Assureur procèdera à la résiliation du contrat dans les mêmes conditions qu’une résiliation faisant suite à un remboursement anticipé total du Prêt.\n\nPaiement des cotisations\n\nL’Adhérent doit s’acquitter des cotisations aux dates convenues et selon les modalités fixées ci-dessus. La cotisation est prélevée automatiquement sur le compte bancaire support du Prêt. A défaut de paiement d’une cotisation ou fraction de cotisation dans les 10 jours qui suivent son échéance, l’Assureur adresse à l’Adhérent une lettre recommandée de mise en demeure, l’invitant à s’acquitter du montant dû. Ce courrier rappelle que, conformément à l’article L. 113-3 du Code des assurances, si la ou les cotisations ou fractions de cotisation dues ne sont toujours pas payées 30 jours après son envoi, les garanties et options sont suspendues.\n\nA défaut de paiement, l’adhésion est résiliée de plein droit et sans autre formalité 10 (dix) jours après expiration de ce délai de 30 (trente) jours. L’Assureur informe le Prêteur du non-paiement par l’Emprunteur de sa prime d’assurance.\n\nCOMMENT METTRE EN JEU LES GARANTIES ? ARTICLE 18 : LES DECLARATIONS DE SINISTRE\n\n18.1 Délai de déclaration\n\nLa déclaration de sinistre au titre des garanties Décès (DC), Perte Totale et Irréversible d’Autonomie (P.T.I.A) ou Invalidité Spécifique AERAS doit intervenir le plus tôt possible et au plus tard dans les 2 (deux) ans à compter de la date de l’évènement. Passé ce délai, si votre déclaration tardive venait à causer un préjudice à l’Assureur, vous (ou vos ayants droits) seriez alors déchu de vos droits.\n\nLa déclaration de sinistre au titre des garanties Incapacité Totale de Travail (I.T.T), Invalidité Permanente Totale (I.P.T) ), Invalidité Permanente Professionnelle (IPPRO) ou Invalidité Permanente Partielle (I.P.P) doit intervenir dans les 180 (cent quatre-vingts) jours qui suivent le premier jour d’arrêt.\n\nPassés ces délais et dans les conditions prévues à l’article L. 113-2 du Code des assurances, les prestations ne sont dues qu’à compter de la date de réception des pièces.\n\nEn tout état de cause, sous peine de déchéance de garantie et/ou d’interruption de paiement des prestations en cours de service en faveur de l’Assuré ou l’Adhérent, l’Assureur se réserve le droit de demander à tout moment à l’Assuré, l’Adhérent ou aux Bénéficiaires désignés toute justification qui lui paraîtrait nécessaire afin de contrôler les déclarations qui lui sont faites.\n\nQuelle que soit la garantie à mettre en jeu, le sinistre doit être déclaré directement à FOREVER : Par mail Par courrier\n\nsinistre@easyforever.fr SERVICE MEDICAL FOREVER 120 avenue du Général Leclerc CS10029 75680 PARIS CEDEX 14", "- si vous êtes fonctionnaire ou assimilé, la copie de la notification d’attribution d’une mise à la retraite pour invalidité, d’une mise en congé longue durée (CLD) ou de la perception, d’une pension d’invalidité (civile ou retraite anticipée),\n\n- si vous êtes travailleur non salarié, la copie de la notification d’attribution d’une pension d’invalidité totale et définitive, - le tableau d’amortissement au jour de l’invalidité spécifique AERAS.\n\n- toutes autres pièces que l’Assureur sera amené à vous demander pour la justification de l’état d’invalidité.\n\nPour les garanties INCAPACITE TOTALE DE TRAVAIL (I.T.T.), y compris TEMPS PARTIEL THERAPEUTIQUE (T.P.T), INVALIDITE PERMANENTE TOTALE (I.P.T) ou INVALIDITE PERMANENTE PARTIELLE (I.P.P) :\n\n- l’attestation médicale fournie par l’Assureur dûment remplie et signée par le médecin traitant,\n\n- le questionnaire arrêt de travail fourni par l’Assureur dûment rempli et signé par l’Assuré,\n\n- la copie des certificats médicaux initiaux et de prolongation d’arrêt de travail ou d’incapacité à vos activités non professionnelles sans discontinuité dans les dates d’arrêt de travail,\n\n- la copie des bordereaux d’indemnités journalières réglées par la Sécurité Sociale ou par la caisse dont vous dépendez y compris ceux émanant des organismes complémentaires (si vous êtes salarié, fonctionnaire ou assimilé),\n\n- si vous êtes fonctionnaire, la copie des notifications du placement en congé de Maladie ordinaire (CMO), en congé de longue Maladie (CLM) et le cas échéant en congé de longue durée (CLD),\n\n- si vous êtes Conjoint collaborateur non rémunéré, un extrait K- BIS actualisé justifiant de cette qualité au jour du sinistre,\n\n- en cas de rechute, un certificat médical établi par votre médecin traitant précisant qu’il s’agit de la même Maladie et/ou d’une nouvelle Maladie résultant du sinistre initial ainsi que la copie de l’arrêt de travail mentionnant la rechute,\n\n- la copie de la notification d’attribution d’une pension ou rente d’incapacité ou d’invalidité par la Sécurité Sociale, la commission de réforme ou tout organisme assimilé dont vous dépendez,\n\n- la copie des justificatifs de paiement de pension ou rente,\n\n- un certificat médical de reprise d’activité à temps partiel thérapeutique consécutive à un arrêt de travail,\n\n- le tableau d’amortissement\n\n- toutes autres pièces que l’Assureur sera amené à demander pour la justification de l’état d’incapacité ou d’invalidité.\n\nARTICLE 19 : PRESTATIONS, CONTROLE ET EXPERTISE\n\nL’attention de l’Assuré est attirée sur le fait qu’il n’existe pas de lien entre l’incapacité et l’invalidité telles que définies dans la présente notice d’information et celles retenues par la Sécurité sociale ou tout autre caisse d’affiliation. La reconnaissance d’un état d’incapacité ou d’invalidité par la Sécurité sociale ou tout autre organisme d’affiliation ne s’impose pas à l’Assureur qui est tenu par la seule définition figurant dans la présente notice d’information. Les décisions de la Sécurité sociale ou autres caisses d’affiliation sont inopposables à l’Assureur. 18.2 Documents à fournir\n\nDans le cadre de l’exécution de l’adhésion, le médecin conseil de l’Assureur pourra demander à l’Assuré, ou à ses ayants droit des informations d’ordre médical. Ces informations sont couvertes par le secret professionnel. L’Assuré, agissant pour son compte, ou ses ayants droit, s’engage à faciliter l’accès aux pièces demandées étant entendu que l’Assureur s’engage à respecter une procédure interne limitant le nombre de personnes ayant accès aux renseignements d’ordre médical ; ces personnes étant toutes habilitées à traiter ces données et sont soumises au respect du secret professionnel.\n\nLes documents médicaux peuvent être adressés au médecin conseil de l’Assureur à l’adresse ci-dessus.\n\nPour obtenir le règlement des prestations, l’Assuré, ou ses ayants droit, devra obligatoirement communiquer à l’Assureur tous les documents (rédigés en français) jugés nécessaires à l’instruction du dossier (les frais qui pourront en résulter seront à leur charge).\n\nPour la garantie DECES :\n\n- la copie intégrale de l’acte de décès, - le certificat médical fourni par l’Assureur dûment rempli et signé par le médecin traitant ou à défaut le médecin ayant constaté le décès accompagné de toutes pièces permettant de justifier les circonstances et les causes du décès, - Une attestation fournie par l’Assureur dûment remplie et signée par les ayants-droits de l’Assuré ; - si le décès résulte d’un Accident ou d’une mort non naturelle, la copie du rapport de police ou de gendarmerie ou de tout autre justificatif en possession expliquant les circonstances du décès ; - une attestation de l’organisme Prêteur indiquant le montant restant dû au jour du décès et le tableau d’amortissement au jour du décès - toutes autres pièces que l’Assureur sera amené à demander pour la justification du décès.\n\nPour la garantie PERTE TOTALE ET IRREVERSIBLE D’AUTONOMIE (P.T.I.A.) ou INVALIDITE PERMANENTE PROFESSIONNELLE (I.P. Pro.) :\n\n- le certificat médical fourni par l’Assureur dûment rempli et signé par votre médecin traitant, - l’attestation fournie par l’Assureur dûment remplie et signée par l’Assuré ou son représentant légal ; - si vous êtes salarié, fonctionnaire ou assimilé la copie de la notification d’attribution de la pension d’invalidité 3ème (troisième) catégorie avec assistance d’une tierce personne établie par la Sécurité Sociale ou la copie de la notification d’attribution de la rente Accident du travail à 100% avec assistance d’une tierce personne établie par la Sécurité Sociale, - si vous êtes travailleur non salarié, la copie de la notification d’attribution d’un titre de pension d’invalidité totale et définitive à toute activité avec majoration pour tierce personne établie par la caisse d’affiliation dont vous dépendez, - une attestation de l’organisme Prêteur indiquant le montant restant dû au jour du sinistre et le tableau d’amortissement - toutes autres pièces que l’Assureur sera amené à vous demander pour la justification de l’état d’invalidité.\n\nPour la garantie INVALIDITE SPECIFIQUE AERAS (GIS) :\n\n- le certificat médical fourni par l’Assureur dûment rempli et signé par le médecin traitant, - si vous êtes salarié, la copie de la notification d’attribution de la pension d’invalidité 2ème (deuxième) catégorie de la Sécurité Sociale,", "19.1 Prestations\n\nLes prestations dues aux titres des garanties Décès (DC), Perte Totale et Irréversible d’Autonomie (P.T.I.A), Invalidité Spécifique AERAS, Incapacité Totale de Travail (I.T.T.), Invalidité Permanente Totale (I.P.T) ou Invalidité Permanente Partielle (I.P.P) sont servies selon les modalités évoquées aux articles 3, 4, 6 et 7 ci-avant.\n\nLes prestations liées aux garanties Perte Totale et Irréversible d’Autonomie (P.T.I.A), Invalidité Spécifique AERAS, Incapacité Totale de Travail (I.T.T.), Invalidité Permanente Totale (I.P.T) ou Invalidité Permanente Partielle (I.P.P) ne sont servies que si l’état de santé de l’Assuré est médicalement constaté en FRANCE (France métropolitaine, Corse et DROM-COM), les frais de déplacement engagés par l’Assuré pour s’y rendre restant à sa charge.\n\nIl n’existe aucun lien entre les décisions du médecin conseil de l’Assureur et celles de la Sécurité Sociale ou de tout autre régime obligatoire dont dépend l’Assuré.\n\n19.2 Contrôle médical, Expertise médicale et Arbitrage\n\nLe médecin conseil de l’Assureur peut à tout moment procéder à un contrôle médical en demandant toutes pièces qu’il estimera nécessaire que cela soit au moment de la mise en jeu d’une des garanties ou en cours de prise en charge. De même, le médecin conseil de l’Assureur, en cas de sinistre Perte Totale et Irréversible d’Autonomie (P.T.I.A), Invalidité Spécifique AERAS (GIS), Incapacité Totale de Travail (I.T.T.), Invalidité Permanente Totale (I.P.T) ou Invalidité Permanente Partielle (I.P.P), peut, à tout moment, contrôler votre état de santé en diligentant auprès du médecin expert de son choix, agréé, habilité et inscrit pour exercer la médecine en France une expertise médicale, à ses frais.\n\nVous pouvez vous présenter seul à cette expertise ou si vous le souhaitez, être accompagné du médecin de votre choix agrée, habilité et inscrit pour exercer la médecine en France, à vos frais. Quel que soit votre choix, vous devez apporter votre entier dossier médical.\n\nLes conclusions de l’expertise diligentée par l’Assureur peuvent amener à la cessation du versement des prestations et le cas échéant, au remboursement des prestations déjà versées. Si vous vous opposez à un contrôle médical ou expertise médicale, la garantie sollicitée ne pourra pas produire ses effets ou le paiement des prestations cessera immédiatement.\n\nEn cas de contestation d’ordre médical, vous pouvez alors convenir avec l’Assureur de recourir à une expertise contradictoire. L’Assureur désigne alors un médecin expert dûment agréé, habilité et inscrit pour exercer la médecine en France à ses frais. L’Assuré fera de même, en désignant lui aussi un médecin expert dûment agréé, habilité et inscrit pour exercer la médecine en France, à ses frais. Si lesdits médecins ainsi désignés ne sont pas d’accords, ils pourront s’adjoindre un troisième médecin expert, lui aussi agrée, habilité et inscrit pour exercer la médecine en France afin de recourir à un arbitrage. Les trois médecins opèrent en commun accord et à la majorité des voix. Faute d’entente sur le choix de ce troisième médecin, celui-ci sera désigné par le Président du Tribunal Judiciaire de votre domicile. La moitié des frais et honoraires engendrés par cette procédure sera à votre charge et s’il y lieu la moitié des honoraires du 3ème médecin et de ses frais de nomination.\n\nLe paiement des prestations est suspendu tant que cette procédure est en cours. Les conclusions de l’expertise contradictoire s’imposeront à l’Assureur et à l’Assuré. QUE FAIRE EN CAS DE MODIFICATION DU CONTRAT ? Modification de la situation personnelle de l’Assuré : Sous réserves des dispositions de l’Article 10 et de l’Article 16, les modifications de situation personnelle de l’Assuré en cours d’adhésion n’ont aucune incidence sur les garanties accordées qui sont maintenues aux mêmes conditions.\n\nModification du contrat de financement :\n\nEn cas de modification du tableau d’amortissement et/ou des caractéristiques du ou des Prêts couverts par le présent contrat en cours de contrat, l’Assuré doit en informer l’Assureur dès qu’il en a connaissance et lui transmettre le justificatif de l’Organisme Prêteur (Tableau d’amortissement et attestation) par lettre recommandée avec accusé de réception et au maximum dans un délai de trois (3) mois.\n\nEn cas de déclaration hors délai, la rétroactivité sera limitée à trois (3) mois. L’Assureur procèdera à l’émission d’un avenant au Certificat d’Adhésion prenant effet rétroactivement à la date de modification et pourra être amenée, le cas échéant, à rembourser à l’Assuré une fraction de la cotisation payée.\n\nEn cas de remboursement anticipé total : L’Assureur procèdera à la résiliation de l’adhésion et remboursera la fraction des cotisations payées couvrant la période postérieure à la date de remboursement anticipé.\n\nEn cas de remboursement anticipé partiel : L’Assureur procèdera à l’émission d’un avenant prenant effet rétroactivement à la date de remboursement partiel du Prêt et pourra être amenée à rembourser une fraction des cotisations payées. Dans tous les cas, la rétroactivité sera limitée à trois (3) mois en cas de déclaration hors délai.\n\nEn cas de modification du capital assuré intervenant avant la prise d’effet des garanties, l’Assureur se réserve le droit d’exiger de nouvelles formalités médicales ou complément d’information Si l’Assuré ne se soumet pas au(x) demande(s) de l’Assureur, ce dernier se réserve le droit de refuser la modification du capital.\n\nDès lors que l’adhésion a pris effet, vous n’avez aucune nouvelle formalité d’admission à accomplir si, après modification du contrat de financement assurable, l’ensemble des conditions suivantes sont remplies :\n\n• la durée du financement n’est pas prorogée de plus de 4 ans,\n\n• l’augmentation du capital assuré n’excède pas 45 000 euros (quarante- cinq mille euros) à la date de modification du financement, en particulier en cas de changement de Quotité assurée. Ces conditions s’appliquent également dans le cas où un plan de règlement d’une situation de surendettement serait mis en œuvre.\n\nSi l’une de ces deux conditions n’est pas remplie, vous devez compléter une nouvelle demande d’adhésion assujettie aux mêmes dispositions que lors d’une demande d’adhésion initiale (cf. Article 14).\n\nTant que l’Assureur n’a pas statué sur cette nouvelle demande d’adhésion ou si vous refusez ou ne donnez pas suite aux nouvelles conditions de couverture proposées par l’Assureur pour la prise en compte de cette modification, vous restez garanti aux conditions précédemment en vigueur.\n\nModification des garanties :\n\nLes demandes de modifications des garanties ou d’augmentation ou de diminution de la Quotité assurée par l’Assuré ne pourront être effectuées sans le consentement exprès de l’Organisme Prêteur. Elles peuvent donner lieu à de nouvelles formalités d’adhésion, à un délai d’attente de trois (3) mois sur l’augmentation des garanties et sont soumises à l’accord de l’Assureur.", "BON A SAVOIR ARTICLE 20 : PRESCRIPTION Les dispositions relatives à la prescription des actions dérivant du contrat d’assurance sont fixées par les articles L. 114-1 à L. 114-3 du Code des assurances, reproduits ci-après :\n\nArticle L. 114-1 : « Toutes actions dérivant d’un contrat d’assurance sont prescrites par deux ans à compter de l’événement qui y donne naissance. Par exception, les actions dérivant d’un contrat d’assurance relatives à des dommages résultant de mouvements de terrain consécutifs à la sécheresse-réhydratation des sols, reconnus comme une catastrophe naturelle dans les conditions prévues à l’article L. 125-1, sont prescrits par cinq ans à compter de l’évènement qui y donne naissance.\n\nToutefois, ce délai ne court :\n\n1.En cas de réticence, omission, déclaration fausse ou inexacte sur le risque couru, que du jour où l’assureur en a eu connaissance ;\n\n2.En cas de sinistre, que du jour où les intéressés en ont eu connaissance, s’ils prouvent qu’ils l’ont ignoré jusque-là.\n\nQuand l’action de l’assuré contre l’assureur a pour cause le recours d’un tiers, le délai de la prescription ne court que du jour où ce tiers a exercé une action en justice contre l’assuré ou a été indemnisé par ce dernier.\n\nLa prescription est portée à dix ans dans les contrats d’assurance sur la vie lorsque le bénéficiaire est une personne distincte du souscripteur et, dans les contrats d’assurance contre les accidents atteignant les personnes, lorsque les bénéficiaires sont les ayants droit de l’assuré décédé. Pour les contrats d’assurance sur la vie, nonobstant les dispositions du 2°, les actions du bénéficiaire sont prescrites au plus tard trente ans à compter du décès de l’assuré. »\n\nArticle L. 114-2 : « La prescription est interrompue par une des causes ordinaires d’interruption de la prescription (prévues par le Code Civil, aux articles 2240 à 2249, à savoir : commandement de payer, assignation devant un tribunal, même en référé, une saisie, l’acte du débiteur par lequel celui-ci reconnait le droit de celui contre lequel il prescrivait) et par la désignation d’experts à la suite d’un sinistre. L’interruption de la prescription de l’action peut, en outre, résulter de l’envoi d’une lettre recommandée ou d’un envoi recommandé électronique, avec accusé de réception, adressée par l’assureur à l’assuré en ce qui concerne l’action en paiement de la prime et par l’assuré à l’assureur en ce qui concerne le règlement de l’indemnité. » Article L. 114-3 : « Par dérogation à l’article 2254 du Code Civil, les parties au contrat d’assurance ne peuvent, même d’un commun accord, ni modifier la durée de la prescription, ni ajouter aux causes de suspension ou d’interruption de celle-ci. »\n\nARTICLE 21 : CONTINUITE DU CONTRAT CE/20 031 En cas de résiliation du contrat, contracté entre l’Assureur et l’Association de Promotion de Prévoyance Santé et Retraite (A.P.P.S.R), pour son compte, toutes les garanties accordées au titre du contrat résilié sont maintenues aux Assurés de ce contrat dans les conditions de cette notice d’information. Les cotisations continuent d’être dues.\n\nConformément à l’article L. 141-6 du Code des assurances, en cas de dissolution ou de liquidation de l’Association de Promotion de Prévoyance Santé et Retraite (A.P.P.S.R), le contrat se poursuit de plein droit entre l’Assureur et les personnes antérieurement adhérentes au contrat d’assurance de groupe.\n\nARTICLE 22 : CONTROLE DE L’ASSUREUR L’autorité chargée du contrôle de l’Assureur et du Gestionnaire visé à l’article 21 ci-après est l’Autorité de Contrôle Prudentiel et de Résolution (ACPR) située 4 Place de Budapest CS 92459, 75436 Paris Cedex 09.\n\nARTICLE 23 : GESTION DU CONTRAT CE/20 031\n\nL’Assureur a délégué la gestion de son contrat CE/20 031 à FOREVER pour recevoir, en ses lieux et places, avis et communications pour accepter les risques, opérer tout règlement, et plus généralement, assurer toute opération nécessaire à leur gestion.\n\nPour toutes questions relatives à ce contrat, votre interlocuteur privilégié est FOREVER.\n\nARTICLE 24 : RECLAMATIONS - MEDIATIONS\n\nOn entend par réclamation, toute déclaration, sous quelle que forme que ce soit (lettre, courriel, appel téléphonique) faisant état d’une insatisfaction ou d’un mécontentement.\n\nVous pouvez à tout moment vous adresser à votre conseiller habituel afin de résoudre tout problème relatif à la bonne exécution de votre adhésion. Si le litige éventuel demeure, vous pouvez adresser une réclamation écrite. Selon l’objet de votre réclamation, le service en charge de son traitement différera.\n\nPour toute réclamation relative aux circonstances de la conclusion de votre adhésion (manquements et/ou mauvaises pratiques lors de la vente, défaut d’information et/ou de conseil), vous pouvez contacter ELOIS :\n\n• par courrier à l’adresse : ELOIS, Service de traitement des réclamations, 14 rue Pierre Gilles de Gennes 76130 Mont Saint Aignan • par email : reclamation@simulassur.fr.\n\nPour toute autre réclamation, vous pouvez formuler une réclamation soit auprès de FOREVER :\n\nPar courrier ou par mail\n\nFOREVER SERVICE GESTION DES RECLAMATIONS OFFRE SAFI EMPRUNTEUR 14 rue Pierre Gilles de Gennes 76130 Mont Saint Aignan reclamation@easyforever.fr\n\nFOREVER traitera toute réclamation portant sur la gestion de l’adhésion ou d’un sinistre.\n\nLe destinataire de la réclamation (ELOIS ou FOREVER) s’engage à accuser réception de la demande dans les dix (10) jours ouvrables suivant sa réception (en l’absence de réponse à la réclamation apportée dans ce délai), et à y apporter une réponse au maximum dans les 2 (deux) mois suivant sa date de réception (sauf circonstances particulières dont vous serez alors informé).\n\nSoit auprès de l’Assureur :\n\nNature de la réclamation Par courrier\n\nd’ordre administratif PREPAR-VIE - CELLULE PREVOYANCE Immeuble Le Village 1 - Quartier Valmy 33 Place Ronde - CS 90241 92981 PARIS LA DÉFENSE CEDEX service-relations.clientèle@prepar-vie com\n\nd’ordre médical PREPAR-VIE - CELLULE MEDICALE / MEDECIN CONSEIL Immeuble Le Village 1 - Quartier Valmy 33 Place Ronde - CS 90241 92981 PARIS LA DÉFENSE CEDEX service.medical@prepar-vie.com\n\nL’Assureur s’engage à accuser réception de la demande dans les dix(10) jours ouvrables suivant sa réception (en l’absence de réponse à la", "réclamation apportée dans ce délai), et à apporter une réponse au maximum dans les 2 (deux) mois suivant sa date de réception (sauf circonstances particulières dont vous serez alors informé).\n\nSi, malgré nos efforts pour vous satisfaire, vous restez mécontent de notre décision, vous pourrez faire appel au Médiateur compétent, à savoir :\n\n• le médiateur de Médiation-Net pour toute réclamation relative aux modalités de commercialisation du votre adhésion :\n\n- via le site https://www.mediation-net-consommation.com/ - par courrier postal à l’adresse suivante : MEDIATION-NET CONSOMMATION, 34 rue des Epinettes 75017 PARIS - par téléphone de 9h00 à 20h00 du lundi au samedi.\n\n• celui de l’Assurance (La Médiation de l’Assurance, TSA 50 110 - 75441 PARIS cedex 09 ou le saisir en ligne sur le site www.mediation- assurance.org), pour toute autre réclamation, et ceci sans préjudice des autres voies d’actions légales.\n\nLe recours au Médiateur est gratuit et s’effectue sans préjudice des autres voies d’actions légales, dans un délai maximum d’un an à compter de la date de la réclamation écrite. Le recours au Médiateur ne peut être fait parallèlement à la saisine des tribunaux. Cependant, ce recours ne porte pas atteinte à une éventuelle procédure contentieuse ultérieure : le délai de prescription de l’action en justice est interrompu à compter de la saisine du Médiateur compétent et pendant le délai de traitement de la réclamation par le Médiateur.\n\nARTICLE 25 : DÉCHÉANCE DU DROIT AUX PRESTATIONS\n\nSi, en cours d’adhésion, un Assuré a intentionnellement produit des documents falsifiés ou fait des déclarations fausses, il peut lui être refusé le paiement de toutes les prestations quelle que soit l’époque à laquelle elles se rapportent. Il peut être mis fin à l’adhésion, sans préjudice de toute action en récupération des prestations indûment versées. Toute omission, réticence, fausse déclaration intentionnelle ou non dans les informations qui seront fournies à Forever et notamment dans la déclaration d’un sinistre, vous expose à une déchéance de garanties et à la résiliation de votre adhésion conformément aux articles L113-8 et L113-9 du Code des assurances. Les prestations indûment versées pourront être récupérées par l’Assureur.\n\nARTICLE 26 : PROTECTION DES DONNEES PERSONNELLES\n\nToutes les informations personnelles collectées vous concernant sont enregistrées par l’Assureur, ELOIS et Forever. L’Assureur est responsable du traitement des adhésions, de la vie du contrat, du dénouement du contrat. ELOIS est responsable du traitement de l’entrée en relation. L’Assureur et ELOIS sont co-responsables du traitement de la connaissance client, des réclamations et de la fraude. Elles ont vocation à être utilisées pour (i) la passation, la gestion et l’exécution du contrat d’assurance, (ii) dans le cadre de l’Échange Automatique d’Information en matière fiscale, (iii) pour la lutte contre le blanchiment d’argent et de financement du terrorisme, (iv) pour la lutte contre la fraude, (v) dans le cadre de contentieux et (vi) pour l’amélioration des produits ou des prestations. Pour l’Assureur, ELOIS et FOREVER, les bases légales des traitements mentionnés sont l’exécution du contrat [(i),(v),(vi)], l’intérêt légitime (iv) et le respect des obligations légales [(ii),(iii)]. Les données collectées sont transmises (i) aux équipes ou sous-traitants de l’Assureur, (ii) aux membres du groupe BPCE, (iii) aux organismes professionnels habilités, (iv) aux partenaires commerciaux de l’Assureur, comme des intermédiaires, mandataires ou réassureurs, et (v) aux autorités publiques conformément à la loi. Il n’existe aucune prise de décision entièrement automatisée par l’Assureur, sur la base de vos données personnelles. Les données personnelles collectées sont stockées au sein de l’Union Européenne ou dans des pays dont la protection des données personnelles a été jugée adéquate par la Commission Européenne. Elles sont conservées, par l’Assureur, conformément à la réglementation de manière sécurisée en vue de préserver la confidentialité et mettre en oeuvre les mesures nécessaires pour que les données ne soient pas déformées, endommagées ou communiquées à des tiers non autorisés, et pour une durée réglementaire correspondant soit à la prescription légale, soit à la réglementation des assurances. Vos données personnelles de santé sont particulièrement protégées, accessibles et traitées uniquement par des professionnels spécifiquement formés et soumis à une confidentialité réglementaire. Vous disposez d’un droit d’accès, de rectification, de limitation, de suppression, d’opposition pour motif légitime, d’un droit à la portabilité de vos données, du droit de définir le sort post-mortem de vos données personnelles et, le cas échéant, de retirer votre consentement à tout moment, hormis les cas où la réglementation ne permet pas l’exercice de ces droits. Pour exercer un ou plusieurs de ces droits, il convient de contacter le délégué à la protection des données de l’Assureur, par mail (dpo@prepar- vie.com) ou le médecin conseil de l’Assureur (service.médical@prepar- vie.com) pour vos données de santé, ou l’Assureur par courrier (PREPAR- VIE, Immeuble Le Village 1, Quartier Valmy, 33 Place Ronde, CS 90241, 92800 Puteaux ) pour les informations figurant dans ses propres fichiers ou ceux de ses mandataires. En cas de doute sur l’identification de la personne concernée, une pièce justificative d’identité peut être demandée. Pour ELOIS et FOREVER, toute question relative au traitement de vos données personnelles ainsi qu’à l’exercice de vos droits sont à adresser à : Délégué à la Protection des Données – dpo@simulassur.fr. En cas de réclamation, vous pouvez contacter la CNIL par mail (www. cnil.fr) ou par courrier postal en écrivant à : CNIL - Service des Plaintes - 3 Place de Fontenoy – TSA 80715 - 75334 PARIS CEDEX 07. Vous pouvez vous inscrire sur la liste d’opposition au démarchage par mail (www.bloctel.gouv.fr) ou par courrier postal en écrivant à : OPPOSETEL- Service Bloctel- 6 rue Nicolas Siret –10000 TROYES. Pour plus d’informations, vous pouvez vous reporter, à tout moment, à notre Politique de données personnelles, susceptible d’évoluer au fil du temps, sur notre site internet www.prepar-vie.fr.\n\nARTICLE 27 : LOI APPLICABLE\n\nLa loi applicable au contrat est la loi française.\n\nLe contrat est régi par le Code des Assurances qui prévoit notamment :\n\nArticle L. 113-8 : « Indépendamment des causes ordinaires de nullité, et sous réserve des dispositions de l’article L. 132-26 du Code des Assurances, le contrat d’assurance est nul en cas de réticence ou de fausse déclaration intentionnelle de la part de l’assuré, quand cette réticence ou cette fausse déclaration change l’objet du risque ou en diminue l’opinion pour l’assureur, alors même que le risque omis ou dénaturé par l’assuré a été sans influence sur le sinistre. » « Les primes payées demeurent alors acquises à l’assureur, qui a droit au paiement de toutes les primes échues à titre de dommages et intérêts. » Article L. 113-9 : « L’omission ou la déclaration inexacte de la part de l’assuré dont la mauvaise foi n’est pas établie n’entraîne pas la nullité de l’assurance. Si elle est constatée avant tout sinistre, l’assureur a le droit soit de maintenir le contrat, moyennant une augmentation de prime acceptée par l’assuré, soit de résilier le contrat dix jours après notification adressée à l’assuré par lettre recommandée, en restituant la portion de 0 825 679 808 Service 0,15€ /min + prix appel", "la prime payée pour le temps où l’assurance ne court plus. Dans le cas où la constatation n’a lieu qu’après un sinistre, l’indemnité est réduite en proportion du taux des primes payées par rapport au taux des primes qui auraient été dues, si les risques avaient été complètement et exactement déclarés ».\n\nArticle L. 132-26 : « L’erreur sur l’âge de l’assuré n’entraîne la nullité de l’assurance que lorsque son âge véritable se trouve en dehors des limites fixées pour la conclusion des contrats par les tarifs de l’assureur. Dans tous les cas, si, par suite d’une erreur de ce genre, la prime payée est inférieure à celle qui aurait dû être acquittée, le capital ou la rente garantis sont réduits en proportion de la prime perçue et de celle qui aurait correspondu à l’âge véritable de l’assuré. Si au contraire, par suite d’une erreur sur l’âge de l’assuré, une prime trop forte a été payée, l’assureur est tenu de restituer la portion de prime qu’il a reçue en trop sans intérêt. »\n\nARTICLE 28 : MODIFICATIONS REGLEMENTAIRES\n\nToute modification à intervenir sur la législation ou la règlementation relatives à l’assurance des emprunteurs ou ayant des répercussions sur le Contrat est de plein droit applicable à la date de son entrée en vigueur."]}, {"id": "kala", "name": "Kala Emprunteur", "assureur": "AESIO mutuelle", "base": "?", "version": "Juin 2022", "ref": "E0234268EMPR", "produit": "Kala", "pages": ["Notice d’information Du contrat d’assurance emprunteur Kala / E0234268EMPR\n\nerVersion applicable à compter de 1 Juin 2022\n\nLe contrat Kala est un contrat collectif d’assurance à adhésion facultative individuelle, souscrit par l’Association de Promotion de Prévoyance Santé et Retraite (A.P.P.S.R) - association à but non lucratif régie par la loi du 1er juillet 1901 située au, 120 avenue du Général Leclerc 75014 Paris auprès de AESIO mutuelle, Mutuelle régie par les dispositions du Livre II du Code de la Mutualité et inscrite au Répertoire SIRENE sous le n° SIREN 775627391, ci-après dénommée, « la Mutuelle » dont le siège social est situé à 4 rue du Général Foy 75008 PARIS. Le présent document est établi en application de l’article L.221-6 du Code de la mutualité. Il définit le contenu des engagements contractuels réciproques entre l’Assureur (la Mutuelle) et chaque Assuré en ce qui concerne les prestations et les cotisations. L’organisme gestionnaire du contrat est par délégation FOREVER, Société par actions simplifiée au capital de 10 000€ situé au 73 Rue du Château à 92100 Boulogne-Billancourt.\n\nPour toute opération liée à la gestion de votre contrat, vous devez contacter la Mutuelle par l'intermédiaire de FOREVER, gestionnaire du contrat aux coordonnées suivantes : FOREVER Service Gestion : 14 rue Pierre Gilles de Gennes - CS40412 - 76137 MONT SAINT AIGNAN Cedex\n\nLexique\n\nLes définitions ci-après sont contractuelles et seront les seules retenues pour l’application du présent contrat.\n\nPour faciliter la lecture de la notice, « Vous » désigne le ou les assurés et « Nous » désigne AESIO mutuelle, via son gestionnaire FOREVER.\n\nAccident : Toute atteinte corporelle médicalement constatée, non intentionnelle de la part de l'Assuré et provenant de l’action soudaine et imprévisible d'une cause extérieure. Les malaises cardiaques, les infarctus du myocarde, les spasmes coronariens, les troubles du rythme cardiaque, les lombo-sciatalgies, les accidents vasculaires et les hémorragies cérébrales ne sont pas considérés comme des Accidents. Adhérent : personne morale ou physique membre de l’A.P.P.S.R, désignée comme telle au certificat d’adhésion, signataire de la demande d’adhésion et acquittant les cotisations. Il intervient en tant qu’emprunteur, co-emprunteur ou caution dans l’opération de crédit objet de l’assurance. Adhésion : acceptation formelle des termes du présent contrat d’assurance et des statuts de la mutuelle. Elle est conclue sur la base des déclarations faites par l’Adhérent sur la Demande d’Adhésion et après accomplissement des formalités médicales et financière, et donne lieu à la formalisation d’un Bon pour Accord et d’un Certificat d’Adhésion. Age de l’Assuré : âge calculé par différence entre la date du jour et votre date de naissance (âge exact). Assuré : personne physique domiciliée en France Métropolitaine ou dans DROM-COM, répondant aux conditions d’admission, sur la tête de laquelle reposent les garanties du contrat et désignée comme telle au certificat d’adhésion. Assuré sans activité professionnelle : Assuré n'exerçant pas d'activité professionnelle rémunérée, y compris les assurés inscrits à Pôle Emploi ou tout autre organisme assimilé, ainsi que les conjoints collaborateurs.\n\nAssureur : Désigne la mutuelle AESIO Bénéficiaire : - l’Organisme prêteur, réputé bénéficiaire acceptant et désigné à l’adhésion et éventuellement pour la garantie décès, les personnes physiques désignées à l’adhésion après accord express de l’Organisme prêteur - l’Assuré lui-même s’il est Caution pour les garanties ITT, IPT, IPP, PTIA, Bon pour Accord : Document émis en cas de conditions particulières de type surprime, exclusions Capital Initial, Capital Restant Dû: ce sont les montants en vigueur mentionnés aux tableaux d’amortissement des prêts couverts, dans la limite des montants déclarés à l’Assureur et mentionnés au certificat d’adhésion. Caution : personne qui s’engage à garantir l’exécution de l’obligation de remboursement par l’emprunteur ou le co-emprunteur en", "cas de défaut de paiement par celui-ci. Certificat d’adhésion : document contractuel remis à l'Adhérent constatant son adhésion au contrat. Il matérialise l’acceptation du risque par la Mutuelle, la date d’effet de l’assurance, les prêts couverts, leurs caractéristiques, les garanties et montant assurés, les options s
