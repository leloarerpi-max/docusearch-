des pathologies ainsi que des traumatismes de la colonne vertébrale et des atteintes paravertébrales suivantes : hernie discale, protrusion discale, pincement discal, entorse cervicale, cervicalgie, dorsalgie, lombalgie, sciatalgie, sciatique, lumbago, cruralgie, radiculalgie, discopathie, scoliose, cyphose, hyperlordose, névralgie cervico-brachiale, tassement vertébral, fracture vertébrale, luxation vertébrale, canal lombaire étroit, canal cervical étroit, spondylolisthésis, spondylarthrite ainsi que leurs suites et conséquences, sauf si ces cas donnent lieu à une intervention chirurgicale nécessitant une Hospitalisation continue de plus de sept (7) jours ; Toutefois, l’Assuré est garanti en cas de fractures ou d’affections tumorales de la colonne vertébrale.\n\nLes Assurés ayant souscrit l’option rachat DOS et PSY sont garantis pour ces affections sans condition d’Hospitalisation.\n\nExclusions pour les garanties ITT, IPT, IPP et GIS :\n\n• les interventions ou traitements esthétiques et plastiques autres que la chirurgie reconstructrice consécutive à une maladie ou un Accident garanti au Contrat ; • les congés légaux de maternité et paternité dans les conditions prévues au Code de la Sécurité sociale pour les salariés, que l’Assuré soit salarié ou non ;\n\nLa période légale de congé de maternité, telle qu’elle est définie à l’article L 1125-17 du Code du Travail, n’est pas considérée comme une période d’incapacité. Elle est donc déduite de la période d’ITT susceptible de faire l’objet d’une prise en charge, en plus de la durée de Franchise, que l’Assurée soit salariée ou non.\n\nVIE DU CONTRAT\n\n1. Prise d’effet de l’adhésion\n\nL’adhésion au Contrat prend effet à la date d’effet indiquée au Certificat d’adhésion remis à l’Assuré. La date d’effet de l’Adhésion correspond à la date à laquelle la Demande d’Adhésion a été signée électroniquement.\n\n2. Durée de l’adhésion au Contrat\n\nL’adhésion est conclue pour une période initiale de 12 mois.\n\nElle se renouvelle ensuite par tacite reconduction, à sa date anniversaire, pendant toute la durée de remboursement de l’opération de crédit, sous réserve des cas de cessation de l’adhésion prévus au paragraphe « Cessation de l’adhésion au Contrat ».\n\n3. Modification des conditions d’assurance à déclarer\n\nVotre Contrat est établi d’après vos déclarations lors de votre adhésion.\n\nEn cours de Contrat, Vous devez communiquer au Gestionnaire par écrit, dès que vous en avez connaissance :\n\n• toute modification des caractéristiques de votre prêt ou de l’acte de cautionnement, • tout remboursement anticipé de votre prêt, • tout changement de votre situation (lieu de résidence habituelle, la catégorie socio-professionnelle, …) ou modification de vos coordonnées personnelles.\n\nIl est précisé qu’une modification des caractéristiques de votre prêt ou de l’acte de cautionnement est susceptible d’entraîner une modification du montant de vos cotisations. En cas de variation du montant de l’échéance en cours de prêt :\n\nEn cas de variation à la hausse : Toute augmentation des échéances (en nombre ou en montant) devra être communiquée à l’Assureur et pourra donner lieu à de nouvelles formalités d’adhésion :\n\n• en cas d’augmentation de la durée du prêt supérieure à 5 ans • en cas d’augmentation de la Quotité de l’Assuré\n\nAucune augmentation ne sera prise en compte par l’Assureur si elle intervient pendant une période d’ITT, IPT ou IPP de l’Assuré sauf si elle : - résulte de la mise en jeu d’une clause contractuelle prévue et programmée dans l’offre, dès l’origine du prêt, - est appliquée automatiquement et ne résulte pas d’une demande expresse de l’Assuré ou de l’emprunteur auprès de l’organisme prêteur, - intervient au plus une fois par an\n\nEn cas de variation à la baisse : Toute baisse des échéances (en nombre ou en montant) sera prise en compte par l’Assureur, qu’elle intervienne pendant ou en dehors d’une période d’ITT, IPT, IPP.\n\n4. Cessation de l’adhésion au Contrat\n\nL’adhésion cesse automatiquement et de plein droit :\n\n• au terme du prêt ou de l’acte de cautionnement ; • en cas d’exigibilité du prêt avant terme ; • en cas de résiliation du prêt pour déchéance du terme prononcée par l’Organisme prêteur ; • dès que l’Assuré a entièrement remboursé l’emprunt qui a fait l’objet de votre adhésion ; • lorsque l’Assuré atteint les limites d’âge aux prestations ; • si l’Assuré est une personne morale, le jour où l’Assuré perd sa qualité d’associé ou de dirigeant de droit de la personne morale adhérente ; • si l’Assuré est Caution, à la date de cessation du Contrat de cautionnement ; • à la date de résiliation de l’adhésion, dans les conditions définies au paragraphe « Faculté de résiliation ».\n\nDURÉE DES GARANTIES\n\n1. Début des garanties\n\nSous réserve de l’acceptation par l’Assureur et du paiement par l’Adhérent de la première cotisation, les garanties prennent effet :\n\nEn cas de Vente à distance : à la date de la signature de l’offre de l’opération de crédit ou de l’acte de cautionnement et au plus tôt à l’expiration du délai de renonciation de 30 jours calendaires prévu au sous-chapitre « Faculté de renonciation » ; délai qui court à compter de la date d’effet de l’adhésion. Les garanties peuvent prendre effet à la date de la signature de l’offre de l’opération de crédit ou de l’acte de cautionnement, lorsque celle- ci intervient avant l’expiration du délai de renonciation, à condition que l’Adhérent le demande dans l’espace prévu sur la Demande d’adhésion pour la mise en œuvre des garanties.", "Dans les autres cas : à la date de la signature de l’offre de l’opération de crédit ou de l’acte de cautionnement et au plus tôt à la date expressément notifiée par l’Assureur dans le Certificat d’adhésion. Dans tous les cas, les garanties ne peuvent pas prendre effet avant la date d’effet de l’adhésion au Contrat. En cas de refus d’une opération de crédit par l’Organisme prêteur, les cotisations d’assurance afférentes à cette opération de crédit et éventuellement perçues lors de l’adhésion, sont intégralement remboursées. L’adhésion au Contrat est alors réputée ne jamais avoir pris effet.\n\n2. Maintien des conditions d’acceptation et de tarifs\n\nÀ compter de la prise d’effet de l’adhésion et sous réserve du paiement régulier des cotisations conformément à l’échéancier prévu, l’Assureur s’engage à maintenir les conditions d’acceptation et de tarifs notifiés sur le Certificat d’adhésion pour les garanties souscrites tant que les garanties seront en vigueur.\n\nLe maintien de ces conditions d’acceptation et de tarifs implique :\n\n• que la signature de l’offre de l’opération de crédit intervienne dans un délai de 6 mois à compter de la date d’effet de l’adhésion mentionnée au Certificat d’adhésion, • et que, dans le cadre d’un prêt, le premier déblocage des fonds intervienne dans un délai de 24 mois à compter de la date de signature de l’offre de prêt.\n\nLes cotisations fixées à l’adhésion, sont garanties sur toute la durée du prêt sauf en cas de changement du tableau d’amortissement et/ou des caractéristiques du (des) prêt(s) couvert(s) et/ou de modification de garantie faisant l’objet d’un avenant sur justificatif de l’Organisme Prêteur.\n\n3. Fin des garanties\n\nLes garanties prennent fin à la date de fin de l’adhésion (cf paragraphe « Cessation de l’adhésion au Contrat »).\n\nÀ l’égard de l’Assuré, les garanties cessent :\n\n• le jour de son 86ème anniversaire, pour la garantie Décès ; • le jour de son 71ème anniversaire pour la garantie PTIA , • pour les garanties ITT, IPP, IPT le jour du départ ou mise en préretraite ou retraite, (sauf en cas de mise en retraite anticipée pour inaptitude), et, au plus tard en cas de poursuite de manière effective d’une activité professionnelle rémunérée, le jour de son 67ème ou 71ème anniversaire (selon l’option choisie et mentionnée au Certificat d’adhésion) .\n\nLES COTISATIONS\n\n1. Le tarif\n\nLes cotisations - tous frais et taxes compris - sont calculées sur le montant du Capital restant dû et sont fixées en fonction des informations recueillies à l’adhésion et notamment de l’âge de l’Assuré, de son statut professionnel, de sa profession, de la Quotité assurée, des garanties et des options souscrites ainsi que des éventuelles conditions particulières.\n\nAu montant des cotisations d’assurance, s’ajoutent lors de l’adhésion celui des frais de dossier ainsi que celui de la cotisation à l’Association, dont les montants sont indiqués dans la Demande d’adhésion.\n\nÀ l’adhésion, un tableau récapitulatif des cotisations annuelles prévisionnelles sera adressé à l’Assuré. Le tarif est garanti sauf changement du taux des taxes, instauration de nouvelles impositions ou nouvelles décisions législatives ou réglementaires applicables au Contrat qui s’imposerait aux adhésions en cours et entraînerait une modification du montant de la cotisation. 2. Paiement des cotisations\n\nLa cotisation est payable d’avance par prélèvement bancaire sur un compte ouvert dans un établissement bancaire situé dans un pays de la zone euros, mensuellement, trimestriellement, semestriellement ou annuellement, en fonction de la périodicité choisie lors de l’adhésion. Par ailleurs tout mois commencé est dû.\n\n3. Non-paiement des cotisations\n\nÀ défaut de paiement d’une cotisation ou d’une fraction de cotisation dans un délai de 10 jours suivant la date d’échéance, l’Assureur adresse, au dernier domicile connu de l’Adhérent, une lettre recommandée informant que le Contrat sera résilié dans un délai de 40 jours après l’envoi de cette lettre, si la cotisation est toujours impayée à l’issue de ce délai (article L. 141-3 du Code des assurances). L’Adhérent restera alors débiteur des cotisations dues et des frais liés à la gestion de ces impayés. L’Organisme prêteur en sera alors informé et pourra, s’il le souhaite, demander à FOREVER (Gestionnaire du Contrat) de maintenir le Contrat en vigueur en se substituant à l’Adhérent pour le paiement des cotisations.\n\nMISE EN ŒUVRE DES GARANTIES 1. MODALITES DE DECLARATION\n\nEn cas de Sinistre, l’Assuré ou à défaut ses ayants droit doit en informer le Gestionnaire. Les déclarations doivent être adressées à l’adresse suivante :\n\nFOREVER – SERVICE SINISTRE 120 AVENUE DU GENERAL LECLERC – CS 10029 75680 PARIS CEDEX 14\n\n2. Délai de déclaration à l’Assureur\n\nEn cas d’ITT, d’IPP ou d’IPT l’Assuré dispose d’un délai de 30 jours au-delà de la Franchise choisie pour déclarer le Sinistre et fournir les pièces justificatives à l’Assureur. Ces pièces sont à renouveler à chaque prolongation d’arrêt de travail, dans un délai de 30 jours.\n\nPassés ces délais et dans les conditions prévues à l’article L. 113-2 du Code des assurances, les prestations ne sont dues qu’à compter de la date de réception des pièces.\n\nEn tout état de cause, sous peine de déchéance de garantie et/ou d’interruption de paiement des prestations en cours de service en faveur de l’Assuré ou l’Adhérent, l’Assureur se réserve le droit de demander à tout moment à l’Assuré, l’Adhérent ou aux Bénéficiaires désignés toute justification qui lui paraîtrait nécessaire afin de contrôler les déclarations qui lui sont faites.\n\n3. Les documents à adresser :\n\nEn cas de décès :\n\n• la copie intégrale de l’acte de décès, • un certificat médical à compléter par le médecin traitant ou à défaut par le médecin ayant constaté le décès, accompagné de toutes les pièces permettant de justifier les circonstances et les causes du décès, • une déclaration écrite précisant les circonstances du décès, la date et le lieu, et le cas échéant le nom des témoins, du ou des tiers responsable(s), • la copie du procès-verbal et/ou l’identité de l’autorité ayant verbalisé, si un procès-verbal est dressé, • une attestation de l’Organisme prêteur indiquant le montant du Capital restant dû au jour du décès, • le tableau d’amortissement au jour du décès, • la copie de l’offre de prêt, • si le Bénéficiaire n’est pas l’Organisme prêteur, la copie d’un document", "officiel permettant la justification de sa qualité (copie de livret de famille, du pacte civil de solidarité, …), • toutes autres pièces demandées par le Gestionnaire en possession de l’Assuré ou auxquelles les ayants droit peuvent avoir légalement accès, nécessaires à l’instruction de la demande d’indemnisation.\n\nEn cas de Perte Totale et Irréversible d’Autonomie :\n\n• un questionnaire médical fourni par l’Assureur dans lequel toutes les questions seraient posées afin d’obtenir toutes les informations dont nous aurions besoin pour l’instruction du sinistre, évitant toute omission. Tout comme pour le décès, merci de nous transmettre ce certificat médical. • la notification de la Sécurité sociale de prise en charge de la Perte Totale et Irréversible d’Autonomie avec assistance d’une tierce personne. Si l’Assuré n’est pas assujetti à la Sécurité sociale, il sera nécessaire de fournir toute preuve attestant de cette invalidité, • en cas d’Accident, une déclaration écrite précisant les circonstances du Sinistre, la date et le lieu, et le cas échéant le nom des témoins, du ou des tiers responsable(s), • la copie du procès-verbal et/ou l’identité de l’autorité ayant verbalisé, si un procès-verbal est dressé, • une attestation de l’Organisme prêteur indiquant le montant du Capital restant dû au jour de la reconnaissance par l’Assureur de la Perte Totale et Irréversible d’Autonomie, • le tableau d’amortissement du prêt concerné, • la copie de l’offre de prêt, • toutes autres pièces demandées par le Gestionnaire en possession de l’Assuré ou auxquelles celui-ci peut avoir légalement accès, nécessaires à l’instruction de la demande d’indemnisation.\n\nEn cas d’Incapacité Temporaire Totale (ITT), d’Invalidité Permanente Partielle (IPP), d’Invalidité Permanente Totale (IPT) et d’Invalidité Spécifique (GIS) :\n\n• l’avis d’arrêt de travail initial et les avis de prolongation délivrés par le médecin, • en cas d’Hospitalisation, le bulletin de situation indiquant la date d’entrée et de sortie, • le questionnaire médical fourni par le Gestionnaire, à retourner à notre Médecin conseil sous pli confidentiel, complété et signé par le médecin de l’Assuré indiquant la nature de l’Accident ou de la Maladie qui justifie l’incapacité ou l’invalidité, la date de début et la durée probable de cet état, • en cas de Rechute un certificat médical précisant qu’il s’agit de la même Affection et/ou d’une nouvelle Affection résultant du Sinistre initial ainsi que l’arrêt de travail mentionnant la Rechute, • la production d’un titre de pension d’invalidité de 2ème ou 3ème catégorie de la Sécurité sociale pour les salariés, d’un congé de longue maladie pour les fonctionnaires ou d’une notification d’inaptitude totale à l’exercice de la profession pour les non-salariés en cas d’Accident, • une déclaration écrite précisant les circonstances du Sinistre, la date et le lieu, et le cas échéant le nom des témoins, du ou des tiers responsable(s), • la copie du procès-verbal et/ou l’identité de l’autorité ayant verbalisé, si un procès-verbal est dressé, • le tableau d’amortissement du prêt concerné, • la copie de l’offre de prêt, • toutes autres pièces demandées par le Gestionnaire en possession de l’Assuré ou auxquelles celui-ci peut avoir légalement accès, nécessaires à l’instruction de la demande d’indemnisation, • en cas de reprise de l’activité en temps partiel thérapeutique, un certificat médical de reprise d’activité à temps partiel thérapeutique consécutive à un arrêt de travail, • la copie des justificatifs de paiement de pension ou de rente.\n\nEn cas de sinistre à l’étranger :\n\n• Décès : acte intégral de décès établi par la représentation française située dans le pays concerné (consulat ou ambassade), • PTIA : un certificat médical descriptif de l’état de santé précisant, entre autres, le besoin de l’assistance viagère d’une tierce personne dans l’accomplissement des Actes de la vie Quotidienne, fourni au moyen de documents établis par l’autorité médicale locale et visés par le médecin attaché à la représentation française (consulat ou ambassade) du pays concerné et sous réserve de la possibilité de contrôle par l’Assureur. • IPP, IPT et GIS : un certificat médical descriptif de l’état de santé fourni au moyen de documents établis par l’autorité médicale locale et visés par le médecin attaché à la représentation française (consulat ou ambassade) du pays concerné et sous réserve de la possibilité de contrôle par l’Assureur. • ITT : les prescriptions d’arrêt de travail rédigées par un médecin choisi par l’Assuré.\n\nA défaut de fourniture des documents spécifiques visés ci-avant (original et traduction en français) permettant de justifier le Sinistre, les garanties et options seraient maintenues mais le droit aux prestations serait suspendu jusqu’au jour du retour en France ou dans la zone accordée à l’article « TERRITORIALITE DES GARANTIES ET OPTIONS » selon la garantie. Le paiement des prestations et le décompte de la période de Franchise ne pourront pas avoir lieu avant la date à laquelle le Sinistre aura été reconnu par l’Assureur. Les frais de rapatriement sont à la charge de l’Assuré.\n\nDans tous les cas, l’Assureur :\n\n• peut demander les pièces complémentaires qu’il juge nécessaires pour l’appréciation du Sinistre, • se réserve le droit de faire procéder à toute expertise médicale qu’il juge nécessaire pour contrôler la réalité de l’état de PTIA, IPP, IPT, GIS. Sauf cas de force majeure, le refus du libre accès auprès de l’Assuré des Médecins et des Délégués de l’Assureur entraîne la déchéance du droit aux prestations, • n’est pas lié par les décisions de la Sécurité Sociale ou d’un quelconque organisme de régime obligatoire d’assurance maladie ou le cas échéant par celles du médecin qui a établi le certificat médical.\n\nEXPERTISE AMIABLE ET EXPERTISE JUDICIAIRE\n\n1. Expertise médicale arbitrale amiable\n\nEn cas de désaccord de l’Assuré sur les résultats du Médecin expert mandaté par l’Assureur, son médecin traitant et le Médecin expert désignent un troisième médecin pour arbitrage.\n\nChacune des deux parties réglera les honoraires de son médecin, ceux du troisième médecin arbitre ainsi que tous les frais relatifs à sa nomination et à l’expertise médicale éventuelle, étant supportés par parts égales par les deux parties.\n\n2. Expertise judiciaire\n\nLe recours à la voie judiciaire pour le règlement des prestations est possible dès que survient un différend entre l’Assuré et le Médecin expert. Ce recours est également possible si, à l’issue de l’expertise amiable, une des parties est en désaccord avec l’avis du médecin arbitre, mentionné dans le précédent article.\n\nVERSEMENT DES PRESTATIONS\n\nLes sommes dues sont payables après que le Gestionnaire a réceptionné et étudié le dossier complet. Elles sont toujours versées au profit du(des) Bénéficiaire(s) en euros. En cas de Sinistre provoqué par un tiers responsable, l’Assureur est subrogé dans les droits de l’Assuré, c’est-à-dire qu’il va exercer son recours contre le tiers responsable à concurrence des prestations et indemnités qui auront été versées.", "BASES LÉGALES\n\n1 . Faculté de renonciation\n\nL’Adhérent a la faculté de renoncer à l’adhésion, sous réserve de l’accord de l’Organisme prêteur, dans un délai de 30 jours calendaires à compter de la prise d’effet de l’adhésion.\n\nIl doit signifier la renonciation à FOREVER par lettre recommandée avec accusé de réception à :\n\nFOREVER - SERVICE RESILIATION 14 RUE PIERRE GILLES DE GENNES 76130 MONT SAINT AIGNAN\n\nCette lettre pourrait être rédigée en ces termes :\n\n« Je soussigné(e) Nom :………Prénom :……Adresse complète : …. déclare par la présente renoncer à mon adhésion au Contrat MEROS EMPRUNTEUR n° et demande le remboursement du versement que j’ai effectué le ………… au prorata de la période non couverte. Le …………\n\nSignature »\n\nLa part des cotisations versées, hors cotisation d’Association, correspondant à la période non couverte sera restituée à l’Adhérent dans un délai de 30 jours à compter de la réception de la lettre de renonciation. A compter de l’envoi de cette lettre, l’adhésion au Contrat et les garanties prennent fin.\n\nEffets de la renonciation :\n\nLa renonciation fait disparaître rétroactivement votre adhésion qui est considérée comme n’ayant jamais existé. Les cotisations encaissées font l’objet d’un remboursement dans un délai de trente (30) jours à compter de la date de réception de la lettre. La garantie Décès est acquise jusqu’à l’envoi du chèque correspondant au montant de la cotisation restituée et au plus tard, jusqu’au 30ème jour suivant la date d’effet des garanties. Si des prestations ont déjà été versées au titre de l’adhésion à la Convention, Vous ne pouvez plus exercer votre droit à renonciation.\n\n2. Faculté de Résiliation\n\nA l’initiative de l’Assuré :\n\nConformément à l’article L. 113-12-2 du Code des assurances, l’Adhérent peut résilier l’adhésion à tout moment à compter de la signature de l’offre de prêt. La notification de la résiliation peut être effectué au choix de l’Adhérent : soit par lettre ou tout autre support durable ; soit par déclaration faite auprès de FOREVER (Gestionnaire du Contrat); soit par acte extrajudiciaire ; soit via son espace assuré.\n\nL’Adhérent doit également notifier à FOREVER (Gestionnaire du Contrat) par lettre recommandée ou par envoi recommandé électronique la décision de l’Organisme prêteur, visée à l’article L. 313-31 du Code de la consommation, d’accepter ou de refuser l’assurance de substitution en précisant, le cas échéant, la date de prise d’effet de l’assurance acceptée en substitution.\n\nEn cas d’acceptation par l’Organisme prêteur, la résiliation de l’adhésion prend effet à la plus tardive des deux dates suivantes :\n\n▪ Soit 10 jours après la réception par l’Assureur de la décision de l’Organisme prêteur ; ▪ Soit à la date de prise d’effet de l’assurance acceptée en substitution par l’Organisme prêteur.\n\nEn cas de refus par l’Organisme prêteur, l’adhésion n’est pas résiliée.\n\nA l’initiative de l’Assureur :\n\n• en cas de non-paiement des cotisations 3. Traitement et protection des données personnelles\n\nELOÏS, responsable des traitements listés ci-dessous, met en œuvre des traitements de données à caractère personnel, notamment des données de santé, pour l’adhésion, la gestion et l’exécution des Contrats d’assurance ainsi que pour les relations avec ses clients.\n\nCes traitements de données à caractère personnel permettent notamment:\n\n• L’étude des besoins du client ; • L’adhésion ; • La gestion commerciale du Contrat ; • La réalisation d’études marketing ; • La prospection commerciale, sauf si le client s’y est opposé.\n\nL’Assureur et FOREVER, responsables conjoints des traitements listés ci-dessous, mettent en œuvre des traitements de données à caractère personnel, notamment des données de santé, pour la gestion et l’exécution des Contrats ainsi que pour les relations avec leurs clients. Ces traitements de données à caractère personnel permettent notamment :\n\n• La gestion des sinistres ; • La gestion des réclamations ; • La réalisation de statistiques et d’études actuarielles ; • La détection et la lutte contre la fraude ; • La réponse aux obligations légales.\n\nLes données collectées, y compris les données de santé, sont indispensables à ces traitements et sont destinées aux services concernés de ELOÏS, de FOREVER et de l’Assureur, ainsi que, le cas échéant, à leurs sous-traitants, partenaires, prestataires, mandataires, réassureurs ou aux organismes professionnels concernés.\n\nLes données collectées sont susceptibles d’être conservées pendant toute la durée de la relation contractuelle augmentée de la durée des prescriptions légales, et ce, en fonction du type de données collectées.\n\nEn application de la législation en vigueur, toute personne physique partie ou intéressée au Contrat dispose d’un droit d’accès, de rectification ou d’effacement, de limitation du traitement de ses données, d’un droit d’opposition aux traitements, d’un droit à la portabilité de ses données ainsi que du droit de définir des directives relatives au sort de ses données après le décès, qui s’exercent en justifiant de son identité via l’Espace Assuré ou à l’adresse suivante :\n\nFOREVER – SERVICE GESTION 14 RUE PIERRE GILLES DE GENNES – CS 40412 76137 MONT SAINT AIGNAN\n\nSi elle estime que ses droits ne sont pas respectés, elle peut introduire une réclamation auprès de la CNIL (Commission Nationale de l’Informatique et des Libertés).\n\nLes demandes portant sur les données de santé doivent être établies à l’attention du « Médecin Conseil ». FOREVER a nommé un délégué à la protection des données personnelles dont les coordonnées sont les suivantes : dpo@simulassur.fr\n\nConformément à l’article L 223-1 du Code de la consommation, l’Adhérent qui ne souhaite pas faire l’objet de prospection commerciale par voie téléphonique, en dehors du ou des Contrats en cours d’exécution ou de produits venant en complément dudit Contrat, peut s’inscrire, gratuitement sur la liste d’opposition au démarchage téléphonique sur le site www. bloctel.gouv.fr.\n\nde sa relation avec l’Assureur et le distributeur, peut s’inscrire, gratuitement, sur la liste d’opposition au démarchage téléphonique sur le site www.bloctel.gouv.fr.", "4. Réclamations – Médiation\n\nPour toute réclamation relative au Contrat, l’Adhérent, l’Assuré (ou ses ayants droit), désignés ci-après comme le « réclamant », doit s’adresser prioritairement à son interlocuteur habituel qui est en mesure de lui fournir toutes informations et explications.\n\nSi le réclamant ne reçoit pas une réponse satisfaisante, il peut adresser une réclamation écrite (mentionnant les références du dossier concerné et accompagnée d’une copie des éventuelles pièces justificatives) à l’adresse ci-dessous :\n\nFOREVER – SERVICE GESTION DES RECLAMATIONS 120 AVENUE DU GENERAL LECLERC – CS 10029 75680 PARIS CEDEX 14 Ce service accusera réception de la réclamation dans les 10 jours ouvrables suivant sa date de réception (sauf si la réponse à la réclamation est apportée dans ce délai) et, en tout état de cause, apportera une réponse à la réclamation dans un délai maximum de 2 mois suivant sa date de réception.\n\nSi la réponse apportée ne convient pas ou en cas de rejet ou de refus de faire droit en totalité ou partiellement à la réclamation par le Service Réclamations du Gestionnaire, le réclamant peut alors s’adresser à l’Assureur :\n\nVia le formulaire de contact présent sur le site internet, www.prevoir. com ou par voie postale à l’adresse suivante :\n\nPRÉVOIR- Vie - Service Réclamations 19 Rue d’Aumale – CS 40019 75306 Paris Cedex 09\n\nIl est recommandé au réclamant de détailler de la manière la plus précise possible les motifs de sa réclamation et d’indiquer le nom de son Contrat ainsi que la référence de son adhésion.\n\nLe Service Réclamations de l’Assureur accusera réception de la réclamation dans les 10 jours ouvrables suivant sa date de réception (sauf si la réponse à la réclamation est apportée dans ce délai) et, en tout état de cause, apportera une réponse à la réclamation dans un délai maximum de 2 mois suivant sa date de réception.\n\nSi un désaccord subsiste, le réclamant peut saisir le Médiateur de l’assurance en lui adressant sa réclamation : - via le site Internet de la Médiation de l’Assurance www.mediation- assurance.org, - ou par voie postale à l’adresse suivante : La Médiation de l’Assurance -TSA 50110- 75441 Paris Cedex 09.\n\nLa procédure ci-dessus ne s’applique pas si une juridiction a été saisie du litige, que ce soit par l’Adhérent, l’Assuré (ou ses ayants droit), par le Gestionnaire ou par l’Assureur.\n\n5. Prescription\n\nLes dispositions relatives à la prescription des actions dérivant du Contrat sont fixées par les articles L114-1 à L 114-3 du Code des assurances reproduits ci-après :\n\nArticle L114-1 du Code des assurances : « Toutes actions dérivant d’un contrat d’assurance sont prescrites par deux ans à compter de l’événement qui y donne naissance. Toutefois, ce délai ne court :\n\n1° En cas de réticence, omission, déclaration fausse ou inexacte sur le risque couru, que du jour où l’assureur en a eu connaissance ; 2° En cas de sinistre, que du jour où les intéressés en ont eu connaissance, s’ils prouvent qu’ils l’ont ignoré jusque-là.\n\nQuand l’action de l’assuré contre l’assureur a pour cause le recours d’un tiers, le délai de la prescription ne court que du jour où ce tiers a exercé une action en justice contre l’assuré ou a été indemnisé par ce dernier. La prescription est portée à dix ans dans les contrats d’assurance sur la vie lorsque le bénéficiaire est une personne distincte du souscripteur et, dans les contrats d’assurance contre les accidents atteignant les personnes, lorsque les Bénéficiaires sont les ayants droit de l’assuré décédé. Pour les contrats d’assurance sur la vie, nonobstant les dispositions du 2°, les actions du bénéficiaire sont prescrites au plus tard trente ans à compter du décès de l’Assuré. »\n\nArticle L114-2 du Code des assurances : « La prescription est interrompue par une des causes ordinaires d’interruption de la prescription et par la désignation d’experts à la suite d’un Sinistre. L’interruption de la prescription de l’action peut, en outre, résulter de l’envoi d’une lettre recommandée avec accusé de réception adressée par l’Assureur à l’Assuré en ce qui concerne l’action en paiement de la prime et par l’Assuré à l’Assureur en ce qui concerne le règlement de l’indemnité. »\n\nArticle L114-3 du Code des assurances : « Par dérogation à l’article 2254 du Code civil, les parties au contrat d’assurance ne peuvent, même d’un commun accord, ni modifier la durée de la prescription, ni ajouter aux causes de suspension ou d’interruption de celle-ci. »\n\nArticle L. 192-1 du Code des assurances : « Le délai prévu à l’article L. 114-1, alinéa 1er , est porté à cinq ans en matière d’assurance sur la vie pour les départements du Bas-Rhin, du Haut-Rhin et de la Moselle. »\n\nInformation complémentaire : les causes ordinaires d’interruption de la prescription visées à l’article L114-2 du Code des assurances sont énoncées aux articles 2240 à 2246 du Code civil reproduits ci-après.\n\nArticle 2240 du Code civil : « La reconnaissance par le débiteur du droit de celui contre lequel il prescrivait interrompt le délai de prescription. » Article 2241 du Code civil : « La demande en justice, même en référé, interrompt le délai de prescription ainsi que le délai de forclusion. Il en est de même lorsqu’elle est portée devant une juridiction incompétente ou lorsque l’acte de saisine de la juridiction est annulé par l’effet d’un vice de procédure. »\n\nArticle 2242 du Code civil : « L’interruption résultant de la demande en justice produit ses effets jusqu’à l’extinction de l’instance. »\n\nArticle 2243 du Code civil : « L’interruption est non avenue si le demandeur se désiste de sa demande ou laisse périmer l’instance, ou si sa demande est définitivement rejetée. »\n\nArticle 2244 du Code civil : « Le délai de prescription ou le délai de forclusion est également interrompu par une mesure conservatoire prise en application du Code des procédures civiles d’exécution ou un acte d’exécution forcée. »\n\nArticle 2245 du Code civil : « L’interpellation faite à l’un des débiteurs solidaires par une demande en justice ou par un acte d’exécution forcée ou la reconnaissance par le débiteur du droit de celui contre lequel il prescrivait interrompt le délai de prescription contre tous les autres, même contre leurs héritiers. En revanche, l’interpellation faite à l’un des héritiers d’un débiteur solidaire ou la reconnaissance de cet héritier n’interrompt pas le délai de prescription à l’égard des autres cohéritiers, même en cas de créance hypothécaire, si l’obligation est divisible. Cette interpellation ou cette reconnaissance n’interrompt le délai de prescription, à l’égard des autres codébiteurs, que pour la part dont cet héritier est tenu. Pour interrompre le délai de prescription pour le tout, à l’égard des autres codébiteurs, il faut l’interpellation faite à tous les héritiers du débiteur décédé ou la reconnaissance de tous ces héritiers. »\n\nArticle 2246 du Code civil : « L’interpellation faite au débiteur principal ou sa reconnaissance interrompt le délai de prescription contre la caution. »\n\n6. Sanction des omissions ou fausses déclarations\n\nLes déclarations de l’Adhérent et de l’Assuré concernant son âge, son état civil, son état de santé, ses antécédents médicaux, ses activités", "professionnelles et ses conditions d’exercice servent de base à l’adhésion au Contrat qui devient incontestable dès son entrée en vigueur. La nullité du Contrat pourra être soulevée conformément à l’article L. 113-8 du Code des assurances en cas de réticence ou de fausse déclaration intentionnelle. L’Assureur conservera alors les cotisations versées à titre de dédommagement. De plus, l’Assureur est fondé, à titre de dédommagement, à réclamer à l’Adhérent le paiement de toutes les cotisations dues jusqu’au terme du Contrat. L’Adhérent devra également rembourser à l’Assureur les indemnités versées à l’occasion des Sinistres réglés au cours de l’adhésion.\n\nSi après un Sinistre, l’Assureur constate une omission ou une déclaration inexacte de nature à atténuer son appréciation du risque, les indemnités pourront être réduites, conformément à l’article L. 113-9 du Code des assurances. Si elle est constatée avant la survenance d’un Sinistre, une telle omission ou déclaration inexacte donnera lieu soit au maintien du Contrat moyennant une augmentation de cotisation acceptée par l’Adhérent, soit à la résiliation du Contrat.\n\nRappel des dispositions des articles L 113-8, L 113-9 et L 132-26 du code des assurances :\n\nArticle L.113-8 du Code des assurances : « Indépendamment des causes ordinaires de nullité, et sous réserve des dispositions de l’article L.132- 26, le contrat d’assurance est nul en cas de réticence ou de fausse déclaration intentionnelle de la part de l’assuré, quand cette réticence ou cette fausse déclaration change l’objet du risque ou en diminue l’opinion pour l’assureur, alors même que le risque omis ou dénaturé par l’assuré a été sans influence sur le sinistre. Les primes payées demeurent alors acquises à l’assureur, qui a droit au paiement de toutes les primes échues à titre de dommages et intérêts ».\n\nArticle L.113-9 du Code des assurances : « L’omission ou la déclaration inexacte de la part de l’assuré dont la mauvaise foi n’est pas établie n’entraîne pas la nullité de l’assurance. Si elle est constatée avant tout sinistre, l’assureur a le droit soit de maintenir le contrat, moyennant une augmentation de prime acceptée par l’assuré, soit de résilier le contrat dix jours après notification adressée à l’assuré par lettre recommandée avec accusé de réception, en restituant la portion de la prime payée pour le temps où l’assurance ne court plus. Dans le cas où la constatation n’a lieu qu’après un sinistre, l’indemnité est réduite en proportion du taux des primes payées par rapport au taux des primes qui auraient été dues, si les risques avaient été complètement et exactement déclarés ».\n\nArticle L.132-26 du Code des assurances : « L’erreur sur l’âge de l’assuré n’entraîne la nullité de l’assurance que lorsque son âge véritable se trouve en dehors des limites fixées pour la conclusion des contrats par les tarifs de l’assureur. Dans tout autre cas, si par suite d’une erreur de ce genre, la prime payée est inférieure à celle qui aurait dû être acquittée, le capital ou la rente garantis sont réduits en proportion de la prime perçue et de celle qui aurait correspondu à l’âge véritable de l’assuré. Si au contraire, par suite d’une erreur sur l’âge de l’assuré, une prime trop forte a été payée, l’assureur est tenu de restituer la portion de prime qu’il a reçue en trop sans intérêt. »\n\n7. Législation\n\nToute modification à intervenir sur la législation relative à l’assurance des emprunteurs ou ayant des répercussions sur le Contrat est de plein droit applicable à la date de son entrée en vigueur.\n\n8. Subrogation\n\nEn cas de Sinistre provoqué par un tiers responsable, FOREVER (Gestionnaire du Contrat) peut exercer un recours conformément aux dispositions légales, à concurrence des prestations et indemnités versées.\n\nL’Assuré s’engage dès à présent à subroger FOREVER (Gestionnaire du Contrat) intégralement dans ses droits et actions qu’il détiendrait à l’encontre d’un tiers responsable en cas de Sinistre. À cet effet, l’Assuré s’engage à signer et à retourner à FOREVER (Gestionnaire du Contrat) la quittance subrogative adressée en contrepartie du règlement des prestations dues au titre du Contrat.\n\n9. Modification de durée d’un prêt\n\nL’Assureur doit couvrir sans demande de Formalités médicales supplémentaires les emprunts immobiliers dans la limite de 5 ans et des limites prévues au Contrat d’assurance en cas d’allongement de la durée de son prêt dans les conditions prévues par le contrat de prêt initial, avec des garanties et des grilles tarifaires inchangées."]}, {"id": "meros_ci", "name": "Meros CI Emprunteur", "assureur": "Prévoir", "base": "CI", "version": "Septembre 2024", "ref": "MEROS-MAGPR_CI_ME_0924-NI-09/2024", "produit": "Meros", "pages": ["MEROS CI EMPRUNTEUR NOTICE D’INFORMATION VALANT CONDITIONS GENERALES\n\nNOTICE D’INFORMATION – CONDITIONS GÉNÉRALES DU CONTRAT D’ASSURANCE EMPRUNTEUR MEROS CI EMPRUNTEUR N° MAGPR_CI_ME_0924 (VERSION SEPTEMBRE 2024)", "MEROS CI EMPRUNTEUR est un contrat collectif à adhésion facultative n° MAGPR_CI_ME_0924 souscrit par l’Association de la promotion prévoyance, santé et retraite 120 avenue de général Leclerc , 75014 Paris, (ci-après dénommée l’ « Association »), auprès de PRÉVOIR- VIE GROUPE PRÉVOIR, (ci-après dénommée l’ « Assureur »), Société Anonyme au capital de 81 000 000 euros, immatriculée au RCS de PARIS sous le numéro 343 286 183 pour le risque de décès (branche 20 vie-décès), pour les risques Perte Totale et Irréversible d’Autonomie, Incapacité Temporaire Totale de travail, Invalidité Permanente Totale et Invalidité Permanente Partielle (branches 1 et 2 – accident et maladie), dont le siège social est situé au 19 rue d’Aumale – CS 40019 75306 PARIS Cedex 09, entreprise régie par le Code des assurances et contrôlée par l’Autorité de Contrôle Prudentiel et de Résolution (ACPR) - 4 Place de Budapest CS 92459, 75436 Paris Cedex 09.\n\nLa présente Notice d’Information valant Conditions générales a pour objet de décrire les garanties et prestations accordées au titre du contrat MEROS CI EMPRUNTEUR (ci-après dénommé le « Contrat »).\n\nLe Contrat est distribué via l’outil Simulassur par Eloïs (ELOIS), société de courtage en assurances - SAS au capital de 100 000 euros - RCS Paris n° 483 413 258 - APE 6622Z - Assurance de responsabilité civile professionnelle conforme au Code des assurances - ORIAS n°07 019 295 - Siège social 23 Rue du Départ 75014 Paris.\n\nL’organisme gestionnaire du Contrat est, par délégation de l’Assureur, FOREVER, société par actions simplifiée au capital de 10 000 euros, immatriculée au RCS de Nanterre sous le numéro 890 767 940, dont le siège social est situé au 73 rue du Château 92100 Boulogne-Billancourt. FOREVER est immatriculée à l’Orias sous le numéro 20009474 (ci-après dénommé le « Gestionnaire »).\n\nL’adhésion au Contrat est constituée par la présente Notice d’Information, la Demande d’adhésion, le « Bon pour Accord » et le Certificat d’adhésion.\n\nDÉFINITIONS\n\nLe lexique ci-dessous est à la disposition de l’Assuré pour une parfaite compréhension des termes techniques utilisés.\n\nAccident : toute atteinte ou lésion corporelle, non intentionnelle de la part de l’Assuré, provenant de l’action soudaine, brutale, directe et exclusive d’une cause extérieure, et survenue pendant la période de validité des garanties. Ne sont pas considérés comme Accident, les malaises cardiaques, l’infarctus du myocarde, les accidents vasculaires cérébraux et la rupture d’anévrisme.\n\nActes de la Vie Quotidienne (AVQ) : désignent les activités de la vie quotidienne ou activités élémentaires qu’une personne est amenée à effectuer quotidiennement en réponse à ses besoins primaires. Elles se décomposent en 6 catégories :\n\n1. L’habillage : s’habiller et se déshabiller, 2. L’alimentation : se servir à manger de la nourriture préparée, 3. La continence : assurer l’hygiène de l’élimination urinaire et anale, 4. Le déplacement : se déplacer à l’intérieur de son logement ou d’en quitter en cas de danger imprévu, 5. Les transferts : être capable de passer du lit à une chaise ou inversement. 6. La toilette : aptitude de faire sa toilette seul.\n\nAdhérent : personne physique ou morale dont l’adhésion au Contrat a été acceptée et qui paie les cotisations.\n\nAffection : Toute altération de l’état de santé quelle qu’en soit l’origine (Accident ou Maladie).\n\nAssociation des Assurés pour une Protection Solidaire: association régie par la loi du 1er juillet 1901, dont le siège social est situé 14 rue Pierre Gilles de Gennes 76137 Mont Saint Aignan, souscriptrice du Contrat MEROS CI EMPRUNTEUR. Elle a pour activité principale l’examen des situations des salariés et non-salariés, au regard des domaines de la prévoyance et de la retraite collective, l’information des membres, la sélection, la souscription et le suivi des contrats. Ses statuts sont disponibles sur simple demande auprès de ELOÏS.\n\nAssuré : personne physique admise à l’assurance sur qui repose les garanties. Le terme « Assuré » désigne chacun des assurés mentionnés au Certificat d’adhésion.\n\nBénéficiaire : l’Organisme prêteur désigné au Certificat d’adhésion pour percevoir les prestations du Contrat, sauf accord exprès du prêteur et de l’Adhérent pour la désignation d’un autre Bénéficiaire.\n\nBon pour accord : document contractuel confirmant les conditions particulières de l’Adhésion\n\nCapital Initial : montant total du prêt dont l’Adhérent est redevable auprès de l’Organisme prêteur à la date d’effet de l’adhésion. Le Capital Initial ne tient pas compte des Échéances de prêt impayées ainsi que des intérêts de retard ou de pénalités.\n\nCapital Restant Dû : montant total du prêt dont l’Adhérent est redevable auprès de l’Organisme prêteur à une date déterminée. Le Capital Restant Dû ne tient pas compte des Échéances de prêt impayées ainsi que des intérêts de retard ou de pénalités.\n\nCaution : personne physique s’engageant à garantir l’exécution de l’obligation de remboursement par l’emprunteur ou le co-emprunteur en cas de défaut de paiement par celui-ci.\n\nCertificat d’adhésion : document contractuel confirmant l’adhésion au Contrat et précisant la date d’effet, les caractéristiques des garanties accordées par l’Assureur à l’Assuré, les franchises ainsi que le montant des cotisations prévisionnelles. Le Certificat d’Adhésion vaut délégation de bénéfice.\n\nConjoint / Concubin : L’époux ou l’épouse de l’Assuré, non divorcé ni séparé de corps par un jugement définitif ou le partenaire de l’Assuré bénéficiaire d’un Pacte Civil de Solidarité avec ce dernier, en vigueur à la date du Sinistre. Le concubin notoire de l’Assuré pourra être considéré comme ayant la qualité de Conjoint, s’il est désigné comme Bénéficiaire en cas de décès sur la Demande d’adhésion et si justification de sa qualité est faite.\n\nConsolidation (date de) : Il s’agit de la date de stabilisation durable de l’état de santé de l’Assuré, cela correspond à la date à laquelle cet état n’est plus susceptible d’évoluer vers une amélioration ni vers une aggravation.\n\nContrat : ensemble des documents qui définit les droits et obligations réciproques de l’Assuré et de l’Assureur.\n\nDemande d’adhésion : document papier ou support électronique permettant à une personne physique ou morale de formaliser sa Demande d’adhésion au Contrat.\n\nEchéance : montant de remboursement conformément au tableau d’amortissement ou échéancier de loyers au jour du Sinistre, dans la limite du montant garanti tels que prévus au Certificat d’adhésion ou avenant au Contrat en vigueur au jour du Sinistre. En cas de différé partiel d’amortissement, l’Echéance est limitée aux seuls intérêts du prêt. L’Echéance ne couvre pas le remboursement du capital pour les Prêts In Fine et les Prêts Relais, ni le remboursement de la valeur résiduelle pour les opérations de financement locatif. Concernant les prêts à paliers intégrant les prêts achat-revente, l’Assureur ne prend pas en charge dans l’Echéance, la part correspondant à un remboursement anticipé de capital, programmé ou non, lié à la revente de l’ancien bien de l’Assuré.", "Formalités médicales : questionnaire de santé, examens médicaux, questionnaire lié à une pathologie, demande d’informations médicales complémentaires pouvant être réclamés à l’Assuré lorsque la Quotité assurée (incluant les prêts immobiliers déjà souscrits ou en cours de souscription) dépasse le montant ou l’âge en fin de prêt indiqué à l’article L113-2-1 du Code des assurances.\n\nFranchise : nombre minimum de jours consécutifs d’incapacité de l’Assuré au-delà duquel l’indemnisation peut commencer. Pendant cette période, aucune prestation n’est due.\n\nHospitalisation : fait de recevoir des soins prescrits par une autorité médicale compétente dans un établissement hospitalier nécessitant un séjour minimum de 24 heures ou d’une nuit. Est considéré comme établissement hospitalier, un hôpital ou une clinique habilitée(e) à pratiquer des actes et des traitements médicaux auprès de personnes malades ou accidentées, possédant les autorisations administratives locales autorisant ces pratiques, ainsi que le personnel nécessaire, à l’exclusion des établissements de soins de suite et de réadaptation et des centres de thermalisme.\n\nIncapacité Temporaire Totale de Travail (ITT) : état qui place l’Assuré, suite à un Accident ou une Maladie garantie, dans l’impossibilité temporaire, complète et continue d’exercer sa profession. L’Assuré sans activité professionnelle au moment du Sinistre est considéré en ITT si son état le place dans l’impossibilité temporaire, complète et continue d’accomplir 4 des 6 Actes de la Vie Quotidienne tels que définis ci-dessus.\n\nInvalidité Permanente Partielle (IPP) : inaptitude de l’Assuré, constatée à la date de Consolidation, d’exercer sa profession.\n\nInvalidité Permanente Totale (IPT) : inaptitude de l’Assuré, constatée à la Date de Consolidation, d’exercer sa profession.\n\nMaladie : toute altération de l’état de santé d’origine non accidentelle constatée par un médecin. Est considéré comme une Maladie le décès qualifié de mort naturelle.\n\nMontant garanti : Montant du capital emprunté assuré par le présent Contrat et calculé à partir de la Quotité assurée.\n\nMédecin conseil : médecin de l’Assureur\n\nMédecin expert : médecin mandaté par le Gestionnaire pour examiner l’Assuré dans le cadre d’un Sinistre.\n\nNon-fumeur : personne n’ayant pas consommé de tabac ou de cigarette électronique, même occasionnellement, au cours des 24 derniers mois, et ne pas avoir cessé de fumer sur demande expresse du corps médical.\n\nOrganisme prêteur : organisme qui a consenti l’opération de crédit qui fait l’objet des garanties accordées par l’Assureur au titre du Contrat.\n\nPerte Totale et Irréversible d’Autonomie (PTIA) : invalidité qui, à la suite d’une Maladie ou d’un Accident, met l’Assuré dans l’incapacité physique ou mentale définitive permanente, médicalement constatée, de se livrer à la moindre occupation, ni au moindre travail lui procurant gain ou profit et le met dans l’obligation définitive d’avoir recours à l’assistance d’une tierce personne pour accomplir les Actes de la Vie Quotidienne.\n\nProfession : métier exercé par l’Assuré lui procurant un salaire, une rémunération ou des revenus.\n\nProposant : personne physique ou morale qui formule une Demande d’adhésion au Contrat.\n\nQuotité : correspond pour chaque Assuré, à la part, en pourcentage du capital emprunté auprès de l’Organisme prêteur, couverte par l’assurance de l’opération de crédit. Elle doit être inférieure ou égale à 100 %. Lorsque plusieurs personnes sont assurées au titre d’une même opération de crédit, le montant total des indemnités versées par l’Assureur ne peut excéder au global, en cas de pluralité de Sinistres, le montant des sommes dues pour une Quotité assurée de 100%. Résidence habituelle : désigne le foyer d’une personne physique (conjoint et/ou enfants) ou le lieu de séjour principal (plus de 183 jours par an).\n\nRechute : Aggravation de l’Affection initiale ou apparition d’une nouvelle Affection résultant du Sinistre initial.\n\nSinistre : tout événement survenu pendant la durée de validité de l’adhésion susceptible de mettre en jeu une garantie souscrite au titre du Contrat.\n\nTaux de change : est ainsi dénommé le taux de change applicable aux montants cités dans la présente notice qui sera déterminé selon le cours de référence de la Banque de France.\n\nOBJET DE L’ASSOCIATION\n\nAssociation de la promotion prévoyance, santé et retraite 120 avenue de général Leclerc 75014 Paris\n\nL’Association a pour objet de favoriser l’accès des adhérents à des garanties d’épargne, de retraite, de prévoyance et de santé au travers de contrats groupes, conclus avec des organismes d’assurance, de favoriser l’accès à des adhérents à l’ensemble de la couverture des risques assurables qu’ils rencontrent, tant de leur vie privée que professionnelle ; de signer des conventions avec les organismes d’assurance habilités pour faire bénéficier ses adhérents de garanties collectives et des services découlant, et suivre l’application desdites conventions ; informer ses adhérents en matière de prévoyance, de santé, de retraite et d’épargne ; effectuer toute opération et prendre toute initiative propre à la réalisation de son objectif social.\n\nOBJET DU CONTRAT\n\nLe Contrat a pour objet, en fonction des garanties et quotités assurées mentionnées sur le Certificat d’adhésion, le versement au Bénéficiaire désigné :\n\n• d’un capital en cas de décès, de Perte Totale et Irréversible d’Autonomie (PTIA),\n\n• de tout ou partie des mensualités du prêt venant à échéance, en cas d’Incapacité Temporaire Totale (ITT), d’Invalidité Permanente Partielle (IPP)ou d’Invalidité Permanente Totale (IPT).\n\nCONDITIONS D’ADHÉSION\n\nPeuvent adhérer au Contrat les personnes physiques, les représentants de personnes morales exerçant des fonctions de dirigeant de la personne morale emprunteuse, ayant la qualité d’emprunteur ou de co-emprunteur d’un prêt et remplissant les conditions suivantes :\n\n• Être âgé à la date de signature de la Demande d’adhésion, d’au moins 18 ans et de : - Moins de 70 ans pour la garantie décès, - Moins de 69 ans pour la garantie PTIA, - Moins de 65 ans pour les garanties ITT, IPP, IPT,\n\n• Avoir contracté un emprunt et/ou étant caution d’un emprunt : - rédigé en français, - libellé en Euros, ou convertis en euros si le prêt était en francs suisses ou en francs pacifiques - auprès d’un organisme prêteur situé en France, en Suisse ou dans la zone Euro pour un montant minimum de 20 000 €\n\n• Avoir satisfait aux formalités d’adhésion,\n\n• Avoir son lieu de Résidence fiscale habituelle en fonction des garanties choisies, selon le tableau ci-après :", "GARANTIES Lieu de résidence\n\nFrance Continentale La Réunion Guadeloupe Martinique Guyane Saint-Martin Mayotte Corse Saint-Barthélemy Polynésie française DÉCÈS X X PTIA X X ITT X X* IPP X X IPT X X\n\n* La franchise sera au minimum de 90, 120 ou 180 jours.\n\nLes personnes assurables ont la qualité d’Assuré dès la date de prise d’effet des garanties.\n\nConditions d’adhésion spécifiques supplémentaires en l’absence de réalisation de Formalités médicales (les adhésions concernées par l’absence de sélection médicale sont celles pour lesquelles la part assurée sur l’encours cumulé des contrats de crédit souscrits par l’Assuré, la présente Demande d’adhésion incluse, et l’âge de ce dernier au jour du remboursement du prêt objet de la demande d’assurance n’excèdent pas les seuils indiqués à l’article L113-2-1 du Code des assurances) :\n\n• l’Assuré doit exercer une activité professionnelle, • la franchise sera au minimum de 90, 120 ou 180 jours.\n\nPRÊTS ASSURABLES\n\nSont assurables les prêts ci-dessous :\n\n• Les prêts immobiliers :\n\n- amortissables, - par paliers y compris pour les prêts modulables, - relais d’une durée maximum de 36 mois soit trois (3) ans, - prêt achat-revente (l’Assureur ne prend pas en charge dans l’Echéance la part correspondant à un remboursement anticipé de capital, programmé ou non, lié à la revente de l’ancien bien de l’Assuré), - avec différé partiel/total maximum de 36 mois soit trois (3) ans, - prêt à taux zéro (PTZ), - in fine d’une durée maximum de 240 mois soit vingt (20) ans,\n\n• Les restructurations de crédit (si plus de 60% des prêts est qualifié de prêt immobilier par la banque),\n\n• Les prêts professionnels\n\nRespectant les conditions ci-dessous :\n\n• A taux fixe et/ou révisable, à échéances constantes ou progressives, indexées et/ou modulables, • La durée du prêt, y compris la période de différé et les reports d’échéances, ne doit pas être supérieure à 360 mois soit trente (30) ans.\n\nNe sont pas assurables les prêts suivants :\n\n• Les crédits de trésorerie (le découvert bancaire et la facilité de caisse : crédits renouvelables) ; • Les crédits permanents renouvelables ; • Les prêts viagers hypothécaires ; • Les prêts Europlan ; • Les prêts d’une durée supérieure à 360 mois soit trente (30) ans ; • Les prêts relais ou les prêts avec différé d’une durée supérieure à 36 mois soit trois (3) ans • Les prêts à la consommation et prêts personnel • Les crédit-bail\n\nEn l’absence de réalisation de Formalités médicales (les adhésions concernées par l’absence de sélection médicale sont celles pour lesquelles la part assurée sur l’encours cumulé des contrats de crédit souscrits par l’Assuré, la présente Demande d’adhésion incluse, et l’âge de ce dernier au jour du remboursement du prêt objet de la demande d’assurance n’excèdent pas les seuils indiqués à l’article L113-2-1 du Code des assurances), les prêts in fine ne sont pas assurables.\n\nPrêts libellés en devises :\n\nL’assurance de prêts accordés en devises par des établissements de crédit français situés en France ou succursales françaises d’établissements de crédit étrangers ayant leur siège dans un État membre de l’Union Européenne, ou en Suisse, est possible aux conditions suivantes :\n\n• lors de l’adhésion au Contrat, le montant du prêt à assurer et le tableau d’amortissement correspondant sont convertis en euros selon le Taux de change en vigueur à la date d’adhésion majoré d’un coefficient multiplicateur compris entre 100 et 120% ; • les cotisations d’assurances sont prélevées en euros sur la base du tableau d’amortissement en euros ainsi obtenu ; • en cas de réalisation du risque, l’indemnisation se fera en euros sur la base du tableau d’amortissement en devises en vigueur au jour du Sinistre, du Taux de change au jour de survenance du sinistre et dans la limite du montant tel que prévu au dernier tableau d’amortissement figurant au Certificat d’adhésion en vigueur à la date du Sinistre. Une réactualisation du tableau d’amortissement et des cotisations afférentes pourra être demandée annuellement par l’Adhérent avant le 20 décembre, pour tenir compte de l’impact de l’évolution du Taux de change sur le tableau d’amortissement exprimé en euros. Cette modification devra correspondre exactement à l’évolution du Taux de change entre le 1er décembre de l’année précédant la réactualisation et le 1er décembre de l’année de la réactualisation, dans la limite de plus ou moins 10%. Toute réactualisation non demandée par l’Adhérent pour une année donnée ne pourra être prise en compte ultérieurement. Toute modification est subordonnée à l’acceptation préalable de l’Assureur qui se réserve le droit de renouveler les formalités d’adhésion.\n\nL’attention de l’Adhérent est donc attirée sur le fait que le montant des prestations servies par l’Assureur étant exprimé en euros, l’Adhérent pourra être redevable d’une somme complémentaire à l’Organisme prêteur et en assumera alors la charge exclusive.\n\nCas particulier des prêts en francs pacifique\n\nLes prêts libellés en Francs pacifique sont traités selon les mêmes modalités que les prêts en euros, avec les dispositions complémentaires suivantes :\n\nLe montant garanti, les cotisations et les prestations sont exprimés en euros. La conversion est faite au taux fixe de 8,39 € pour 1000 XPF, et ce quel que soit le taux de conversion en vigueur au moment de l’adhésion ou du sinistre.\n\nTERRITORIALITE DES GARANTIES ET OPTIONS\n\nLes garanties s’exercent dans le monde entier.\n\nLa PTIA, l’ITT, l’IPP, l’IPT doivent être médicalement constatées en France continentale, à La Réunion, en Guadeloupe, à la Martinique, en Guyane, à Saint-Martin, à Mayotte, en Corse, à Saint-Barthélemy, en Polynésie française. En cas de Sinistre survenu hors de France (sauf décès), le paiement des prestations et le décompte de la période de Franchise ne pourront pas avoir lieu avant la date à laquelle le Sinistre aura été reconnu par l’Assureur.", "Dans tous les cas, les frais de rapatriement sont à la charge de l’Assuré.\n\nL’Assureur ne sera considéré comme accordant une garantie, et ne sera tenu d’indemniser quelque sinistre que ce soit ou à fournir quelque service que ce soit, si l’offre de cette garantie, l’indemnisation de ce sinistre ou la fourniture de ce service, l’expose à des sanctions, interdictions ou restrictions selon les résolutions des Nations Unis, ou des sanctions commerciales ou économiques, lois ou règlements de l’Union Européenne, ou de la France.\n\nMODALITES D’ADHÉSION\n\n1. Adhésion au Contrat\n\nPour adhérer au Contrat, chaque Assuré doit satisfaire aux Formalités médicales et administratives qui lui sont demandées en fonction de son âge, des montants garantis et de son état de santé.\n\nLes opérations de crédit contractées sont assurables sous réserve de la signature de l’offre de l’opération de crédit au plus tard dans les 6 mois qui suivent la date d’effet de l’adhésion mentionnée au Certificat d’adhésion, et d’un premier déblocage des fonds au plus tard dans les 24 mois qui suivent la signature de l’offre de l’opération de crédit. Si cette condition n’est pas remplie, l’Assuré devra satisfaire à nouveau aux formalités d’adhésion.\n\nLes prêts en cours sont assurables sous réserve d’un déblocage des fonds déjà effectué ou à venir dans les 24 mois qui suivent la signature de l’offre de prêt.\n\nL’Assureur rembourse sur la base des tarifs conventionnés et sur présentation des factures originales, les frais et examens médicaux résultant directement des formalités d’adhésion qu’il a demandées dans les cas suivants :\n\n• si l’adhésion est effective ;\n\n• si l’adhésion est refusée ou ajournée par l’Assureur ;\n\n• si l’adhésion est proposée sous conditions particulières (surprime, exclusions, restriction sur les garanties) matérialisées par l’Assureur sur le « Bon pour Accord » et que celles-ci sont refusées par le Proposant.\n\n2. Proposition de l’Assureur et émission du Certificat d’adhésion\n\nAprès examen des pièces médicales et financières, l’Assureur, s’il accepte de couvrir le risque, propose une cotisation pour couvrir les garanties avec éventuellement des conditions particulières reprise sur le Bon pour Accord.\n\nLa décision favorable de l’assureur est valable 6 mois, 12 mois dans le cadre d’une reprise Bourquin. Elle sera communiquée à l’Adhérent par l’envoi d’une proposition d’assurance et/ou du Certificat d’adhésion.\n\nLe Certificat d’adhésion est émis après signature de la Demande d’adhésion dans ce délai ; et après signature du Bon pour Accord qui reprend les conditions particulières de l’Adhésion. Passé ce délai, la proposition n’est plus valable et de nouvelles formalités d’adhésion doivent être accomplies par le Proposant.\n\n3. Convention sur la preuve\n\nPar dérogation à l’article 1359 du Code civil, il est convenu qu’en cas d’adhésion à distance par téléphone ou par internet, les données sous forme électronique et les enregistrements téléphoniques conservés par l’Assureur ou par ELOÏS vaudront signature de l’Adhérent / l’Assuré, lui seront opposables et pourront être admis comme preuve de son identité et de son consentement relatif tant à l’adhésion au Contrat d’assurance qu’aux dispositions générales telles que prévues dans la Notice dûment acceptées par lui. 4. Accès à l’espace personnel et dématérialisation des échanges avec l’adhérent\n\nAccès à l’espace personnel :\n\nL’espace personnel ci-après « Espace personnel » est un service mis en place, conçu et appartenant au Gestionnaire, aux fins de permettre à l’Adhérent notamment de consulter ses contrats ou adhésions, et de procéder à certaines opérations en ligne, accessible sur internet à partir de l’adresse indiquée dans le mail de 1ère connexion : https://client. magnolia.fr/login si l’Assuré a adhéré sur le site Magnolia, https://client. simulassur.fr/login si l’Assuré a adhéré par un courtier partenaire de ELOÏS.\n\nL’accès à la consultation de l’adhésion ainsi qu’aux actes de gestion disponibles en ligne, sera subordonné à l’activation de l’Espace personnel et à l’acceptation de ses conditions générales d’utilisation.\n\nL’Adhérent reconnaît que l’accès à la consultation et à la gestion en ligne de l’adhésion ne constitue pas une condition essentielle et déterminante de l’adhésion à la Convention.\n\nDématérialisation de certains documents :\n\nEn cochant la case dédiée sur la Demande d’adhésion, l’Adhérent accepte que toutes informations, notifications ou communications disponibles de la part de l’Assureur relatives à son adhésion à la ou les Conventions (notamment relevés d’information annuels, documents contractuels et de gestion) lui soient communiquées, sous un format électronique durable, via son Espace personnel et/ou par courriel dans sa messagerie personnelle à l’adresse électronique qu’il aura indiquée.\n\nLes documents ne lui seront alors plus adressés sous format papier par voie postale.\n\nDès qu’un nouveau document sera disponible sur son Espace personnel, l’Adhérent recevra un courrier électronique l’informant de sa mise à disposition en ligne.\n\nL’Adhérent pourra à tout moment consulter, imprimer et/ou télécharger lesdits documents.\n\nL’Adhérent s’engage à informer sans délai le gestionnaire de toute modification de ses coordonnées électroniques (adresse e-mail et numéro de téléphone mobile) et, plus généralement, de tout changement de sa situation pouvant avoir une quelconque incidence sur le bon acheminement des informations et/ou des documents.\n\nDroit d’opposition et retour au papier :\n\nL’Adhérent peut, à tout moment, par tout moyen à sa convenance, s’opposer à la dématérialisation de ces informations et/ou documents, en demandant au Gestionnaire qu’un support papier soit utilisé et ce, sans frais à sa charge. Cette démarche pourra être effectuée directement depuis l’Espace personnel. A compter de la date de prise en compte de la demande d’opposition, l’Assureur adressera, sans frais, sur support papier, les informations et documents, à venir, relatifs à l’adhésion. Le retour aux échanges sur support papier n’aura d’effet que pour l’avenir.\n\nGARANTIES PROPOSÉES\n\nLes garanties proposées à l’adhésion sont les suivantes :\n\n• Décès, • Perte Totale et Irréversible d’Autonomie (PTIA), • Incapacité Temporaire Totale de travail (ITT), • Invalidité Permanente Partielle de travail (IPP), • Invalidité Permanente Totale de travail (IPT), • Prolongement des garanties incapacité - invalidité • Exonération des cotisations en cas de ITT, IPP, IPT, • DOS, • PSY.", "Les garanties sont définies en référence aux exigences de l’Organisme prêteur et en plein accord avec le ou les emprunteurs/Assurés. Elles sont structurées pour répondre aux besoins de protections individuelles au regard de leur situation familiale et professionnelle et de la Quotité assurée.\n\nSeules les garanties mentionnées au Certificat d’adhésion sont accordées à l’Assuré.\n\nLes Conditions Particulières auxquelles les garanties sont accordées à l’Assuré sont mentionnées au « Bon pour Accord ».\n\nLIMITATION DES GARANTIES ET DES OPTIONS\n\nLimitation des capitaux et garanties :\n\nLe montant total des capitaux assurés est limité à 10 000 000 euros pour un même Assuré, pour l’ensemble des prêts garantis par l’Assureur dans le cadre du Contrat. Ce montant total est limité à 5 000 000 d’euros si l’adhérent réside à La Réunion, Guadeloupe, Martinique, Guyane, Saint-Martin, Mayotte, Corse Saint- Barthélemy, Polynésie française. Le montant total des capitaux assurés est limité à 2 000 000 d’euros pour les prêts in-fine ou prêts relais.\n\nLe montant total de garantie en ITT/IPT est plafonné à 20 000 euros par mois. Ce montant est limité à 5 000 euros par mois si l’adhérent réside à La Réunion, Guadeloupe, Martinique, Guyane, Saint-Martin, Mayotte, Corse Saint- Barthélemy, Polynésie française.\n\nPluralité d’Assurés :\n\nSi plusieurs personnes sont assurées pour un même prêt, l’Assureur limite ses prestations aux sommes qui seraient versées pour une personne assurée avec une Quotité à 100 %.\n\nDÉFINITIONS DES GARANTIES ET DES PRISES EN CHARGE\n\nLa Quotité assurée reposant sur la tête de l’Assuré sera appliquée aux prestations prévues ci-après en fonction des conditions d’admissibilité figurant sur le Certificat d’adhésion.\n\nRappel : le contrat d’assurance étant un contrat par nature aléatoire, tout sinistre (arrêt de travail, état d’invalidité reconnu) en cours lors de l’adhésion au Contrat ne pourra être garanti et ne fera l’objet d’aucune indemnisation.\n\n1. La garantie Décès\n\nDéfinition de la garantie :\n\nDécès de l’Assuré à la suite d’une Maladie ou d’un Accident garanti par le Contrat.\n\nObjet de la garantie :\n\nSelon la Quotité assurée pour l’Assuré au titre de la garantie Décès : En cas de décès de l’Adhérent par suite de Maladie ou d’Accident survenu postérieurement à la date d’effet des garanties et avant son ème anniversaire, la garantie prévoit le versement au(x) Bénéficiaire(s) désigné(s) du capital restant dû au jour du décès, tel qu’il est indiqué sur le tableau d’amortissement remis par l’Organisme prêteur dans la limite du Montant garanti.\n\nCondition de la garantie :\n\nLes éventuelles échéances impayées, pénalités ou intérêts de retard appliqués par l’Organisme prêteur ne sont pas couverts au titre de la garantie Décès. Concernant les prêts achat-revente, l’Assureur ne prend pas en charge dans l’Echéance la part correspondant à un remboursement anticipé de capital, programmé ou non, lié à la revente de l’ancien bien de l’Assuré.\n\nConcernant les prêts avec différé : durant la phase de différé, l’Assureur verse le montant défini ci-dessous, affecté de la Quotité assurée : • prêts avec différé d’amortissement en capital et intérêts : le montant initial du prêt ainsi que les intérêts contractuels courus jusqu’au jour du décès ; • prêts avec différé d’amortissement en capital : le montant initial du prêt ainsi que les intérêts courus entre la dernière échéance qui précède le décès et le jour du décès ;\n\nSi le décès survient le jour d’une échéance, celle-ci est considérée comme postérieure au décès.\n\nFin de la garantie :\n\nLe paiement du capital met fin à l’assurance. La garantie cesse au 86ème anniversaire de l’Assuré\n\n2. La garantie Perte Totale et Irréversible d’Autonomie (PTIA)\n\nDéfinition de la garantie :\n\nInvalidité qui, à la suite d’une Maladie ou d’un Accident, met l’Assuré dans l’incapacité physique ou mentale définitive permanente, médicalement constatée, de se livrer à la moindre occupation, ni au moindre travail lui procurant gain ou profit et le met dans l’obligation définitive d’avoir recours à l’assistance totale et permanente d’une tierce personne pour accomplir tous les Actes de la Vie Quotidienne.\n\nLa reconnaissance de la PTIA par le Médecin conseil de l’Assureur est déterminée par expertise médicale.\n\nL’Assureur n’est pas tenu par les décisions prises en la matière par les régimes obligatoires dont relève l’Assuré ou par tout autre organisme.\n\nObjet de la garantie :\n\nSelon la Quotité assurée pour l’Assuré au titre de la garantie PTIA: La garantie prévoit le versement au(x) Bénéficiaire(s) désigné(s) du capital restant dû tel qu’il est indiqué sur le tableau d’amortissement remis par l’Organisme Prêteur dans la limite du montant garanti.\n\nLes éventuelles échéances impayées, pénalités ou intérêts de retard appliqués par l’Organisme prêteur ne sont pas couverts au titre de la garantie PTIA.\n\nCondition de la garantie :\n\nLa Maladie ou l’Accident garanti à l’origine de l’état de PTIA doit survenir postérieurement à la date d’effet des garanties et la reconnaissance de la PTIA par le Médecin conseil de l’Assureur avant le 71ème anniversaire de l’Assuré.\n\nFin de la garantie :\n\nLe paiement du capital met fin à l’assurance. La garantie cesse au 71ème anniversaire de l’Assuré.\n\n3. Les garanties Incapacité et Invalidité\n\n3.1 La garantie Incapacité Temporaire Totale (ITT)\n\nDéfinition de la garantie :\n\nEtat qui place l’Assuré, suite à une Maladie ou un Accident garanti par le Contrat, dans l’impossibilité temporaire, complète et continue d’exercer sa profession.", "L’Assuré sans activité professionnelle au moment du Sinistre est considéré en ITT s’il se trouve temporairement contraint d’observer sur prescription médicale, un repos complet et continu à son domicile ou en centre hospitalier ou de rééducation, l’obligeant à interrompre ses Actes de la Vie Quotidienne. L’incapacité doit être temporaire, totale, et continue.\n\nL’ITT doit être médicalement reconnue par le médecin conseil de l’Assureur qui peut demander une expertise médicale.\n\nL’Assureur n’est pas tenu par les décisions prises en la matière par les régimes obligatoires dont relève l’Assuré ou par tout autre organisme.\n\nObjet de la garantie :\n\nSelon la Quotité assurée pour l’Assuré au titre de la garantie ITT : La garantie prévoit la prise en charge du versement des mensualités assurées mentionnées au tableau d’amortissement en vigueur au jour du Sinistre, pendant la durée de l’ITT, à l’issue d’une période de Franchise choisie à l’adhésion par l’Adhérent et mentionné sur le Certificat d’adhésion, et dans la limite de 1095 jours.\n\nLes éventuelles échéances impayées, pénalités ou intérêts de retard appliqués par l’Organisme prêteur ne sont pas couverts au titre de la garantie ITT.\n\nCondition de la garantie :\n\nLa prise en charge liée à cet état ne débute qu’à l’issue d’une période de Franchise choisie à l’adhésion par l’Assuré et mentionné sur le Certificat d’adhésion. S’il n’exerce pas de manière effective une activité professionnelle au moment de l’adhésion au Contrat ou s’il réside dans un Département et Région d’Outre-Mer, à Saint-Barthélemy, à Saint-Martin, en Polynésie française ou en Corse, ou s’il est éligible aux conditions de l’article L.113- 2-1 du Code des assurances (adhésion sans Formalités médicales), il a le choix entre une Franchise de 90, 120 ou 180 jours. Pour donner droit aux versements définis ci-dessus, l’incapacité doit faire suite à une Maladie ou un Accident survenu postérieurement à la date d’effet des garanties et entraîner une interruption réelle et complète des activités professionnelles de l’Assuré ou des Actes de la Vie Quotidienne pour l’Assuré n’exerçant pas de manière effective d’activité professionnelle au jour du Sinistre.\n\nDans l’hypothèse où l’Assuré est une caution personne physique, les prestations ne seront versées que sous réserve de l’insolvabilité de l’Emprunteur et le paiement, par l’Assuré, des échéances du prêt.\n\nEn cas de pluralité d’Assurés pour un même prêt, justifiant d’une ITT concomitante, il ne pourra être versée une prestation supérieure à 100% de l’échéance due à l’Organisme prêteur.\n\nTemps partiel thérapeutique :\n\nEn cas de reprise de l’activité professionnelle dans le cadre d’un temps partiel thérapeutique, l’Assureur verse les prestations à hauteur de 50% du montant de l’échéance du prêt, affecté de la Quotité assurée, pendant une durée maximale de 180 jours.\n\nRechute :\n\nToute nouvelle ITT dans les deux (2) mois de la reprise du travail ou des Actes de la Vie Quotidienne sera considérée comme un seul et même Sinistre. Sous réserve que l’incapacité initiale ait été prise en charge par l’organisme assureur et que votre garantie ITT soit toujours en vigueur à la date de la Rechute, le service des prestations sera repris dès le 1er jour de la cessation des activités, sans nouvelle application du délai de Franchise. Toute nouvelle cessation d’activité postérieure à la date de résiliation de votre garantie ITT ne pourra être prise en charge. Fin de la garantie :\n\nLes prestations ITT cesseront d’être versées :\n\n• en cas de reprise totale du travail ; • en cas de reprise partielle du travail ; • en cas de reprise des Actes de la Vie Quotidienne ; • en cas d’expertise médicale, s’il est établi que l’Assuré n’est pas dans l’incapacité totale de travailler ou d’accomplir les Actes de la Vie Quotidienne ; • à la date de la Consolidation de l’état de santé de l’Assuré ; • et/ou pendant la période de congé légal de maternité pour les Assurées ; toutefois, si à l’expiration de ce congé, l’Assurée ne peut pas reprendre son activité du fait de son état pathologique, les garanties du Contrat entreront en vigueur à compter de l’expiration du congé sous réserve qu’avant le début de ce congé, l’Assurée ait été indemnisée pendant au moins 2 (deux) mois au titre de l’Incapacité Temporaire Totale ; • à la date à laquelle l’Assuré fait valoir ses droits à une pension vieillesse (sauf pour des raisons médicales) ; • en cas de mise en retraite anticipée pour raisons médicales, les prestations cesseront d’être versées dès que l’Assuré atteint l’âge légal de départ à la retraite ; • au plus tard à son 67ème anniversaire ou son 70ème selon que l’Adhérent a choisi l’option « prolongement des garanties incapacité-invalidité » ; • au plus tard, 1095 jours après le début de l’Incapacité Temporaire Totale; • en cas de non transmission par l’Assuré des justificatifs nécessaires à la poursuite des prestations ; • en cas de refus de l’Assuré de se soumettre au contrôle diligenté par l’Assureur ; • et dans tous les autres cas de cessation prévus à l’article « Cessation de l’adhésion au Contrat ».\n\n3.2 La garantie Invalidité Permanente Partielle (IPP)\n\nDéfinition de la garantie :\n\nL’Assuré est reconnu en état d’Invalidité Permanente Partielle lorsqu’à la suite d’une Maladie ou d’un Accident survenu postérieurement à la date d’effet des garanties, et après Consolidation de son état de santé, il présente un taux d’invalidité supérieur ou égal à 33% et strictement inférieur à 66%.\n\nL’IPP doit être reconnue par le médecin conseil de l’Assureur qui peut demander une expertise médicale.\n\nL’Assureur n’est pas tenu par les décisions prises en la matière par les régimes obligatoires dont relève l’Assuré ou par tout autre organisme.\n\nObjet de la garantie :\n\nSelon la Quotité assurée pour l’Assuré au titre de la garantie IPP : La garantie prévoit la prise en charge du versement des mensualités assurées mentionnées au tableau d’amortissement en vigueur au jour du Sinistre, à hauteur de 50% du montant dû au titre de la garantie ITT, à l’issue d’une période de Franchise choisie à l’adhésion par l’Adhérent et mentionnée sur le Certificat d’adhésion.\n\nLes éventuelles échéances impayées, pénalités ou intérêts de retard appliqués par l’Organisme prêteur ne sont pas couverts au titre de la garantie Décès.\n\nCondition de la garantie :\n\nCette invalidité est couverte à compter d’un taux d’incapacité supérieur ou égal à 33% et inférieure à 66%, selon le barème croisé d’incapacité fonctionnelle et d’incapacité professionnelle. Pour l’Assuré sans activité professionnelle au moment du Sinistre, l’IPP sera établie sur la base de la seule incapacité fonctionnelle. L’incapacité fonctionnelle est établie par le Médecin expert selon le barème du Concours Médical en vigueur au jour du sinistre.", "L’incapacité professionnelle est évaluée par le Médecin expert par rapport à la profession exercée lors de la Consolidation de l’invalidité.\n\nDans l’hypothèse où l’Assuré est une caution personne physique, les prestations ne seront versées que sous réserve de l’insolvabilité de l’Emprunteur et le paiement, par l’Assuré, des échéances du prêt.\n\nEn cas de pluralité d’Assurés pour un même prêt, justifiant d’une ITT ou d’une IPP ou d’une IPT concomitante, il ne pourra être versée une prestation supérieure à 100% de l’échéance due à l’Organisme prêteur.\n\nFin de la garantie :\n\nLes prestations cesseront d’être versées :\n\n• en cas d’évolution de l’état de santé de l’Assuré, si son taux d’invalidité devient supérieur à 66% ; • à la date à laquelle l’Assuré fait valoir ses droits à une pension vieillesse (sauf pour des raisons médicales) ; • en cas de mise en retraite anticipée pour raisons médicales, les prestations cesseront d’être versées dès que l’Assuré atteint l’âge légal de départ à la retraite déterminé en fonction de sa date de naissance, • au plus tard à son 67ème anniversaire ou son 71ème selon que l’Adhérent a choisi l’option « prolongement des garanties incapacité-invalidité » ; • en cas de non transmission par l’Assuré des justificatifs nécessaires à la poursuite des prestations ; • en cas de refus de l’Assuré de se soumettre au contrôle diligenté par l’Assureur ; • et dans tous les autres cas de cessation prévus à l’article « Fin de garanties ».\n\nToute modification à la hausse du plan d’amortissement du prêt pendant une période d’IPP ne peut être prise en compte.\n\n3.3 La garantie Invalidité Permanente Totale (IPT)\n\nDéfinition de la garantie :\n\nL’Assuré est reconnu en état d’Invalidité Permanente Partielle lorsqu’à la suite d’une Maladie ou d’un Accident survenu postérieurement à la date d’effet des garanties, et après Consolidation de son état de santé, il présente un taux d’invalidité supérieur à 66%.\n\nL’IPP doit être reconnue par le Médecin conseil de l’Assureur qui peut demander une expertise médicale.\n\nL’Assureur n’est pas tenu par les décisions prises en la matière par les régimes obligatoires dont relève l’Assuré ou par tout autre organisme.\n\nObjet de la garantie :\n\nSelon la Quotité assurée pour l’Assuré au titre de la garantie IPT : La garantie prévoit la prise en charge du versement des mensualités assurées mentionnées au tableau d’amortissement en vigueur au jour du Sinistre, à hauteur de 100% du montant dû au titre de la garantie ITT, à l’issue d’une période de Franchise choisie à l’adhésion par l’Adhérent et mentionnée sur le Certificat d’adhésion.\n\nCondition de la garantie :\n\nCette invalidité est couverte à compter d’un taux d’incapacité supérieur ou égal à 66%, selon le barème croisé fonctionnel et professionnel.\n\nPour l’Assuré sans activité professionnelle au moment du Sinistre, l’IPT sera établie sur la seule incapacité fonctionnelle.\n\nL’incapacité fonctionnelle est établie par le Médecin expert selon le barème du Concours Médical en vigueur au jour du sinistre. L’incapacité professionnelle est évaluée par le Médecin expert. Par rapport à la profession exercée lors de la Consolidation de l’invalidité.\n\nDans l’hypothèse où l’Assuré est une caution personne physique, les prestations ne seront versées que sous réserve de l’insolvabilité de l’Emprunteur et le paiement, par l’Assuré, des échéances du prêt.\n\nEn cas de pluralité d’Assurés pour un même prêt, justifiant d’une ITT ou d’une IPP ou d’une IPT concomitante, il ne pourra être versée une presta
