at. La date d’effet de cette garantie est la date de signature du bulletin d’adhésion. La garantie prend fin au jour de notification par la Mutuelle de refuser ou d’accepter le risque et au plus tard 60 jours après la date d’effet de cette garantie. Le bénéficiaire de cette prestation est le conjoint de l’assuré, à défaut les enfants de l’assuré, nés ou à naître, vivants ou représentés par parts égales, à défaut ses héritiers légaux, sauf désignation contraire de sa part ; si l’assuré est dirigeant d’une entreprise adhérente, le bénéficiaire en cas de décès est l’entreprise elle-même. Durée de l’adhésion et des garanties La durée de l’adhésion est celle prévue aux conditions particulières, mais ne peut dépasser 35 ans pour les prêts amortissables et 30 ans pour tous les autres types de prêts (y compris prolongation maximum de 5 ans pour les prêts modulables et différés d’amortissement d’une durée maximum égale à celle prévue par la règlementation en vigueur pour les prêts à taux zéro). En tout état de cause, la durée de l’adhésion ne peut excéder la durée du prêt assuré ou du prêt contracté simultanément à l’adhésion au contrat (dans le cas d’une adhésion au seul module Prévoyance Crédit). Les garanties peuvent, en cours de vie de l’assurance, être modifiées à la demande de l’adhérent (augmentation ou adjonction de garanties, diminution ou suppression de garanties) ; toute diminution ou suppression de garantie souscrites au titre du module « Couverture de prêt » nécessite l’accord écrit de l’organisme financier prêteur. En cas de résiliation du contrat collectif, les garanties se poursuivent en l’état jusqu’à leur terme. Toute modification de la définition des risques garantis ou des modalités de mise en jeu de l’assurance nécessite l’acceptation de l’assuré. Cessation de l’adhésion L’adhésion au contrat cesse : − en cas de survenance de toute cause d’exigibilité immédiate des sommes restant dues au prêteur prévue aux conditions générales du contrat de prêt, l’assuré ne faisant alors plus partie du groupe assuré ; − à la date d’expiration normale ou anticipée des engagements de l’assuré emprunteur vis-à-vis de l’organisme financier ; lorsque la cessation des garanties intervient suite au rachat du crédit ou en cas de renégociation, que ce soit auprès de l’organisme financier prêteur d’origine ou bien d’un autre établissement, l’assuré dispose de la faculté de solliciter auprès de la Mutuelle la mise en place d’une nouvelle assurance sans qu’aucune formalité médicale ne lui soit demandée. La mise en œuvre de cette faculté nécessite : • que le nouveau capital à assurer ne soit pas supérieur au capital assuré restant dû au titre du précédent contrat d’assurance, • que la demande d’assurance soit formulée dans le délai maximum de 6 mois suivant le rachat de crédit ou sa renégociation. − pour les adhésions au seul module « Prévoyance Crédit », en cas de cessation du contrat d’assurance couvrant le prêt contracté simultanément à l’adhésion au Contrat;» − en cas de résiliation de l’adhésion par l’adhérent : • la résiliation de l’adhésion par l’adhérent peut être demandée à tout moment, selon les modalités ci-dessous : − soit par lettre ou tout autre support durable ; − soit par déclaration faite au siège social de la Mutuelle ou chez son représentant ; − soit par acte extrajudiciaire ; − soit dans le cadre de la conclusion du contrat par un mode de communication à distance, par le même mode de communication. La Mutuelle confirme à l’adhérent, par écrit, la notification de la résiliation, sous réserve, sauf pour les adhésions au seul module Prévoyance Crédit, de l’accord de l’organisme financier prêteur. L’adhérent notifie selon ces mêmes modalités à la mutuelle la décision de l’organisme financier prêteur d’acceptation ou de refus d’un autre contrat d’assurance en substitution de l’actuel contrat ainsi que la date d’effet du nouveau contrat substitué en cas d’acceptation. La résiliation du contrat d’assurance prend effet dix jours après la réception par la mutuelle de la décision de l’organisme financier prêteur ou à la date de prise d’effet du contrat accepté en substitution par ce dernier si celle-ci est postérieure. En cas de refus par le prêteur, le contrat d’assurance n’est pas résilié. NB : dans tous les cas, la résiliation demandée par l’adhérent est effective sous réserve du consentement écrit de l’organisme financier ayant consenti le prêt ; en cas de résiliation à l’initiative de la mutuelle celle-ci s’engage à informer par courrier l’organisme financier prêteur réputé bénéficiaire acceptant. La mutuelle informera annuellement l’adhérent de son droit à résiliation , des modalités d’exercice de ce droit, ainsi que des délais de notification à respecter, ce sur support papier ou tout autre support durable. − en cas de décès ou au jour de la reconnaissance de l’état de PTIA de l’Assuré, − en cas de non-paiement des cotisations, − au 90ème anniversaire de l’Assuré. Cessation des garanties Les garanties prennent fin en même temps que l’adhésion au contrat cesse. Pour chaque Assuré, la garantie prend fin : − au 1er janvier de l’année de son 90ème anniversaire de l’assuré pour la garantie «Décès», − au 1er janvier de l’année de son 70ème anniversaire de l’assuré pour la garantie «Perte Totale et Irréversible d’Autonomie», − au jour du départ en retraite ou préretraite et au plus tard jusqu’au 1er janvier de l’année de son 70ème anniversaire pour les garanties « Incapacité Temporaire Totale de travail », « Invalidité Permanente Totale ou Partielle » et « Exonération ».\n\nARTICLE 4 – RISQUES GARANTIS Le contrat s’articule en plusieurs modules de garanties : Un premier module en Couverture de Prêt ainsi qu’un second module en Prévoyance Crédit. Cette dernière garantie ne peut être souscrite qu’au titre d’adhésions ayant donné lieu à la réalisation de formalités médicales, et à condition qu’un prêt soit effectivement contracté simultanément à la signature du bulletin d’adhésion au contrat. La Garantie « Prévoyance Crédit » peut alors être souscrite", "en complément du module de garantie « Couverture de Prêt » ou seule dès lors que le prêt est assuré auprès d’un autre organisme, notamment auprès du contrat groupe de la banque. Dans chaque module les garanties « Incapacité Temporaire Totale de Travail/Invalidité Permanente Totale ou Partielle/Exonération » ne peuvent être souscrites qu’en complément des garanties « Décès/PTIA ».\n\nGARANTIES DÉCÈS ET PTIA : L’assuré est couvert au titre de ces garanties pour toute la durée du prêt dès lors que son âge en fin de prêt n’excède pas son 90ème\n\nanniversaire pour la garantie Décès et son 70ème anniversaire pour la garantie Perte Totale et Irréversible d’Autonomie. La mutuelle, selon les modalités prévues aux conditions particulières et les garanties « Couverture de Prêt » et/ou « Prévoyance Crédit » souscrites, verse à l’organisme financier prêteur désigné comme tel aux conditions particulières (pour la garantie « Couverture de Prêt ») ou le bénéficiaire désigné par l’assuré aux conditions particulières (pour la garantie décès du module de garanties « Prévoyance Crédit ») ou l’assuré (pour la garantie PTIA du module de garanties « Prévoyance Crédit »), un capital tel que défini ci- dessous : • dans le cas d’un prêt amortissable (y compris prêts modulables) sans différé d’amortissement de capital et d’intérêts : la quotité assurée du montant du capital restant dû au jour du décès ou de la reconnaissance par la mutuelle de l’état de PTIA, • dans le cas d’un prêt amortissable avec différé d’amortissement de capital et d’intérêts : pendant la période de différé, la quotité assurée de la somme totale restant due (capital majoré des intérêts de différé) au jour du décès ou de la reconnaissance par la mutuelle de l’état de PTIA, • dans le cas d’un prêt relais ou d’un prêt in fine : la quotité assurée du capital mentionné aux conditions particulières. Dans tous les cas, les mensualités du prêt restées impayées au jour du décès ou de la reconnaissance de l’état de PTIA ne seront pas prises en charge par la Mutuelle. En cas de versement du capital en cas de décès à un bénéficiaire personne physique désigné comme tel à titre gratuit (garantie « Prévoyance Crédit »), le capital produit intérêt de plein droit, net de frais et pour chaque année civile, dès la date de décès de l’assuré et jusqu’à réception par la Mutuelle de l’ensemble des pièces justificatives nécessaires au règlement, ou au plus tard jusqu’à la date de versement des sommes non réglées à la Caisse des Dépôts et Consignations, à un taux égal au moins élevé des deux taux suivants : − la moyenne sur les douze derniers mois du taux moyen des emprunts de l’Etat français, disponible au 1er novembre de l’année précédente, − le dernier taux moyen des emprunts de l’Etat français, disponible au 1er novembre de l’année précédente. La somme totale versée au titre des garanties décès et PTIA ne peut être supérieure au montant du capital restant dû au jour du décès ou de la reconnaissance par la Mutuelle de l’état de PTIA, y compris si l’adhérent a souscrit les deux modules de garanties Couverture de Prêt et Prévoyance Crédit.\n\nGARANTIES INCAPACITÉ TEMPORAIRE TOTALE DE TRAVAIL (ITT) – INVALIDITÉ PERMANENTE TOTALE (IPT) OU PARTIELLE (IPP) : Incapacité Temporaire Totale de travail En cas d’Incapacité Temporaire Totale de travail de l’assuré consécutive à une maladie ou un accident, la Mutuelle lui verse une prestation correspondant au montant des échéances du prêt garanties telles que définies ci-dessous, à l’expiration d’un délai de franchise choisi par l’adhérent lors de l’adhésion, tel qu’indiqué aux conditions particulières. L’assuré inactif au jour du sinistre bénéficie d’une prise en charge identique à celle de l’assuré exerçant alors une activité professionnelle. L’assuré est couvert au titre de ces garanties jusqu’au jour du départ en retraite ou préretraite et au plus tard à son 70ème\n\nanniversaire. Les options de franchise proposées à l’adhérent sont les suivantes : 30 / 60 / 90 / 120 / 180 jours continus d’arrêt de travail. Les franchises de 30 et 60 jours ne peuvent pas être souscrites par les résidents des DROM. Temps partiel thérapeutique : pour l’assuré exerçant une activité professionnelle au jour du sinistre, en cas de reprise partielle du travail dans le cadre d’un temps partiel thérapeutique prescrit par son médecin traitant, et sauf si l’assuré peut bénéficier d’une prise en charge au titre de l’IPP, la Mutuelle poursuivra la prise en charge des mensualités à hauteur de 50% de la quotité garantie, pendant toute la durée du temps partiel thérapeutique, dans la limite de 6 mois, sous réserve de production par l’assuré des justificatifs correspondants. Si une expertise médicale diligentée par la Mutuelle détermine que l’incapacité n’est plus totale (hors cas de la reprise à temps partiel thérapeutique médicalement prescrite) ou n’est pas justifiée, la prise en charge est interrompue. Rechute : en cas de rechute de l’assuré dans un délai maximum de 60 jours suivant la reprise d’activité, sous réserve que la preuve soit apportée que le nouvel arrêt de travail résulte des mêmes causes que le précédent arrêt ayant donné lieu au versement des prestations, la Mutuelle prend en charge le montant des échéances postérieures à la date du nouvel arrêt de travail, sans imposer un nouveau délai de franchise. Ces mêmes dispositions sont applicables à l’assuré sans activité professionnelle et auquel un nouveau repos total a été prescrit du fait de son état de santé. À l’issue des limites d’indemnisation de la garantie « Incapacité Temporaire Totale de travail » prévues au contrat, le maintien de la prise en charge est examiné au titre de la garantie « Invalidité Permanente Totale ou Partielle ». Invalidité Permanente Totale ou Partielle : Lors de l’adhésion, l’adhérent a le choix entre 2 options de garanties : • l’invalidité permanente totale uniquement (>66%, taux en orange foncé dans le tableau) • l’invalidité permanente totale (>66%) ou partielle (comprise entre 33% et 66%, taux en orange clair dans le tableau). Des taux d’invalidité inférieurs à 33% (en blanc dans le tableau) ne peuvent donner lieu à aucune prise en charge au titre de la garantie Invalidité Permanente Totale ou Partielle. L’assuré est couvert au titre de ces garanties jusqu’au jour du départ en retraite ou préretraite et au plus tard à son 70ème\n\nanniversaire. En cas d’Invalidité Permanente Totale ou Partielle de l’assuré, en fonction de l’option choisie à l’adhésion et indiquée aux conditions particulières, la Mutuelle verse à l’assuré, tout ou partie des échéances du prêt garanties dès la date de consolidation de l’état de santé, ce en fonction du taux d’invalidité défini au vu du tableau ci-dessous. Il est également possible pour l’assuré, au moment de la survenance du sinistre au titre d’une Invalidité Permanente Totale, d’opter pour le versement de la quotité assurée du montant du capital restant dû en lieu et place de la prise en charge des échéances de prêt garanties, sous réserve de l’accord du Service Médical de la Mutuelle. La franchise s’applique si l’invalidité n’est pas consécutive à une incapacité temporaire totale de travail déjà indemnisée au titre du contrat. Le taux d’Invalidité Permanente Totale ou Partielle est à la fois fonction du taux d’incapacité fonctionnelle et du taux d’incapacité professionnelle de l’assuré. Le taux d’incapacité fonctionnelle est établi de 0% à 100%. Il est apprécié en dehors de toute considération professionnelle et basé uniquement sur la diminution de la capacité physique ou mentale, consécutive à l’accident ou la maladie. Il est fixé par expertise et par référence au barème indicatif des déficits fonctionnels séquellaires en droit commun édité par la revue « Le Concours Médical ».", "Le taux d’incapacité professionnelle est établi de 0% à 100%. Il est fixé par expertise. Il est apprécié en fonction du degré et de la nature de l’incapacité fonctionnelle par rapport à la profession exercée. Le taux d’Invalidité Permanente Totale ou Partielle est par conséquent déterminé en fonction des deux taux définis ci-dessus d’après le tableau ci-après :\n\nTaux d’incap. Prof. (%) Taux d’incapacité Fonctionnelle (%) 10 à 20 à 30 à 40 à 50 à 60 à 70 à 80 à 90 à 100\n\n10 à 19 10 16 21 25 29 33 37 40 43 46 20 à 29 13 20 26 32 37 42 46 50 55 58 30 à 39 14 23 30 36 42 48 53 58 62 67 40 à 49 16 25 33 40 46 52 58 63 69 74 50 à 59 17 27 36 43 50 56 63 68 74 79 60 à 69 18 29 38 46 53 60 66 73 79 84 70 à 79 19 30 40 48 56 63 70 77 83 89 80 à 89 20 32 42 50 58 66 73 80 87 93 90 à 99 21 33 43 52 61 69 76 83 90 97 100 22 34 45 54 63 71 79 86 93 100 Si le taux d’invalidité « N », déterminé à partir des taux d’incapacité fonctionnelle et professionnelle tels que définis ci-dessus, est : • supérieur à 66% : l’assuré est considéré en Invalidité Permanente Totale. Les mensualités du prêt sont prises en charge en totalité, ce en fonction de la quotité assurée, • compris entre 33% et 66% : l’assuré est considéré en Invalidité Permanente Partielle. La prise en charge par la Mutuelle des mensualités du prêt est calculée par application de la formule suivante : [(N- 33%) /33] x montant de l’échéance de prêt x quotité assurée. Si le résultat obtenu après application de la formule est inférieur à 50, la Mutuelle prendra néanmoins en charge les mensualités de prêt en fonction de la quotité assurée à hauteur de 50%. La Mutuelle aura la possibilité de réviser ce taux, après un nouvel examen médical, en augmentation ou en diminution, selon l’évolution de l’invalidité de l’assuré. L’appréciation faite par la Mutuelle de l’état d’invalidité de l’adhérent, et les modalités de fixation des taux telles que décrites ci-dessus, sont indépendantes de celles retenues par la Sécurité sociale ou tout autre organisme. Les décisions de la Sécurité sociale ou de tout autre organisme ne s’imposent pas à la Mutuelle. Un assuré ne peut être considéré en Invalidité Permanente Totale s’il continue d’exercer une activité professionnelle. Échéances du prêt garanties en cas d’Incapacité Temporaire Totale de travail ou d’Invalidité Permanente Totale ou Partielle : Les prestations garanties sont forfaitaires et sont servies sans référence aucune à la perte de revenus subie par l’assuré. Toutefois, dès lors que le prêt objet de l’assurance serait assuré auprès de la Mutuelle à hauteur d’une quotité de 100% par un emprunteur et un co-emprunteur, le versement de la Mutuelle en cas d’arrêt de travail simultané de ces derniers ne saurait excéder le montant de la mensualité de prêt dû à l’organisme financier prêteur. La somme totale versée au titre des garanties Incapacité Temporaire Totale de travail ou Invalidité Permanente Totale ou Partielle ne peut être supérieure au montant de la mensualité de prêt dû à l’organisme financier prêteur, y compris si l’adhérent a souscrit les deux modules de garanties Couverture de Prêt et Prévoyance Crédit. La Mutuelle prend en charge les échéances du prêt au prorata du nombre exact de jours d’arrêt de travail (ou éventuellement du nombre de jours de repos complet médicalement prescrit pour l’assuré n’exerçant pas d’activité professionnelle au jour du sinistre) justifiés et décomptés depuis la fin du délai de franchise, dans les conditions suivantes : • pendant la période d’amortissement (y compris prêts modulables) : le montant des échéances prévues au tableau d’amortissement du prêt, selon la quotité assurée, • pendant la période de différé d’amortissement : les intérêts correspondant à la capitalisation de la somme prêtée, selon la quotité assurée, • pour les prêts relais et in fine : la prise en charge ne porte que sur la fraction d’intérêts échus. Ne sont pas couvertes les dernières échéances qui constituent le remboursement du capital. En cas de remboursements trimestriels, semestriels ou annuels du prêt, les versements prévus dans l’acte de prêt sont censés se décomposer en paiements mensuels égaux et échelonnés.\n\nGARANTIE EXONÉRATION DU PAIEMENT DES COTISATIONS EN CAS D’INCAPACITÉ TEMPORAIRE TOTALE DE TRAVAIL OU D’INVALIDITÉ PERMANENTE TOTALE : L’adhérent ayant choisi cette option de garantie, mentionnée aux conditions particulières, se voit rembourser les cotisations réglées au titre du contrat en cas d’Incapacité Temporaire Totale de travail ou d’Invalidité Permanente Totale, ce dans les conditions ci-après. En cas d’Incapacité Temporaire Totale de travail ou d’Invalidité Permanente Totale de l’assuré, l’adhérent bénéficie du remboursement des cotisations réglées au titre de l’ensemble des garanties souscrites, ce pour toute la période d’arrêt de travail donnant lieu à prise en charge, déduction faite du délai de franchise applicable au titre des garanties Incapacité Temporaire Totale de travail / Invalidité Permanente Totale. L’exonération prend fin dans les mêmes conditions que celles prévues pour les garanties « Incapacité Temporaire Totale de travail / Invalidité Permanente Totale ». Les garanties « Incapacité Temporaire Totale de Travail/Invalidité Permanente Totale ou Partielle / Exonération » ne peuvent être souscrites qu’en complément des garanties « Décès / PTIA ». La présente garantie ne couvre pas l’incapacité temporaire partielle. Un assuré couvert exclusivement au titre des garanties « Décès / PTIA » ne peut prétendre à cette garantie. Un assuré dont la demande d’adhésion ne donne pas lieu à la réalisation de formalités médicales, ne peut être couvert au titre de la garantie Exonération.\n\nGARANTIE INVALIDITÉ AERAS : Cette garantie est subsidiaire à la garantie Invalidité Permanente Totale ou Partielle du présent contrat. La Mutuelle s’engage à étudier la possibilité de proposer à l’assuré la garantie Invalidité AERAS dans les cas suivants : − la garantie Invalidité Permanente Totale ou Partielle demandée à l’adhésion, n’a pu être accordée à l’assuré, − la garantie Invalidité Permanente Totale ou Partielle a été accordée avec exclusion(s) de pathologie(s) ; dans ce cas la Mutuelle s’engage à étudier la possible couverture de l’assuré au titre de la garantie Invalidité AERAS s’agissant des pathologies exclues de la garantie Invalidité Permanente Totale ou Partielle. La garantie Invalidité AERAS, si elle est accordée, ne peut comporter aucune exclusion des pathologies éventuellement présentées par l’assuré au moment de son adhésion. Cette garantie intervient lorsque, par suite d’accident ou de maladie, le taux d’incapacité fonctionnelle de l’assuré est d’au moins 70% et qu’une incapacité professionnelle a pu être constatée. Le bénéficiaire de cette garantie est l’assuré. En cas d’Invalidité AERAS, consécutive à une maladie ou à un accident, la Mutuelle verse à l’assuré les échéances du prêt garanti telles que définies ci-dessous, dès la date de consolidation de l’état d’invalidité et dans la limite de la perte de revenus subie (cf. définition ci-après). Échéances de prêt prises en charge La Mutuelle prend en charge les échéances du prêt garanti tant que l’invalidité est justifiée dans les conditions suivantes :", "− pendant la période d’amortissement (y compris prêts modulables) : le montant des échéances prévues au tableau d’amortissement du prêt, selon la quotité assurée, − pendant la période de différé d’amortissement : les intérêts correspondant à la capitalisation de la somme prêtée, selon la quotité assurée, − pour les prêts relais et in fine : la prise en charge ne porte que sur la fraction d’intérêt échu. Ne sont pas couvertes les dernières échéances qui constituent le remboursement du capital. En cas de remboursements trimestriels, semestriels ou annuels du prêt, les versements prévus dans l’acte de prêt sont censés se décomposer en paiements mensuels égaux et échelonnés. Perte de revenus subie La perte de revenus subie est égale à la différence entre le revenu de référence et les revenus perçus au cours de la période d’invalidité indemnisée. Le revenu de référence est égal à la moyenne mensuelle des salaires nets perçus au cours des 12 mois précédant l’incapacité de travail ayant donné lieu par la suite à l’invalidité, rapportée à la période indemnisée. Le revenu de référence est revalorisé à l’issue d’une période de 12 mois d’invalidité ; il est ensuite actualisé annuellement, au 1er juillet de chaque année, selon la formule d’indexation suivante : R x I N I N-1 R = revenu de référence I (N) = indice d’évolution des salaires pour l’ensemble des salariés du secteur privé publié par l’INSEE au 1er janvier de l’année en cours. I (N – 1) = indice d’évolution des salaires pour l’ensemble des salariés du secteur privé publié par l’INSEE au 1er janvier de l’année précédente. Le revenu perçu au cours de la période d’invalidité indemnisée est le total : - de vos rémunérations et indemnités imposables versées par votre employeur, - des prestations versées par votre Régime Obligatoire, - des prestations versées par les organismes de prévoyance complémentaire. La pension due au titre de l’Invalidité AERAS est versée mensuellement à l’assuré dès la date de consolidation de l’état de santé de l’assuré. La franchise prévue au contrat s’applique si l’invalidité n’est pas consécutive à une incapacité temporaire totale de travail déjà indemnisée par la Mutuelle. L’Invalidité AERAS est à la fois fonction du taux d’incapacité fonctionnelle de l’assuré et de son taux d’incapacité professionnelle. Le taux d’incapacité fonctionnelle à partir duquel une prise en charge peut être accordée est d’au minimum 70%. Il est apprécié en dehors de toute considération professionnelle et il est basé uniquement sur la diminution de la capacité physique ou mentale, consécutive à l’accident ou la maladie. Il est fixé par expertise médicale diligentée par la Mutuelle et par référence au barème annexé au Code des pensions civiles et militaires. En cas de poly-pathologies, ce taux est obtenu par sommation des taux attribués au titre de chacune des pathologies constatées. La Mutuelle aura la possibilité de réviser ce taux, après expertise médicale, en augmentation ou en diminution, selon l’évolution de l’invalidité de l’assuré. L’assuré en désaccord avec le taux d’incapacité fonctionnelle qui aura été fixé, a la possibilité de faire procéder à ses frais à une contre-expertise tel que prévue à l’article 8 du présent contrat « Litiges et arbitrages ». L’incapacité professionnelle est établie dès lors que l’assuré, sur présentation des justificatifs établis par son Régime Obligatoire, apparaît dans l’impossibilité totale de poursuivre l’activité professionnelle qui était la sienne antérieurement à la maladie ou à l’accident. Les pièces justificatives de l’incapacité professionnelle sont mentionnées à l’article 7 « que faire en cas de sinistre ? ». L’assuré exerçant une activité professionnelle ne peut percevoir une quelconque indemnisation au titre de l’Invalidité AERAS.\n\nÉQUIVALENCE DES GARANTIES Afin de faciliter l’acceptation du contrat par l’établissement prêteur qui exige, dans le respect de la réglementation en vigueur, l’équivalence des garanties par rapport à son propre contrat ou au contrat substitué, la Mutuelle s’engage à étudier la couverture du candidat à l’assurance en vue de lui faire bénéficier des conditions les plus favorables entre celles prévues à la présente notice et celles prévues à la notice d’information : • du contrat en vigueur au jour précédant le changement d’assurance dès lors que le candidat à l’assurance aurait été préalablement assuré, • du contrat figurant à l’offre de prêt du candidat à l’assurance dès lors qu’il disposerait d’une telle offre non encore signée, • du contrat standard distribué par l’établissement prêteur du candidat à l’assurance alors qu’il ne disposerait pas encore d’une offre de prêt de sa part. L’étude réalisée sera faite dans la limite des garanties, quotités et franchises, mentionnées aux conditions particulières (pour des adhésions déjà en cours) ou requises concomitamment à la mise en place de l’offre de prêt (pour des adhésions non encore souscrites). La mise en œuvre de l’équivalence des garanties telle que présentée ci-avant est soumise à la communication par le candidat à l’assurance, à l’attention de la Mutuelle, du contrat en cours (notice d’information et conditions particulières) au jour de la demande d’adhésion. L’équivalence des garanties ne peut jouer s’agissant de prêts en cours ou quotités de ces prêts non assurés au jour de la demande d’adhésion. Par ailleurs, l’équivalence de garanties ne peut concerner des prêts souscrits auprès d’organismes financiers prêteurs qui ne seraient pas inscrits au registre Banque de France, tels prêts des collectivités locales, prêt patronal…\n\nARTICLE 5 – TERRITORIALITÉ DES GARANTIES L’assurance est valable dans le monde entier sous réserve des exclusions éventuelles indiquées aux conditions particulières, et ce quelle que soit la nature du déplacement (personnel, professionnel, humanitaire).\n\nARTICLE 6 – CE QUE NE COUVRE PAS LE CONTRAT EXCLUSIONS COMMUNES À TOUTES LES GARANTIES Exclusions non rachetables L’ensemble des affections et évènements ci-après, leurs suites, conséquences et leurs récidives sont exclus : • le suicide ou la tentative de suicide, conscient ou inconscient de l’assuré dans la première année de l’adhésion ; toutefois le risque de suicide sera couvert à compter de la date d’effet de l’adhésion dans la limite de 120 000 Euros maximum (montant fixé par décret) pour les prêts destinés à l’acquisition de la résidence principale ; • les conséquences de guerre, civile ou étrangère, déclarée ou non, quel que soit le lieu où se déroulent ces évènements et les protagonistes ; • la participation de l’assuré à tout duel, délit, acte criminel ou rixe, acte de terrorisme ou de sabotage, émeute ou mouvement populaire ;", "• les effets directs et indirects d’explosions, de dégagements de chaleur, d’irradiations, les souffles provenant des combustibles nucléaires, des produits ou déchets radioactifs, des armes ou engins destinés à exploser par modification de la structure du noyau de l’atome, des transmutations des noyaux d’atome, sauf si ces effets proviennent : − d’un fonctionnement défectueux d’instruments de radiologie ; ou − d’une fausse manœuvre ou d’une erreur de la part du médecin, lors du traitement ou de l’examen de l’assuré en qualité de patient. • les conséquences de maladie ou d’accident relevant du fait intentionnel de l’assuré ou du bénéficiaire ; • la manipulation par l’assuré ou d’un tiers, d’armes, d’explosifs et de tout autre produit dangereux dont la détention et l’utilisation sont interdites par la législation française ; • les vols sur appareils non munis d’un certificat de navigabilité, ou pour lesquels le pilote ne possède pas un brevet ou une licence valide ; • les actes consécutifs à l’ivresse et au délire alcoolique de l’assuré lorsque le taux d’alcoolémie est supérieur au taux légal en vigueur, si l’assuré est reconnu responsable de l’accident, • l’alcoolisme chronique médicalement constaté et traité, ses suites, conséquences et récidives, • l’usage de stupéfiants, drogues ; Les sinistres occasionnés au cours de l’exercice des sports ou activités sportives suivants, leurs suites et conséquences : • sports de neige hors-piste ; • base jump ; • sky surfing ; • sky flying ; • saut à l’élastique ; • zorbing ; • VTT de descente (dans le cadre ou en dehors de toute compétition) ; • exercices acrobatiques ; • toute activité sportive comprenant des acrobaties ; • les états d’invalidité préexistants à l’adhésion et ayant donné lieu à reconnaissance par le régime obligatoire de l’assuré, leurs suites et conséquences, sauf à ce que ces états d’invalidité aient été déclarés à l’adhésion et aient fait l’objet d’une acceptation aux conditions normales de tarification ou aient été acceptés avec majoration de cotisations ; • les handicaps préexistants à l’adhésion et ayant donné lieu à l’attribution de l’allocation aux adultes handicapés, leurs suites et conséquences, sauf à ce que ces handicaps aient été déclarés à l’adhésion et aient fait l’objet d’une acceptation aux conditions normales de tarification ou aient été acceptés avec majoration de cotisations. Exclusions rachetables La pratique à titre amateur des sports ou activités sportives suivants non pratiqués ou non déclarés par l’assuré au jour de l’adhésion : • tout sport de combat ; • tout sport nécessitant l’usage d’engins à moteur (terre, mer au- delà de 6 milles des côtes et air) ; • toute activité, sportive ou de loisir, de voltige ; • activité du cirque ; • activité souterraine ; • activité aérienne, fluviale (rafting, canyoning, hydrospeed) ; • activité sportive maritime au-delà de six milles des côtes (en- deçà de six milles des côtes l’assuré est garanti sous réserve d’être en conformité avec la réglementation française en vigueur) ; • activité sportive subaquatique au-delà de 40 mètres de profondeur (en deçà de 40 mètres de profondeur, l’assuré est garanti sous réserve de justifier d’un équipement technique ainsi que d’un diplôme ad hoc requis pour cette discipline) ; • tout sport et activité de montagne au-delà de 2500 mètres d’altitude excepté le ski et le surf des neiges pratiqués sur piste balisée, à l’exception des sports ou activités sportives listés ci- avant au titre des exclusions non rachetables. Le rachat d’exclusion permet à l’assuré souhaitant être garanti pour ces sports et activités sportives d’en faire la demande à la Mutuelle lors de l’adhésion ou en cours de vie de celle-ci ; pour être garantis, ces sports et activités sportives devront avoir été préalablement déclarés et acceptés par la Mutuelle et faire l’objet d’une mention particulière aux conditions particulières. Le rachat d’exclusion pour ces sports et activités sportives n’est pas autorisé pour les assurés qui résident dans les DROM. Par ailleurs, et ce en dehors de toute demande de l’assuré aux fins d’être garanti pour ces sports et activités sportives, ceux-ci sont automatiquement garantis dès lors qu’ils sont pratiqués à titre amateur et de façon exceptionnelle (baptême ou initiation) dans un pays de l’Union Européenne ou dans l’un des pays suivants : Suisse, Amérique du Nord, Japon, Nouvelle-Zélande, Australie.\n\nEXCLUSIONS PROPRES AUX GARANTIES INCAPACITÉ TEMPORAIRE TOTALE ET INVALIDITÉ PERMANENTE TOTALE OU PARTIELLE Exclusions non rachetables • l’usage de produits médicamenteux ou tranquillisants non prescrits ou à dose non prescrite par une autorité médicale, ou obtenus frauduleusement ; • les interventions ou traitements esthétiques et plastiques autres que la chirurgie reconstructrice consécutive à une maladie ou un accident garanti au contrat ; • les congés légaux de maternité et paternité dans les conditions prévues au Code de la Sécurité sociale pour les salariés, que l’assuré soit salarié ou non ; • les séjours, hospitalisations, interventions et cures lorsqu’ils ne sont pas en relation directe avec le traitement d’une maladie ou d’un accident couvert par le contrat. Exclusions rachetables Les sinistres survenant à l’occasion de la pratique des professions et activités suivantes, leurs suites et conséquences : • sportif professionnel ; • guide de haute montagne ; • moniteur de ski ; • surveillance armée / maintien de l’ordre ; • personne travaillant sur une plateforme pétrolière ; • artiste de cinéma ou de télévision ; • travaux forestiers. Le rachat d’exclusion permet à l’assuré souhaitant être garanti pour ces professions et activités d’en faire la demande à la Mutuelle lors de l’adhésion ou en cours de vie de celle-ci ; pour être garanties, ces professions et activités devront avoir été préalablement déclarées et acceptées par la Mutuelle et faire l’objet d’une mention particulière aux conditions particulières. Le rachat d’exclusion pour ces professions et activités n’est pas autorisé pour les assurés qui résident dans les DROM. Les affections « dorsales » et « psychiatriques » : • les atteintes discales de type hernie, protusion et pincement; cervicalgie, dorsalgie, lombalgie, sciatalgie, cruralgie, discopathie, scoliose, cyphose et lordose, canal lombaire étroit, sciatique, les atteintes vertébrales de type: spondylolisthésis et spondylarthrose; fracture vertébrale et entorse vertébrale, névralgie cervico-brachiale. Les exclusions de ces affections «dorsales» ne s’appliquent pas en cas d’origine tumorale ou s’il s’agit d’une fracture ou si une intervention chirurgicale est nécessaire durant cette incapacité", "de travail nécessitant une hospitalisation d’au moins 5 jours continus. Au moment de l’adhésion, l’assuré peut demander à être couvert pour l’une (les) affection(s) définie(s) ci-avant, moyennant application d’une surcotisation spécifique et après acceptation par le Mutuelle. • Dépression, dépression nerveuse et dépression réactionnelle, syndrome anxiodépressif, syndrome maniaco-dépressif, trouble bipolaire,trouble obsessionnel compulsif, syndrome de fatigue chronique, épuisement, asthénie, burn-out, bore-out, boulimie, anorexie, hyperphagie, schizophrénie et trouble schizoaffectif, hallucination et trouble délirant, trouble phobique, trouble anxieux, anxiété généralisée, insomnie, narcolepsie et hypersomnie, syndrome de stress post traumatique, stress réactionnel, fibromyalgie et syndrome douloureux régional complexe. Les exclusions de ces affections « psychiatriques » ne s’appliquent pas dès lors qu’elles ont motivé une hospitalisation d’au moins 9 jours continus en milieu psychiatrique dans les six mois suivant le 1er jour d’arrêt de travail. Au moment de l’adhésion, l’assuré peut demander à être couvert pour l’une(les) affection(s) définie(s) ci-avant, moyennant application d’une surcotisation spécifique après acceptation de la Mutuelle. Le rachat de ces exclusions permet à l’assuré souhaitant être garanti pour ces affections d’en faire la demande à la Mutuelle lors de l’adhésion, ou en cours de vie de celle-ci ; la garantie de ces affections, sans aucune condition d’hospitalisation, fait l’objet d’une mention particulière aux conditions particulières : garantie optionnelle « Dos et Psy ». Le rachat de ces deux exclusions ne peut être dissocié. En cas de refus de la Mutuelle, pour raisons d’ordre médical, aucune des deux garanties optionnelles ne pourra donc être accordée.\n\nARTICLE 7 – QUE FAIRE EN CAS DE SINISTRE ? L’assuré ou le bénéficiaire, dès qu’il en a connaissance et au plus tard dans les délais indiqués ci-dessous, doit déclarer à la Mutuelle, ou par délégation à l’organisme gestionnaire désigné par lui, tout sinistre de nature à entraîner la mise en œuvre des garanties du contrat. L’exigibilité des prestations est subordonnée à la fourniture à la Mutuelle (ou le cas échéant à son médecin-conseil) de toutes les pièces et justificatifs nécessaires à la Mutuelle pour l’étude du dossier en fonction des garanties souscrites, ces pièces étant les suivantes :\n\nPIÈCES JUSTIFICATIVES COMMUNES À TOUTES LES GARANTIES : Un constat de gendarmerie ou rapport de police précisant la date de survenance et les circonstances de l’évènement lorsque le sinistre résulte des suites d’un accident pourra être demandé selon la nature du sinistre, une attestation de l’organisme prêteur confirmant le montant de la prestation à verser, le tableau d’amortissement annexé au contrat de prêt assuré ou une copie de l’extrait de compte sur lequel figure la mensualité de prêt réglée au titre du prêt assuré.\n\nPIÈCES JUSTIFICATIVES SPÉCIFIQUES À CHACUNE DES GARANTIES : En cas de décès : − un extrait d’acte de décès de l’assuré, sous pli confidentiel à l’attention du médecin-conseil de la Mutuelle, − un certificat médical détaillé du médecin traitant de l’assuré (sur imprimé type fourni par la Mutuelle) précisant notamment les causes du décès et les circonstances dans lesquelles il s’est produit, en particulier s’il résulte d’un accident. En cas de Perte Totale et Irréversible d’Autonomie : − la notification de Perte Totale et Irréversible d’Autonomie avec assistance d’une tierce personne pour accomplir au moins cinq des actes ordinaires de la vie tels que définis par la Sécurité sociale délivrée par le Régime Obligatoire, − sous pli confidentiel à l’attention du médecin-conseil de la Mutuelle un certificat médical détaillé du médecin traitant de l’assuré (sur imprimé type fourni par la Mutuelle) et précisant la nature et l’origine des lésions constatées médicalement ainsi que la date de reconnaissance de l’état de perte totale et irréversible d’autonomie, confirmant que l’assuré se trouve dans l’impossibilité totale et irréversible de se livrer à toute occupation et à toute activité rémunérée ou lui procurant gain ou profit et l’obligeant à recourir définitivement à l’assistance d’une tierce personne pour accomplir au moins cinq des actes ordinaires de la vie tels que prévus au Code de la Sécurité sociale. En cas d’Incapacité Temporaire Totale de travail ou d’Invalidité Permanente Totale ou Partielle : • sous pli confidentiel à l’attention du médecin-conseil de la Mutuelle, un certificat médical détaillé du médecin traitant de l’assuré (sur imprimé type fourni par la Mutuelle) précisant notamment la nature de la maladie, la date de son apparition ou s’il s’agit d’un accident la date de survenance et la nature des lésions, la durée probable de l’incapacité temporaire totale, la date et l’importance de l’invalidité retenue, • les certificats médicaux d’arrêt de travail et de prolongation, • la notification d’attribution de la pension d’invalidité de la Sécurité sociale ou de tout autre régime obligatoire. Pour toutes les garanties souscrites, la Mutuelle se réserve le droit de demander toutes pièces complémentaires nécessaires à l’étude du dossier et d’effectuer un contrôle médical. Le service des prestations pourra être refusé ou suspendu en attente des résultats de ce contrôle, si l’assuré ou le bénéficiaire refuse de s’y soumettre ou de fournir les pièces justificatives demandées par la Mutuelle, sauf cas fortuit ou de force majeure dont l’assuré ou le bénéficiaire apporterait la preuve. Conformément à la réglementation applicable en matière de secret médical, tout justificatif de nature médicale devra être transmis sous pli confidentiel au médecin-conseil de la Mutuelle par l’intermédiaire de l’assuré ou, en cas de décès, par l’inermédiaire de l’ayant droit. La Mutuelle s’engage, après acceptation du sinistre et dans un délai de 30 jours suivant la réception de l’ensemble des pièces justificatives, à régler les prestations dues.\n\nDÉLAIS DE DÉCLARATION : Le sinistre doit être déclaré dans un délai maximum de 30 jours à compter de sa date de survenance. À défaut de déclaration dans le délai précité, le sinistre sera considéré comme étant survenu au jour de sa déclaration et la franchise prévue sera décomptée à partir de cette date. Toute prolongation d’arrêt de travail accordée par le médecin traitant devra également être déclarée dans un délai maximum de 30 jours. À défaut de déclaration dans le délai précité, l’assuré sera considéré comme ayant repris son activité professionnelle à l’expiration de la période indiquée dans le certificat d’arrêt de travail précédemment remis à la Mutuelle et les périodes comprises entre cette date et le début de la période de prolongation reçue tardivement ne pourront faire l’objet d’aucune indemnisation.\n\nARTICLE 8 – LITIGES ET ARBITRAGES En cas de désaccord de l’assuré sur les conclusions d’une expertise médicale effectuée par un expert désigné par la Mutuelle, ou bien par son médecin-conseil, l’assuré peut faire procéder à une contreexpertise à ses frais par un expert de son choix. Si les experts désignés ne sont pas d’accord entre eux, une tierce expertise sera alors réalisée ; le coût de la tierce expertise est supportée pour moitié par chacune des parties. Les parties s’engagent à considérer le rapport du tiers expert comme décision d’arbitrage et s’interdisent d’avoir recours à la voie judiciaire tant que le tiers expert n’a pas déposé son rapport. On entend par expert, les", "médecins répertoriés sur la liste des experts judiciaires, désignés comme tels par la Cour d’Appel du domicile de l’assuré et reconnus par les Organismes d’Assurance ainsi que les médecins diplômés de la réparation juridique du dommage corporel.\n\nARTICLE 9 – LES OBLIGATIONS DE L’ASSURÉ Au moment de l’adhésion, l’assuré s’engage à informer la Mutuelle : • de toute aggravation ou modification des éléments constitutifs du risque à assurer (changement des caractéristiques du (des) prêt(s) assuré(s), situation personnelle et professionnelle, déplacements professionnels. En cours de vie de l’adhésion, l’assuré s’engage également à informer la Mutuelle : • de tout remboursement partiel ou total du prêt bancaire et ce au maximum dans les 30 jours qui suivent, • de tout changement des caractéristiques du(des) prêt(s) assuré(s) intervenant postérieurement à la prise d’effet des garanties et/ ou de l’avenant, • de la survenance de toute cause d’exigibilité immédiate des sommes restant dues au prêteur prévue aux conditions générales du contrat de prêt, de l’expiration normale ou anticipée des engagements de l’assuré emprunteur vis-à-vis de l’organisme financier, et pour les adhésions au seul module « Prévoyance Crédit » de cessation du contrat d’assurance couvrant le prêt contracté simultanément à l’adhésion au Contrat, • pour toute demande d’adjonction des garanties : de toute aggravation ou modification des éléments constitutifs du risque décrits ci-dessus ainsi que toute modification de son état de santé dès lors que des formalités médicales seraient requises, intervenue antérieurement à la prise d’effet des nouvelles garanties. En revanche, en cas de modification en cours de vie de l’adhésion des éléments déclarés à l’adhésion suivants : activité professionnelle, séjour professionnel à l’étranger et / ou pratique d’un sport, tabagisme, dès lors qu’ils ne relèvent pas d’une exclusion prévue aux conditions particulières ou à la notice d’information, l’assuré n’est pas contraint d’en informer la Mutuelle qui prendra en compte la nouvelle situation de l’assuré au moment du sinistre. Toute inexactitude, omission, réticence ou fausse déclaration de la part de l’assuré portant sur des éléments constitutifs du risque au moment de l’adhésion, lors de la mise en place d’un avenant ou en cours de vie de l’adhésion, même si elle a été sans influence sur le sinistre, expose l’assuré à l’application des sanctions prévues par les articles L.221-14 et L.221-15 du Code de la Mutualité, les cotisations versées restant acquises à la Mutuelle. De même, toute omission, réticence, fausse déclaration volontaire dans la déclaration du sinistre de la part de l’assuré, de ses ayants droit ou du bénéficiaire, entraîne la déchéance des garanties voire la nullité de l’adhésion.\n\nARTICLE 10 – COTISATIONS La cotisation annuelle est calculée en fonction des caractéristiques propres à l’assuré telles que l’âge (âge à l’adhésion) ou l’activité professionnelle, et des éléments constitutifs du risque à assurer (montant du capital initial assuré …) déclarés à l’adhésion. Cette cotisation est fixe. La cotisation annuelle ainsi calculée et acceptée par l’adhérent lors de l’adhésion est maintenue par la Mutuelle pour toute la durée de l’adhésion, y compris en cas de changement de la situation personnelle ou professionnelle de l’assuré sous réserve des exclusions prévues au présent contrat. Les cotisations pourront être revues en cas d’évolution des garanties (adjonction ou suppression de garanties), en cas d’évolution des caractéristiques du prêt assuré. Les cotisations sont payables d’avance et peuvent être fractionnées, annuellement, semestriellement, trimestriellement ou mensuellement, ce sans frais de fractionnement ; la périodicité est choisie à l’adhésion. Conformément à l’article L.221-8 du Code de la Mutualité , à défaut de paiement des cotisations dues dans le délai de 10 jours suivant leur échéance, une lettre recommandée est adressée à l’adhérent, fixant un délai de 40 jours au terme duquel l’adhésion est résiliée de plein droit ; toutes les garanties sont suspendues 30 jours après l’envoi de la lettre recommandée précitée. En cas de paiement des sommes demandées sur la lettre de mise en demeure, après suspension mais avant résiliation, les garanties reprendront effet à midi le lendemain du paiement. La Mutuelle s’engage à informer par courrier l’établissement prêteur de tout acte de mise en demeure pour non-paiement ou de résiliation.\n\nARTICLE 11 – EXAMEN DES RÉCLAMATIONS - MÉDIATION Pour toute réclamation liée à l’application du contrat, l’adhérent ou l’ayant droit peut s’adresser à son interlocuteur habituel ou au service à l’origine du désaccord entre lui et la Mutuelle. Il a la possibilité d’adresser une réclamation écrite en envoyant un courrier postal à l’adresse de son centre de gestion. La Mutuelle accusera réception de la réclamation dans un délai de 10 jours ouvrables à compter de son envoi (sauf réponse dans ce délai). En tout état de cause, la réclamation fera l’objet d’une réponse écrite dans un délai maximum de 2 mois à compter de son envoi. Enfin, en application et dans les conditions de l’article « Médiation » des statuts de la Mutuelle, l’adhérent peut saisir le médiateur au terme du processus de traitement des réclamations défini par la Mutuelle, et en tout état de cause, deux mois après sa première réclamation écrite, qu’il ait ou non reçu de réponse de la part de la Mutuelle, par voie électronique en complétant le formulaire prévu à cet effet à l’adresse suivante : http://cnpm-mediation-consommation.eu ou en écrivant à CNPM - Médiation – Consommation 27, avenue de la Libération – 42400 Saint-Chamond.\n\nARTICLE 12 – PRESCRIPTION, PRÉLÈVEMENTS FISCAUX ET SOCIAUX PRESCRIPTION : Conformément à l’article L.221-11 du Code de la Mutualité, « toutes actions dérivant des opérations régies par le présent titre sont prescrites par deux ans à compter de l’événement qui y donne naissance. Toutefois, ce délai ne court : 1° En cas de réticence, omission, déclaration fausse ou inexacte sur le risque couru, du fait du membre participant, que du jour où la Mutuelle ou l’union en a eu connaissance ; 2° En cas de réalisation du risque, que du jour où les intéressés en ont eu connaissance, s’ils prouvent qu’ils l’ont ignoré jusque-là. Quand l’action du participant, du bénéficiaire ou de l’ayant droit contre la Mutuelle ou l’union a pour cause le recours d’un tiers, le délai de prescription ne court que du jour où ce tiers a exercé une action en justice contre le membre participant ou l’ayant droit, ou a été indemnisé par celui-ci. Dans le cadre des opérations collectives mentionnées au III de l’article L. 221-2, la prescription est portée à cinq ans en ce qui concerne l’incapacité de travail. La prescription est portée à dix ans lorsque, pour les opérations mentionnées au b du 1° du I de l’article L. 111-1, le bénéficiaire n’est pas le membre participant et, dans les opérations relatives aux accidents atteignant les personnes, lorsque les bénéficiaires sont les ayants droit du membre participant décédé. Pour les contrats d’assurance sur la vie, nonobstant les dispositions du 2°, les actions du bénéficiaire sont prescrites au plus tard trente ans à compter du décès du membre participant. »", "Conformément aux dispositions de l’article L221-12 du Code de la Mutualité, « la prescription est interrompue par une des causes ordinaires d’interruption de la prescription et par la désignation d’experts à la suite de la réalisation d’un risque. L’interruption de la prescription de l’action peut, en outre, résulter de l’envoi d’une lettre recommandée ou d’un envoi recommandé électronique, avec accusé de réception, adressé par la Mutuelle ou l’union au membre participant, en ce qui concerne l’action en paiement de la cotisation, et par le membre participant, le bénéficiaire ou l’ayant droit à la Mutuelle ou à l’union, en ce qui concerne le règlement de l’indemnité. »\n\nPRÉLÈVEMENTS FISCAUX ET SOCIAUX : La cotisation annuelle s’entend impôts et taxes éventuels compris ; tout changement de ces impôts et taxes entraînera une modification du montant de la cotisation. L’ensemble des prélèvements sociaux et fiscaux, présents ou futurs, dont la récupération est licite, est à la charge de l’adhérent.\n\nARTICLE 13 – FACULTÉ DE RENONCIATION Toute personne physique ayant adhéré à distance, à des fins qui n’entrent pas dans le cadre de son activité commerciale ou professionnelle bénéficie d’un délai de 30 jours calendaires révolus pour y renoncer, sans avoir à justifier de motif ou supporter de pénalités. Ce délai commence à courir à compter du jour où l’adhésion a pris effet (c’est-à-dire du jour de la signature du bulletin d’adhésion) ou du jour où l’intéressé reçoit les conditions d’adhésion et les informations précontractuelles, si cette dernière date est postérieure. L’assuré doit adresser dans ce délai de 30 jours précité, à l’adresse du siège social de la Mutuelle une lettre recommandée ou envoi recommandé électronique qui peut être rédigé comme suit : « Je soussigné(e) (nom, prénom) demeurant à (adresse) déclare renoncer à mon adhésion effectuée par la signature de mon bulletin d’adhésion le… » Date et signature. La Mutuelle est tenue de rembourser à l’adhérent dans les meilleurs délais et au plus tard dans les trente jours toutes les sommes qu’elle a perçues de celui-ci en application du contrat. Ce délai commence à courir le jour où la Mutuelle reçoit notification par le membre participant de sa volonté de se rétracter. Au-delà, la somme due est, de plein droit, productive d’intérêts au taux légal en vigueur. L’adhérent restitue à la Mutuelle dans les meilleurs délais et au plus tard dans les trente jours toute somme qu’il a reçue de cette dernière. Ce délai commence à courir à compter du jour où il communique à la Mutuelle, sa volonté de se rétracter.\n\nARTICLE 14 – PROTECTION DES DONNÉES À CARACTÈRE PERSONNEL La Mutuelle, en tant que responsable de traitement, met en œuvre différents traitements de données à caractère personnel concernant l’adhérent, y compris certaines données personnelles relatives à la santé, dont les finalités principales consistent à effectuer toutes les opérations nécessaires à la passation, la gestion (y compris commerciale) et l’exécution de ses engagements contractuels, ainsi que toute opération relative à l’organisation de la vie institutionnelle relevant des statuts. La Mutuelle sera également susceptible de les utiliser pour (i) le recouvrement et le contentieux (ii) son dispositif de lutte contre les fraudes, incluant le contrôle, le traitement des soupçons de fraude et les fraudes avérées (iii) le respect de ses obligations légales et règlementaires existantes ou à venir et notamment la lutte contre le blanchiment de capitaux et le financement du terrorisme (iv) dans les conditions fixées par la règlementation, la prospection commerciale, y compris l’analyse à des fins d’évaluation et de personnalisation du parcours client, ou d’amélioration de nos offres (v) toute autre finalité qui pourrait être précisée sur nos supports de collecte. Afin de faciliter leur traitement, les documents comportant les données de l’adhérent peuvent faire l’objet d’une dématérialisation. En outre, la Mutuelle étant légalement tenue de vérifier l’exactitude, la complétude et l’actualisation de leurs données personnelles, elle est susceptible de solliciter l’adhérent pour les vérifier ou être amenée à compléter leur dossier (par exemple en enregistrant leurs adresses email s’ils ont écrit un courrier électronique). Les données personnelles de l’adhérent seront conservées le temps nécessaire à la réalisation de ces différentes finalités et au respect des différentes dispositions légales relatives à la prescription ou à toute autre durée spécifique fixée par l’autorité de contrôle dans un référentiel sectoriel (normes pour le secteur assurance). Elles sont destinées aux personnels habilités de la Mutuelle et, dans la stricte limite des finalités citées ci-dessus, sont susceptibles d’être transmises aux acteurs intervenant dans le cadre de la conclusion et de la gestion du contrat, ainsi qu’aux réassureurs, aux sous-traitants, partenaires et organismes professionnels habilités par la Mutuelle et contribuant à la réalisation de ces finalités. Elles peuvent également, pour satisfaire aux obligations légales et règlementaires, être communiquées, à leur requête, aux organismes officiels et aux autorités administratives ou judiciaires, notamment dans le cadre de la lutte contre le blanchiment des capitaux ou de la lutte contre le financement du terrorisme en application des dispositions légales. L’adhérent dispose d’un droit d’accès, de rectification, d’effacement ou de portabilité de ses données personnelles, ainsi que du droit de définir des directives relatives à leur sort après son décès. Il dispose en outre d’un droit à la limitation des traitements et d’un droit d’opposition (par ex. le droit de s’opposer à l’utilisation de ses données personnelles à des fins de prospection commerciale et/ou de profilage), dans les limites des intérêts légitimes de la Mutuelle. Sous réserve de ne pas entraver l’exécution du contrat, l’adhérent peut solliciter à tout moment le retrait de toute autorisation spéciale et expresse qui aurait été donnée pour l’utilisation de certaines de ses données personnelles et/ou de leur utilisation pour une finalité particulière. Par ailleurs, il peut également à tout moment s’inscrire sur la liste d’opposition au démarchage téléphonique (bloctel.gouv.fr). L’adhérent peut exercer ses droits auprès du Responsable Protection des données - Data Protection Officer - de la Mutuelle par mail à l’adresse : dpo@harmonie-Mutuelle.fr ou par courrier postal adressé à : « Harmonie Mutuelle - Service DPO - 29 quai François Mitterrand – 44273 Nantes Cedex 2 », en joignant à leur demande une copie de leur justificatif d’identité. En cas de réclamations relatives au traitement de leurs données personnelles et à l’exercice de ses droits, il peut décider de saisir la Commission Nationale Informatique et Libertés (CNIL) : 3 place de Fontenoy - TSA 80715 – 75334 Paris Cedex 07 (www.cnil.fr.). Pour des raisons de confidentialité, les demandes liées aux données de santé couvertes par le secret médical doivent être adressées au médecin-conseil d’Harmonie Mutuelle, 23 boulevard Jean Jaurès - CS 51423 - 45004 Orléans Cedex 1.\n\nARTICLE 15 – LUTTE CONTRE LE BLANCHIMENT DE CAPITAUX ET FINANCEMENT DU TERRORISME – GEL DES AVOIRS - ANTICORRUPTION Dans le cadre de l’application des dispositions du présent contrat, la Mutuelle doit respecter les réglementations applicables en matière de lutte contre le blanchiment de capitaux et financement du terrorisme, gel des avoirs, et anticorruption. Ainsi, la Mutuelle pourrait être amenée à refuser une adhésion ou le paiement d’une prestation, dès lors que cela l’exposerait à une quelconque sanction. La mise en œuvre de ces réglementations pourra amener la Mutuelle à solliciter auprès de ses adhérents la communication de pièces justificatives portant notamment sur l’identité de ces derniers, le lieu de leur résidence, l’origine des fonds ou", "ressources déclarés. En tout état de cause, les éléments demandés seront limités à ceux requis afin de répondre aux obligations réglementaires présentement énoncées et auxquelles la Mutuelle est assujettie.\n\nARTICLE 16 – AUTORITÉ DE CONTRÔLE La Mutuelle est soumise au contrôle de l’Autorité de Contrôle prudentiel et de résolution (ACPR), située au : 4 Place de Budapest CS 92459, 75436 Paris Cedex 09.", "ANNEXE 1 – FICHE SYNTHÉTIQUE DES GARANTIES ET DE LEURS PRINCIPALES CARACTÉRISTIQUES\n\nLES GARANTIES Décès\n\nArticle 3 « Risques garantis » Perte Totale et Irréversible d’Autonomie (PTIA) Incapacité Temporaire Totale de travail (ITT) Invalidité Permanente Totale (IPT) Invalidité Permanente Partielle (IPP) LES PRINCIPALES CARACTÉRISTIQUES DES GARANTIES PROPOSÉES\n\nCouverture des sports amateurs pratiqués par l’emprunteur à la date de souscription Article 5 « Ce que ne couvre pas le contrat » Maintien de la couverture en cas de déplacement dans le monde entier : - à titre personnel - à titre professionnel ou humanitaire Article 4 « Territorialité des garanties »\n\nGARANTIE DÉCÈS Couverture de la garantie décès pendant toute la durée du prêt (dans la limite du 90ème anniversaire de l’assuré) Article 3 « Risques garantis »\n\nGARANTIE PERTE TOTALE ET IRRÉVERSIBLE D’AUTONOMIE Couverture de la garantie PTIA pendant toute la durée du prêt (dans la limite du 70ème anniversaire de l’assuré) Article 3 « Risques garantis »\n\nGARANTIE INCAPACITÉ TEMPORAIRE TOTALE DE TRAVAIL Couverture de la garantie pendant toute la durée du prêt (dans la limite du 70ème\n\nanniversaire de l’assuré dès lors qu’il n’est pas à la retraite ou en préretraite)\n\nArticle 1 « Définitions contractuelles » Article 3 « Risques garantis » Délais de franchise proposés au choix de l’adhérent : - 30 jours - 60 jours - 90 jours - 120 jours - 180 jours Pour une personne en activité, évaluation de l’incapacité en fonction de la profession exercée au jour du sinistre Pour une personne en activité, prestation égale à la mensualité assurée sans référence à la perte de revenu subie pendant le sinistre Maintien de la couverture en cas de temps partiel thérapeutique avec une prise en charge minimale de 50% sur une durée de 180 jours Couverture des inactifs au moment du sinistre avec une prestation égale à la mensualité assurée sans référence à la perte de revenu subie pendant le sinistre En cas de rachat de l’exclusion, couverture des affections dorsales sans condition d’hospitalisation, ni d’intervention chirurgicale Article 5 « Ce que ne couvre pas le contrat »En cas de rachat de l’exclusion, couverture des affections psychiatriques sans condition d’hospitalisation GARANTIE INVALIDITÉ Couverture de la garantie pendant toute la durée du prêt (dans la limite du 70ème\n\nanniversaire de l’assuré dès lors qu’il n’est pas à la retraite ou en préretraite)\n\nArticle 3 « Risques garantis » Pour une personne en activité, évaluation de l’incapacité professionnelle en fonction de la profession exercée au jour du sinistre Prise en charge de l’invalidité sans référence à la perte de revenu subie au moment du sinistre Prise en charge de l’invalidité partielle (IPP) à partir de 33% Couverture des affections dorsales sans condition d’hospitalisation, ni d’intervention chirurgicale Article 5 « Ce que ne couvre pas le contrat » Couverture des affections psychiatriques sans condition d’hospitalisation", ""]}, {"id": "safi_crd", "name": "Safi Emprunteur CRD", "assureur": "Prépar-Vie", "base": "CRD", "version": "Mars 2025", "ref": "N° CE/20 026", "produit": "Safi", "pages": ["SAFI EMPRUNTEUR NOTICE D’INFORMATION\n\nNOTICE D’INFORMATION VALANT CONDITIONS GÉNÉRALES DU CONTRAT D’ASSURANCE EMPRUNTEUR SAFI EMPRUNTEUR N° CE/20 026 (VERSION MARS 2025)", "Le contrat d’assurance de Prêts et crédits SAFI EMPRUNTEUR est un contrat collectif d’assurance à adhésion facultative individuelle, régi par les articles L. 141-1 et suivants du Code des assurances et la loi n°89- 1009 du 31 décembre 1989 dite \"loi Evin\". Ce contrat est dénommé ci- après le contrat d’assurance de groupe et est réservé aux seuls membres de l’Association de Promotion de Prévoyance Santé et Retraite (A.P.P.S.R). Il est distribué par l’intermédiaire de MAGNOLIA WEB ASSURANCES, via son réseau d’apporteurs. La langue utilisée au cours du contrat sera la langue française.\n\nLe Souscripteur est l’Association de Promotion de Prévoyance Santé et Retraite (A.P.P.S.R.) - association à but non lucratif régie par la loi du 1er juillet 1901 située au, 120 avenue du Général Leclerc 75014 Paris, dont l’objet social est d’étudier, de souscrire et de promouvoir au profit de ses Adhérents qui sont résidents fiscaux français au jour de l’adhésion, tout type d’assurance autorisée par la loi, sous la forme d’assurance collective et dont le risque est assuré par l’Assureur relevant du Code des assurances.\n\nL’Assureur ci-après des garanties d’assurance de Prêts et de crédits, désigne PREPAR-VIE, Entreprise régie par le Code des Assurances, Société Anonyme à Directoire et Conseil de Surveillance au capital de 182 183 792 euros. Siège social : Immeuble Le Village 1 - Quartier Valmy - 33 Place Ronde - CS 90241 – 92800 Puteaux - 323 087 379 RCS Nanterre.\n\nL’Assureur délègue la gestion au gestionnaire : FOREVER - Société de Courtage en assurances, gestion de contrats d’assurance - Société par actions simplifiée (Société à associé unique) - au capital de 10 000 euros - Siège social : 73 Rue du Château 92100 Boulogne- Billancourt - 890 767 940 RCS NANTERRE – Orias : 20009474.\n\nQuelques définitions :\n\nLes termes débutant par une majuscule et en italiques, non définis dans le corps de la notice ont la signification suivante.\n\nAccident : Toute atteinte corporelle médicalement constatée, non intentionnelle de la part de l’Assuré et provenant de l’action soudaine et imprévisible d’une cause extérieure. Les malaises cardiaques, les infarctus du myocarde, les spasmes coronariens, les troubles du rythme cardiaque, les lombosciatalgies, les Accidents vasculaires et les hémorragies cérébrales ne sont pas considérés comme des Accidents.\n\nAdhérent : Personne physique ou morale qui adhère à l’Association et à la présente Convention, et remplissant les conditions définies à l’Article 13.1.\n\nAffection : Toute altération de l’état de santé quelle qu’en soit l’origine (Accident ou Maladie), constatée par une autorité médicale compétente.\n\nAge de l’Assuré : Age de l’Assuré à toute date, calculé par différence entre cette date et sa date de naissance (âge exact).\n\nAssuré : Personne sur la tête de qui reposent les garanties de la présente Convention. L’Assuré est inscrit au Certificat d’adhésion et remplit les conditions définies à l’Article 13.1.\n\nBénéficiaire : Personne physique ou morale qui bénéficie de l’assurance à concurrence des sommes qui sont dues.\n\nCapital Restant Dû : Pour un Prêt, désigne le capital emprunté non amorti à la date de l’événement garanti, majoré du montant des intérêts d’emprunt courus et non échus. Pour une opération de financement locatif, désigne la somme des loyers restant dus à la date de l’événement garanti, y compris la valeur résiduelle du bien. Le Capital Restant Dû ne tient pas compte des Echéances de Prêt impayées ainsi que des intérêts de retard ou de pénalités. Caution : Personne physique s’engageant à garantir l’exécution de l’obligation de remboursement par l’Emprunteur ou le Co-Emprunteur en cas de défaut de paiement par celui-ci. Les garanties souscrites ne jouent au profit d’un Assuré agissant en qualité de Caution qu’à la condition qu’au jour du Sinistre, la Caution ait été appelée en garantie officielle depuis au moins une Echéance par l’Organisme Prêteur par suite de la défaillance du cautionné.\n\nConjoint collaborateur : Conjoint d’un dirigeant d’une société commerciale, artisanale ou libérale, qui exerce une activité professionnelle effective et régulière dans la société, ne perçoit pas de rémunération au titre de cette activité, n’a pas la qualité d’associé du chef d’entreprise au sens de l’article 1832 du code civil, et est déclaré comme tel auprès du Centre de formalités des entreprises (CFE).\n\nDate de consolidation : Date à partir de laquelle, compte tenu des connaissances de la médecine à cette date, l'état de santé de l'Assuré n’est plus susceptible de s’améliorer, soit spontanément, soit sous l’effet d’aucun traitement.\n\nEchéance : Montant de remboursement conformément au tableau d’amortissement ou échéancier de loyers au jour du Sinistre, dans la limite du montant garanti tels que prévus au Certificat d’Adhésion ou avenant à l’adhésion en vigueur au jour du Sinistre. En cas de différé partiel d’amortissement, l’Echéance est limitée aux seuls intérêts du Prêt. L’Echéance ne couvre pas, le remboursement du capital pour les Prêts In Fine et les Prêts Relais, ni le remboursement de la valeur résiduelle pour les opérations de financement locatif. Concernant les Prêts à paliers intégrant les Prêts achat-revente, l’Assureur ne prend pas en charge dans l’Echéance, la part correspondant à un remboursement anticipé de capital, programmé ou non, lié à la revente de l’ancien bien de l’Emprunteur. Les retards de paiement d’échéances de Prêt ou de loyers, les pénalités ou intérêts de retard appliqués par l’Organisme Prêteur ne sont pas pris en compte dans l’Echéance.\n\nEmprunteur : Toute personne physique ou morale à qui le Prêteur consent un Prêt.\n\nFumeur : Personne ne pouvant pas déclarer qu’elle n’a pas fumé de cigarettes, cigarettes électroniques, cigares ou pipes, même occasionnellement au cours des vingt-quatre (24) derniers mois précédant la date de la demande d’adhésion.\n\nMaladie : Toute altération de l’état de santé de l’Assuré constatée par une autorité médicale compétente.\n\nPrêt ci-après désigne un Prêt, libellé en Euros ou en Franc Pacifique tel que précisé à l’Article 15.4.\n\nPrêteur : Organisme Prêteur identifié sur la demande d’adhésion à l‘assurance. Le Prêteur doit être un établissement de crédit français ou une succursale française d’un établissement de crédit étranger (situé en Suisse ou au sein de l’Union Européenne). L’Organisme Prêteur est réputé avoir accepté le bénéfice du contrat.\n\nQuotité Assurée : La Quotité Assurée correspond pour chaque Assuré à la part, en pourcentage du capital emprunté, couverte par l’assurance de l’Opération de crédit. Elle doit être inférieure ou égale à 100 %.\n\nLorsque plusieurs personnes sont assurées au titre d’une même Opération de crédit, le montant total des indemnités versées par l’Assureur ne peut excéder au global, en cas de pluralité de Sinistres, le montant des sommes dues pour une Quotité Assurée de 100%. En cas d’investissement locatif effectué dans le cadre d’une SCI non-familiale, la Quotité Assurée en ITT, IPP et IPT ne peut en aucun cas être supérieure à la part détenue par l’Assuré dans la SCI au moment de l’adhésion.", "QUELLE EST L’ÉTENDUE DE VOS GARANTIES ?\n\nARTICLE 1 : OBJET DU CONTRAT\n\nCe contrat a pour objet de garantir, postérieurement à la prise d’effet des garanties, et avant le remboursement intégral du Prêt et/ou la cessation des garanties, l’Assuré contre tout ou partie des risques couverts suivants, selon l’Age de l’Assuré au jour de l’adhésion (cf. article 15.1 ci- après) et le cas échéant le montant du capital assuré :\n\nRisques couverts (en tout ou partie) :\n\nGaranties Obligatoires :\n\n• Décès (DC), • Perte Totale et Irréversible d’Autonomie (P.T.I.A.).\n\nGaranties Complémentaires :\n\n• Invalidité Permanente Totale (I.P.T.), • Option I.P.T. en capital • Invalidité Permanente Partielle (I.P.P.), conditionnée à la souscription de la garantie I.P.T. • Incapacité Totale de Travail (I.T.T.) et Temps Partiel Thérapeutique (T.P.T), garanties indissociables et conditionnées à la souscription de la garantie I.P.T., • Invalidité Permanente Professionnelle (I.P.Pro.) • Exonération des cotisations, garantie conditionnée à la souscription des garanties I.T.T.et I.P.T. • Option « Rachat Dos », garantie conditionnée à la souscription des garanties I.T.T.et I.P.T. • Option « Rachat Psy », garantie conditionnée à la souscription des garanties I.T.T.et I.P.T.\n\nAvant la prise d’effet des garanties visées ci-dessus, l’Assuré bénéficie d’une garantie temporaire préalable en cas de Décès Accidentel dans le cadre d’un nouveau Prêt, à concurrence du montant assuré avec un maximum de cent vingt mille euros (120 000 €) dans les conditions définies à l'article 3.\n\nSeules sont accordées à l’Assuré, les garanties choisies au jour de l’adhésion et acceptées par l’Assureur, mentionnées sur le certificat d’adhésion valant délégation de bénéfice.\n\nRègles d’éligibilité pour l’ensemble des garanties :\n\nTerritorialité France continentale Corse, DROM COM\n\nActivité profes- sionnelle et type de Prêt En activité\n\nSans activité En activité Sans activité Professions libérales, médicales et paramédicales Autres activités Prêts professionnel Autres Prêts\n\nDécès\n\nPTIA\n\nIPT en rente IPT en capital\n\nIPPro ITT 15 j\n\nITT 30j\n\nITT 60j\n\nITT 90j\n\nITT 120j\n\nITT 180j\n\nIPP\n\nGarantie Eligible\n\nGarantie Non éligible\n\nARTICLE 2 : DUREE DES GARANTIES 2.1 Prise d’effet des garanties 2.1.1. Adhésion à la même date que le contrat de Prêt\n\nLes garanties prennent effet à la date d’acceptation de l’offre ou du contrat de Prêt par le dernier signataire, sous réserve :\n\n• que cette acceptation intervienne dans les 6 (six) mois (ou 12 (douze) mois pour les Prêts différés), suivant l’envoi à l’Assuré de la notification de couverture par l’Assureur (cf. article 14 ci- après), • et que le premier décaissement intervienne dans les 6 (six) mois (ou 12 (douze) mois pour les Prêts différés), suivant l’acceptation de l’offre ou du contrat de Prêt, • et du paiement de la première cotisation d’assurance dans le délai mentionné ci-avant\n\n2.1.2. Adhésion à une date postérieure au contrat de Prêt, suite à substitution d’assurance\n\nConformément aux dispositions de l’article L. 113-12-2 du Code des Assurances, les garanties prennent effet dix jours après la réception par l’Assureur de la décision du Prêteur ou à la date de prise d’effet du contrat accepté en substitution par le Prêteur si celle-ci est postérieure.\n\n2.2 Durée des garanties La durée maximale de l’assurance, décomptée à partir de la date d’effet des garanties, est fonction de l'Âge de l'Assuré et de l’âge limite de la dernière garantie active (la garantie Décès), dans la limite de la durée du Prêt garanti. Elle correspond à la période comprise entre la date de prise d’effet des garanties et leurs dates de cessation stipulées au 2.3 ci-après.\n\n2.3 Cessation des garanties Vos garanties et les prestations cessent :\n\n• en tout état de cause, à l’âge limite de couverture fixé pour chaque garantie, c’est-à-dire :\n\nGaranties obligatoires :\n\nDécès (DC) Jusqu’à la date du 91ème\n\nanniversaire de l’Assuré Perte Totale et Irréversible d’Autonomie (P.T.I.A) Jusqu’à la date du 71ème\n\nanniversaire de l’Assuré", "Garanties complémentaires :\n\nIncapacité Totale de Travail (I.T.T) y compris Temps Partiel Thérapeutique (T.P.T.) Dès la prise d’effet de la retraite à l’âge normal ou par anticipation quel qu’en soit le motif, y compris pour l’inaptitude au travail ou selon l’option choisie et inscrite au certificat d’adhésion :\n\n- jusqu’à la date du 67ème anniversaire de l’Assuré ou - jusqu’à la date du 70ème anniversaire de l’Assuré si l’option « extension de garantie » a été choisie\n\nen cas de poursuite d’une activité professionnelle rémunérée. Invalidité Permanente Totale (I.P.T), y compris IPT en capital ou Invalidité Spécifique AERAS (GIS)\n\nInvalidité Permanente Partielle (I.P.P)\n\nExonération des cotisations\n\nInvalidité Permanente Professionnelle (I.P.Pro.) Dès la cessation de votre activité professionnelle à titre libéral (sauf en cas de mise en retraite anticipée pour raison médicale), de la radiation à l’ordre de votre profession ou jusqu’à la date du 67ème anniversaire de l’Assuré en cas de poursuite de l’activité professionnelle rémunérée déclarée à l’adhésion.\n\nVos garanties et les prestations cessent également : • au terme normal ou anticipé du Prêt, • à la date de déchéance du terme, • en cas de non-paiement des cotisations, • à la date à laquelle vous résiliez votre engagement de Caution, • en cas de paiement de la prestation par l’Assureur suite à la mise en jeu de la garantie Perte Totale et Irréversible d’Autonomie (P.T.I.A.) ou de la garantie Décès (DC), ou de la garantie Invalidité Permanente Professionnelle (I.P.Pro.). • en cas de paiement de la prestation par l’Assureur suite à la mise en jeu de la garantie Invalidité Permanente Totale (I.P.T.) si vous avez souscrit l’option « Prestation en capital », • à la date de résiliation effective de l’adhésion par l’Assuré (cf.Résiliation de l’adhésion ci-après).\n\n2.4 Résiliation de l’assurance associée à des Prêts immobiliers relevant de l’article L. 313-1 1° du code de la consommation\n\nConformément aux dispositions de l’article L. 113-12-2 du Code des assurances, l’Assuré peut demander la résiliation de son adhésion à tout moment à compter de la signature de l’offre de Prêt définie à l’article L. 313-24 du Code de la consommation. Cette demande peut s’effectuer par tous moyens prévus au L. 113-14 du Code des assurances et notamment par lettre ou tout autre support durable. Cette résiliation ne peut intervenir qu’après que l’Assuré ait demandé au Prêteur la substitution de son adhésion par un autre contrat d’assurance emprunteur, présentant à minima les mêmes garanties. En cas d’acceptation de substitution d’assurance par le Prêteur, celui- ci doit dans un délai de 10 (dix) jours à compter de la réception de la demande de substitution, procéder à la modification par voie d’avenant du contrat de crédit établi en application de l’article L.313-39 du Code de la consommation. L’Assuré doit ensuite notifier à l’Assureur, par lettre recommandée ou par envoi recommandé électronique, la décision du Prêteur ainsi que la date de prise d’effet du contrat accepté en substitution. La résiliation de l’adhésion au présent contrat d’assurance prend effet 10 (dix) jours après la réception de la décision du Prêteur ou à la date de prise d’effet du contrat accepté en substitution par le Prêteur si celle- ci est postérieure. En cas de refus de substitution d’assurance par le Prêteur, le contrat d’assurance n’est pas résilié. 2.5 Résiliation de l’assurance associée à des crédits à la consommation et à des Prêts ne relevant pas de l’article L. 313-1 1° du Code de la consommation\n\nPour les Prêts immobiliers ne relevant pas de l’article L. 313-1 du Code de la consommation, sont possibles la résiliation annuelle à l’initiative de l’Assuré ou de l’Assureur sur le fondement de l’article L. 113-12 du Code des Assurances ou la résiliation à tout moment pour aggravation du risque, à l’initiative de l’Assureur ou la résiliation pour diminution du risque à l’initiative de l’Assuré sur le fondement de l’article L. 113-4 du Code des Assurances.\n\n2.6 Résiliation de l’assurance consécutivement à un rachat de Prêt\n\nEn cas de rachat de votre Prêt par un autre établissement de crédit, votre adhésion au présent contrat d’assurance sera résiliée. Il vous incombe de rechercher, avant de procéder à ce rachat les conditions auxquelles vous pourrez souscrire un nouveau contrat d’assurance emprunteur.\n\nARTICLE 3 : LA GARANTIE DECES 3.1 La garantie préalable du décès accidentel La garantie préalable du décès accidentel est applicable uniquement dans le cadre de la mise en place d’un nouveau Prêt. Elle ne s’applique pas dans le cadre d’une adhésion, à une date postérieure au contrat de Prêt, suite à substitution d’assurance.\n\nTant que l’acceptation des risques n’a pas pu être formulée par l’Assureur, seule la garantie préalable du Décès Accidentel est acquise à compter de la date de signature de la demande d’adhésion, aux conditions ci-après et sous réserve des exclusions définies à l’article 10.\n\nPar « Décès Accidentel », il faut entendre le décès consécutif à toute atteinte corporelle résultant directement de l’action soudaine d’une cause extérieure fortuite et indépendante de la volonté de l’Assuré.\n\nSi la garantie est acquise, l’assureur verse la prestation comme défini a l’article 3.2. La garantie du Décès Accidentel cesse :\n\n• dès la prise d’effet des garanties prévue à l’article 2.1 ci-avant en cas d’acceptation par l’Assureur de votre d’adhésion, • ou de plein droit, à la date du courrier de l’Assureur vous notifiant son refus de votre d’adhésion, si après examen des pièces médicales fournies, l’Assureur se prononce pour le refus de votre d’adhésion.\n\nDans le cas où vos garanties n’auraient pu prendre effet, la couverture du risque Décès Accidentel cesse de plein droit à la fin du sixième (6ème) mois (douzième (12ème) mois pour les Prêts Relais), suivant la signature de votre demande d’adhésion.\n\n3.2 La garantie décès toutes causes\n\nPar « Décès », il faut entendre le décès consécutif à une Maladie ou à un Accident. Cette garantie vous est acquise, dans les limites de la Quotité Assurée, sous réserve du respect de la limite d’âge pour adhérer (cf. article 13.1 ci-après), de l’acceptation de votre admission à l’assurance par l’Assureur et des exclusions définies à l’article 10.\n\nL’Assureur verse au(x) Bénéficiaire(s) désigné(s) le Capital Restant Dû au jour du décès tel qu’indiqué au tableau d’amortissement remis par le Prêteur multiplié par la Quotité Assurée, dans la limite du montant indiqué au certificat d’adhésion.\n\nEn cas de Décès de l’Assuré avant que les fonds ne soient totalement ou partiellement débloqués, sous réserve du paiement des cotisations d’assurance et conformément au Certificat d’Adhésion, l’Adhésion au", "Contrat produira tous ses effets, s’il est prévu au contrat de Prêt que l’opération pour laquelle le Prêt est consenti demeure.\n\nPour les Prêts à déblocages successifs des fonds, les prestations versées à l’Organisme Prêteur correspondent à la seule partie de l’engagement débloqué au jour du Décès (sous déduction des remboursements déjà effectués au jour du Sinistre). Le solde correspondant à la différence entre le capital garanti et les sommes dues à l’Organisme Prêteur au jour du Décès, est versé à l’Organisme Prêteur au fur et à mesure des déblocages successifs des fonds, dans la mesure où l’opération de crédit se poursuit sur décision du Co- Emprunteur ou des héritiers de l’Assuré lorsque l’Adhérent est une personne physique, de l’Adhérent lorsque celui-ci est une personne morale.\n\nLa garantie cesse contractuellement dans
