    L[i * W + j] = na[i] === nb[j] ? L[(i + 1) * W + j + 1] + 1 : Math.max(L[(i + 1) * W + j], L[i * W + j + 1]);
  const da = new Array(n).fill(true), db = new Array(m).fill(true);
  let i = 0, j = 0;
  while (i < n && j < m){
    if (na[i] === nb[j]){ da[i] = false; db[j] = false; i++; j++; }
    else if (L[(i + 1) * W + j] >= L[i * W + j + 1]) i++; else j++;
  }
  const render = (ws, flags, tag) => { let out = '', open = false; ws.forEach((w, x) => { if (flags[x] && !open){ out += `<${tag}>`; open = true; } if (!flags[x] && open){ out = out.replace(/ $/, '') + `</${tag}> `; open = false; } out += esc(w) + ' '; }); if (open) out = out.replace(/ $/, '') + `</${tag}>`; return out.trim(); };
  return {a: render(A, da, 'del'), b: render(B, db, 'ins')};
}
function renderDiff(){
  const {terms, fixes} = T();
  if (state.client && state.dA !== state.client){ state.dA = state.client; if (state.dB === state.dA) state.dB = (DOCS.find(d => d.id !== state.dA) || {}).id; }
  const A = byId(state.dA), B = byId(state.dB);
  const opts = sel => DOCS.map(d => `<option value="${d.id}"${d.id === sel ? ' selected' : ''}>${esc(fullName(d))}</option>`).join('');
  const controls = `<div class="dsel"><select id="dA" aria-label="Notice A">${opts(state.dA)}</select><button class="btn small" data-act="swap" title="Inverser A et B">⇄</button><select id="dB" aria-label="Notice B">${opts(state.dB)}</select></div>`;
  if (!A || !B || A.id === B.id){ $('#main').innerHTML = controls + '<p class="none">Choisissez deux notices différentes pour voir ce qui change.</p>'; return; }
  const r = diffDocs(A, B);
  const hasTerms = terms.length > 0;
  const inTerms = t => { const n = norm(t); return terms.some(x => termRanges(n, x).length); };
  const pick = {
    mod: r.mod.filter(p => !hasTerms || inTerms(r.ua[p.i].t) || inTerms(r.ub[p.j].t)),
    a: r.onlyA.filter(i => !hasTerms || inTerms(r.ua[i].t)),
    b: r.onlyB.filter(j => !hasTerms || inTerms(r.ub[j].t))
  };
  const pct = Math.round(r.ratio * 100);
  const chip = (k, label, n) => `<button class="chip${state.dFilter === k ? ' on' : ''}" data-df="${k}">${label} (${n})</button>`;
  let items = [];
  if (state.dFilter === 'mod' || state.dFilter === 'all') pick.mod.forEach(p => items.push({k: 'mod', pg: r.ua[p.i].page, p}));
  if (state.dFilter === 'a' || state.dFilter === 'all') pick.a.forEach(i => items.push({k: 'a', pg: r.ua[i].page, i}));
  if (state.dFilter === 'b' || state.dFilter === 'all') pick.b.forEach(j => items.push({k: 'b', pg: r.ub[j].page, j}));
  if (state.dFilter === 'all') items.sort((x, y) => x.pg - y.pg);
  const shown = items.slice(0, state.dLimit);
  const item = it => {
    if (it.k === 'mod'){ const ua = r.ua[it.p.i], ub = r.ub[it.p.j]; const w = wordDiff(ua.t, ub.t);
      return `<div class="dfi"><div class="dfc"><div class="pgs">p. ${ua.page}</div><div class="tx">${w.a}</div></div><div class="dfc"><div class="pgs">p. ${ub.page}</div><div class="tx">${w.b}</div></div></div>`; }
    if (it.k === 'a'){ const u = r.ua[it.i]; return `<div class="dfi"><div class="dfc"><div class="pgs">p. ${u.page}</div><div class="tx"><del>${esc(u.t)}</del></div></div><div class="dfc empty">Absent de cette notice</div></div>`; }
    const u = r.ub[it.j]; return `<div class="dfi"><div class="dfc empty">Absent de cette notice</div><div class="dfc"><div class="pgs">p. ${u.page}</div><div class="tx"><ins>${esc(u.t)}</ins></div></div></div>`;
  };
  $('#printhead').innerHTML = `<h1>Ce qui change : ${esc(A.name)} et ${esc(B.name)}</h1><p>${esc(fullName(A))} et ${esc(fullName(B))}. ${pct} % de passages identiques. Imprimé le ${today()}.</p>`;
  $('#main').innerHTML = fixNote(fixes) + controls +
    `<p class="summary">${pct} % des passages sont identiques. ${plural(r.mod.length, 'passage modifié', 'passages modifiés')}, ${plural(r.onlyA.length, 'passage seulement dans A', 'passages seulement dans A')}, ${plural(r.onlyB.length, 'passage seulement dans B', 'passages seulement dans B')}.${hasTerms ? ' Filtré par votre recherche.' : ''}</p>` +
    (pct < 35 ? `<p class="fixnote">Ces deux notices sont très différentes. Pour comparer un sujet précis, la recherche puis « Comparer côte à côte » est plus lisible.</p>` : '') +
    `<div class="dchips">${chip('mod', 'Modifiés', pick.mod.length)}${chip('a', 'Seulement dans A', pick.a.length)}${chip('b', 'Seulement dans B', pick.b.length)}${chip('all', 'Tout', pick.mod.length + pick.a.length + pick.b.length)}<button class="btn small" data-act="print" style="margin-left:auto">Imprimer</button></div>` +
    (items.length ? `<div class="dfhead"><div>A : ${esc(fullName(A))}</div><div>B : ${esc(fullName(B))}</div></div>` + shown.map(item).join('') +
      (items.length > shown.length ? `<p><button class="btn" data-act="more">Afficher la suite (${items.length - shown.length} restants)</button></p>` : '') : `<p class="none">Aucune différence de ce type${hasTerms ? ' pour cette recherche' : ''}.</p>`) +
    `<p class="knote">Rouge barré : texte de la notice A absent de B. Vert : texte propre à B. Les passages sont comparés phrase par phrase, sans tenir compte des accents ni de la ponctuation.</p>`;
}

/* ---------- Structure de la page ---------- */
function renderFilters(){
  const ass = [...new Set(DOCS.map(d => d.assureur))].sort((a, b) => a.localeCompare(b, 'fr'));
  $('#fAss').innerHTML = '<option value="">Tous les assureurs</option>' + ass.map(a => `<option value="${esc(a)}">${esc(a)}</option>`).join('');
  $('#fAss').value = state.ass; $('#fBase').value = state.base;
  const groups = {};
  DOCS.forEach(d => { (groups[d.produit + ' (' + d.assureur + ')'] = groups[d.produit + ' (' + d.assureur + ')'] || []).push(d); });
  $('#fClient').innerHTML = '<option value="">Toutes les notices</option>' + Object.keys(groups).sort((a, b) => a.localeCompare(b, 'fr')).map(g =>
    `<optgroup label="${esc(g)}">${groups[g].map(d => `<option value="${d.id}">${esc(d.name + ', ' + d.version)}</option>`).join('')}</optgroup>`).join('');
  $('#fClient').value = state.client;
  const pages = DOCS.reduce((n, d) => n + d.pages.length, 0);
  $('#count').textContent = plural(DOCS.length, 'notice', 'notices') + ', ' + plural(ass.length, 'assureur', 'assureurs') + ', ' + pages + ' pages';
}
function renderChrome(){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  $('#chips').hidden = state.tab !== 'search';
  $('#filters').hidden = !!state.client || state.tab === 'diff';
  const c = state.client ? byId(state.client) : null;
  $('#clientbar').classList.toggle('on', !!c);
  $('#clientHint').textContent = c ? `Recherche limitée à : ${fullName(c)}.` : 'Choisissez la notice du client : toutes les recherches se limitent à ce contrat.';
  $('#clear').hidden = !state.q; $('#kbd').hidden = !!state.q;
  const cur = state.q.trim();
  $('#chips').innerHTML = THEMES.map(([l, q]) => `<button class="chip${cur === q ? ' on' : ''}" data-q='${esc(q)}'>${esc(l)}</button>`).join('');
  $('#q').placeholder = state.tab === 'keys' ? 'Filtrer le tableau : franchise, plafond, âge…' : state.tab === 'diff' ? 'Ne montrer que les différences qui contiennent…' : 'Posez votre question : franchise, âge limite, exclusions sport, IPT…';
}
function renderBar(){
  const bar = $('#bar'), n = state.sel.size;
  if (state.tab !== 'search'){ bar.hidden = true; return; }
  if (state.mode === 'compare'){
    bar.hidden = false;
    bar.innerHTML = `<span>Comparaison de ${plural(compareDocs().length, 'notice', 'notices')}</span><button class="btn" data-act="back">Retour aux résultats</button>`;
  } else if (n){
    bar.hidden = false;
    bar.innerHTML = `<span>${plural(n, 'notice cochée', 'notices cochées')}</span>
      <button class="btn" data-act="compare"${n < 2 ? ' disabled' : ''}>${n < 2 ? 'Cochez-en une autre pour comparer' : 'Comparer les notices cochées'}</button>
      <button class="btn ghost" data-act="clearsel">Tout décocher</button>`;
  } else bar.hidden = true;
}
function renderMain(){
  $('#printhead').innerHTML = '';
  if (state.tab === 'keys') renderKeys(); else if (state.tab === 'diff') renderDiff(); else renderSearch();
}
function renderLight(){ renderChrome(); renderMain(); renderBar(); syncHash(); }
function render(){ renderFilters(); renderLight(); }

/* ---------- Lien de la recherche (adresse de la page) ---------- */
function hashParams(){
  const p = new URLSearchParams();
  if (state.tab !== 'search') p.set('t', state.tab);
  if (state.q) p.set('q', state.q);
  if (state.client) p.set('c', state.client);
  if (state.ass) p.set('a', state.ass);
  if (state.base) p.set('b', state.base);
  if (state.mode === 'compare' && state.tab === 'search') p.set('m', 'compare');
  if (state.tab === 'diff'){ p.set('da', state.dA); p.set('db', state.dB); }
  return p.toString();
}
function syncHash(){ try { history.replaceState(null, '', '#' + hashParams()); } catch (e) {} }
function loadHash(){
  try {
    const p = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    const t = p.get('t'); if (t === 'keys' || t === 'diff') state.tab = t;
    state.q = p.get('q') || ''; $('#q').value = state.q;
    const c = p.get('c'); if (c && byId(c)) state.client = c;
    state.ass = p.get('a') || ''; state.base = p.get('b') || '';
    if (p.get('m') === 'compare') state.mode = 'compare';
    if (p.get('da') && byId(p.get('da'))) state.dA = p.get('da');
    if (p.get('db') && byId(p.get('db'))) state.dB = p.get('db');
  } catch (e) {}
}
function shareLink(){ let base = ''; try { base = location.href.split('#')[0]; } catch (e) {} return base + '#' + hashParams(); }

/* ---------- Lecteur ---------- */
let reader = null;
function openReader(id, page){
  reader = {id, page: page || 0, terms: T().terms};
  $('#reader').hidden = false; document.body.classList.add('noscroll');
  renderReader(); $('#rClose').focus();
}
function closeReader(){ reader = null; $('#reader').hidden = true; document.body.classList.remove('noscroll'); }
function renderReader(){
  const d = byId(reader.id), n = d.pages.length, p = reader.page;
  $('#rTitle').textContent = d.name;
  $('#rSub').textContent = [d.assureur, baseTxt(d), 'version ' + d.version, 'réf. ' + d.ref].join(', ');
  $('#rPage').value = p + 1; $('#rPage').max = n; $('#rTotal').textContent = '/ ' + n;
  $('#rPrev').disabled = p <= 0; $('#rNext').disabled = p >= n - 1;
  const txt = d.pages[p];
  $('#rText').innerHTML = txt ? highlight(txt, reader.terms) : '<span class="muted">Cette page ne contient pas de texte (page de garde ou image).</span>';
  const hitPages = reader.terms.length ? d._n.map((t, i) => reader.terms.some(k => termRanges(t, k).length) ? i : -1).filter(i => i >= 0) : [];
  const hb = $('#rHits'); hb.hidden = !hitPages.length;
  hb.innerHTML = hitPages.length ? '<span>Pages avec résultats :</span>' + hitPages.slice(0, 60).map(i => `<button data-goto="${i}" class="${i === p ? 'on' : ''}">${i + 1}</button>`).join('') : '';
  const m = $('#rText mark');
  if (m) m.scrollIntoView({block: 'center'}); else $('#rBody').scrollTop = 0;
}
function gotoPage(i){ const n = byId(reader.id).pages.length; reader.page = Math.max(0, Math.min(n - 1, i)); renderReader(); }
let tt;
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(tt); tt = setTimeout(() => { el.hidden = true; }, 3200); }
function copyText(text, msg){
  const done = () => toast(msg || 'Copié.');
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { toast('Copie impossible : sélectionnez le texte à la main.'); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
function printPage(){ try { window.print(); } catch (e) { toast('Impression bloquée ici : utilisez Ctrl+P (ou Cmd+P).'); } }

/* ---------- Événements ---------- */
let deb;
$('#q').addEventListener('input', e => {
  clearTimeout(deb);
  deb = setTimeout(() => { state.q = e.target.value; state.dLimit = 40; renderLight(); }, 90);
  $('#clear').hidden = !e.target.value; $('#kbd').hidden = !!e.target.value;
});
$('#clear').addEventListener('click', () => { $('#q').value = ''; state.q = ''; renderLight(); $('#q').focus(); });
$('#fAss').addEventListener('change', e => { state.ass = e.target.value; renderLight(); });
$('#fBase').addEventListener('change', e => { state.base = e.target.value; renderLight(); });
$('#fClient').addEventListener('change', e => { state.client = e.target.value; state.sel.clear(); state.mode = 'search'; renderLight(); });
$('#btnLink').addEventListener('click', () => copyText(shareLink(), 'Lien copié. Collez-le dans un mail ou un message.'));
document.addEventListener('click', e => {
  const t = e.target.closest('[data-q],[data-open],[data-act],[data-goto],[data-tab],[data-cp],[data-df],[data-cpfiche]');
  if (!t) return;
  if (t.dataset.tab){ state.tab = t.dataset.tab; state.mode = 'search'; renderLight(); return; }
  if (t.dataset.cpfiche){ const f = FICHES.find(x => x.id === t.dataset.cpfiche); copyText(ficheText(f, filtered()), 'Copié : la réponse avec ses pages.'); return; }
  if (t.dataset.q !== undefined){
    const same = state.q.trim() === t.dataset.q;
    state.q = same ? '' : t.dataset.q; $('#q').value = state.q; state.mode = 'search'; renderLight();
  } else if (t.dataset.cp){
    const [id, a, b] = t.dataset.cp.split('|'); const d = byId(id); const us = splitPassages(d);
    copyText(winText(us, +a, +b) + '\n\nSource : ' + fullName(d) + ', p. ' + us[+a].page, 'Copié : passage et source.');
  } else if (t.dataset.open){ openReader(t.dataset.open, t.dataset.page ? +t.dataset.page : 0); }
  else if (t.dataset.goto !== undefined){ gotoPage(+t.dataset.goto); }
  else if (t.dataset.df){ state.dFilter = t.dataset.df; state.dLimit = 40; renderLight(); }
  else if (t.dataset.act === 'compare' || t.dataset.act === 'compare-all'){ state.mode = 'compare'; renderLight(); window.scrollTo(0, 0); }
  else if (t.dataset.act === 'back'){ state.mode = 'search'; renderLight(); }
  else if (t.dataset.act === 'clearsel'){ state.sel.clear(); renderLight(); }
  else if (t.dataset.act === 'print'){ printPage(); }
  else if (t.dataset.act === 'report'){ copyText('Question à ajouter dans l\'outil de recherche des notices : « ' + state.q + ' »' + (state.client ? ' (contrat : ' + fullName(byId(state.client)) + ')' : '') + '\nLien : ' + shareLink(), 'Copié : collez-le dans un message à la personne qui gère l\'outil.'); }
  else if (t.dataset.act === 'swap'){ const x = state.dA; state.dA = state.dB; state.dB = x; renderLight(); }
  else if (t.dataset.act === 'more'){ state.dLimit += 60; renderLight(); }
});
document.addEventListener('change', e => {
  const c = e.target.closest('[data-sel]');
  if (c){
    if (c.checked) state.sel.add(c.dataset.sel); else state.sel.delete(c.dataset.sel);
    renderBar(); document.querySelectorAll(`[data-sel="${c.dataset.sel}"]`).forEach(x => { x.checked = c.checked; });
    return;
  }
  if (e.target.id === 'hl'){ state.hl = e.target.checked; renderLight(); }
  if (e.target.id === 'dA' || e.target.id === 'dB'){
    if (e.target.id === 'dA') state.dA = e.target.value; else state.dB = e.target.value;
    state.dLimit = 40; renderLight();
  }
});
$('#rClose').addEventListener('click', closeReader);
$('#rPrev').addEventListener('click', () => gotoPage(reader.page - 1));
$('#rNext').addEventListener('click', () => gotoPage(reader.page + 1));
$('#rPage').addEventListener('change', e => gotoPage((parseInt(e.target.value, 10) || 1) - 1));
$('#rCopy').addEventListener('click', () => {
  const d = byId(reader.id);
  copyText(d.pages[reader.page] + '\n\nSource : ' + fullName(d) + ', p. ' + (reader.page + 1), 'Copié : page et source.');
});
document.addEventListener('keydown', e => {
  const typing = /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
  if (e.key === 'Escape' && reader) closeReader();
  else if (reader && !typing){ if (e.key === 'ArrowRight') gotoPage(reader.page + 1); if (e.key === 'ArrowLeft') gotoPage(reader.page - 1); }
  else if (e.key === '/' && !typing && !reader){ e.preventDefault(); $('#q').focus(); }
});
window.addEventListener('hashchange', () => { const h = (location.hash || '').replace(/^#/, ''); if (h !== hashParams()){ loadHash(); render(); } });

$('#foot').textContent = 'Cet outil retrouve l\'information dans les notices d\'information. Les garanties, franchises et options applicables à un client figurent dans son certificat d\'adhésion. Notices intégrées le 29 septembre 2026.';
loadHash();
render();
if (window.matchMedia && matchMedia('(hover:hover)').matches) $('#q').focus();
})();
</script>
</body>
</html>
